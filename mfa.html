<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MFA Lab: Prove It’s You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f5fa; --surface:#ffffff; --surface-2:#e9eff8; --ink:#13213b; --ink-2:#4b5a78; --line:#d3dcea;
  --navy:#0047AB; --navy-2:#0a3a85; --on-navy:#ffffff; --navy-soft:#e3ecfa;
  --green:#00a86b; --green-ink:#007a4e; --green-soft:#ddf5ea;
  --red:#b42318; --red-soft:#fdeceb; --amber:#985a06; --amber-soft:#fff2dc;
  --bezel:#1d2638; --screen:#f7f9fc; --screen-ink:#13213b; --term:#0f1a2c; --term-ink:#cfe3ff;
  --shadow:0 1px 2px rgba(19,33,59,.06),0 8px 24px rgba(19,33,59,.07);
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1525; --surface:#14213a; --surface-2:#1b2b48; --ink:#e6edf8; --ink-2:#a9b7d0; --line:#2a3b5c;
    --navy:#5b8ff0; --navy-2:#7aa5f5; --on-navy:#07152c; --navy-soft:#1c2f55;
    --green:#2bd49a; --green-ink:#5fe3b3; --green-soft:#123a30;
    --red:#ff7b6e; --red-soft:#3d1c1d; --amber:#f2b552; --amber-soft:#3a2b12;
    --bezel:#050a14; --screen:#101a2d; --screen-ink:#e6edf8; --term:#060c18; --term-ink:#cfe3ff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1525; --surface:#14213a; --surface-2:#1b2b48; --ink:#e6edf8; --ink-2:#a9b7d0; --line:#2a3b5c;
  --navy:#5b8ff0; --navy-2:#7aa5f5; --on-navy:#07152c; --navy-soft:#1c2f55;
  --green:#2bd49a; --green-ink:#5fe3b3; --green-soft:#123a30;
  --red:#ff7b6e; --red-soft:#3d1c1d; --amber:#f2b552; --amber-soft:#3a2b12;
  --bezel:#050a14; --screen:#101a2d; --screen-ink:#e6edf8; --term:#060c18; --term-ink:#cfe3ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{line-height:1.2;margin:0}
p{margin:0 0 .8em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
code,.mono{font-family:var(--mono)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:20px;padding:12px 24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.brand p{margin:0;font-size:.85rem;color:var(--ink-2)}
.meter{display:flex;flex-direction:column;gap:4px;min-width:200px}
.meter span{font-size:.8rem;color:var(--ink-2);font-weight:600}
.segs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.segs i{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.segs i.part{background:var(--navy-soft);border-color:var(--navy)}
.segs i.done{background:var(--green);border-color:var(--green)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.btn.primary:hover{background:var(--navy-2)}
.btn.good{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.badge{background:var(--navy);color:var(--on-navy);border-radius:999px;font-size:.72rem;padding:1px 7px;min-width:22px;text-align:center}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;max-width:1320px;margin:0 auto;padding:24px}
nav ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px)}
nav button{width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;color:var(--ink-2);font-weight:500}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button[aria-current="step"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--ink-2);background:var(--surface)}
.dot.part{border-color:var(--navy);color:var(--navy)}
.dot.done{border-color:var(--green);background:var(--green);color:#fff}
nav small{display:block;font-size:.75rem;color:var(--ink-2);font-weight:500}

main{min-width:0;outline:none}
.mission-head{max-width:72ch;margin-bottom:20px}
.mission-head .step{color:var(--navy);font-weight:700;font-size:.9rem;margin-bottom:6px}
.mission-head h2{font-size:clamp(1.6rem,2.6vw,2.2rem);font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.mission-head p{color:var(--ink-2);font-size:1.05rem}
.goal{display:flex;gap:10px;align-items:flex-start;background:var(--navy-soft);border-left:4px solid var(--navy);padding:10px 14px;border-radius:0 10px 10px 0;color:var(--ink);font-size:.95rem;max-width:72ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.panel h3{font-size:1.1rem;margin-bottom:8px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink-2)}
.small{font-size:.88rem}

/* feedback */
.fb{border-radius:12px;padding:12px 14px;font-size:.95rem;border:1px solid}
.fb.ok{background:var(--green-soft);border-color:var(--green);color:var(--ink)}
.fb.bad{background:var(--red-soft);border-color:var(--red);color:var(--ink)}
.fb.warn{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}
.fb strong{display:block;margin-bottom:2px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

/* ---------- devices ---------- */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.browser{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.urlbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.url{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--mono);font-size:.85rem;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.url svg{flex:none;width:14px;height:14px}
.url .host{font-weight:600}
.url.evil .host{color:var(--red)}
.page{padding:28px;min-height:360px}
.sso{max-width:380px;margin:0 auto}
.sso-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;margin-bottom:18px}
.sso-logo b{width:34px;height:34px;border-radius:8px;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-size:.9rem}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:600;font-size:.9rem}
.field input{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:1rem}
.field input:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 3px var(--navy-soft)}
.field .hint{font-size:.8rem;color:var(--ink-2)}
input.code{font-family:var(--mono);font-size:1.5rem;letter-spacing:.35em;text-align:center}

.phone-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px)}
.phone{width:280px;margin:0 auto;background:var(--bezel);border-radius:42px;padding:12px;box-shadow:0 20px 50px rgba(10,25,50,.28)}
.screen{background:var(--screen);color:var(--screen-ink);border-radius:32px;min-height:540px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 6px;font-size:.78rem;font-weight:700}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:72px;height:22px;border-radius:12px;background:var(--bezel)}
.app-title{padding:10px 18px 6px;font-weight:800;font-size:1.15rem;display:flex;align-items:center;justify-content:space-between}
.app-body{padding:6px 14px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.otp-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.otp-acct{font-size:.85rem;font-weight:700}
.otp-acct small{display:block;font-weight:500;color:var(--ink-2)}
.otp-row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.otp-code{font-family:var(--mono);font-size:2rem;font-weight:600;letter-spacing:.06em;color:var(--navy)}
.otp-code.low{color:var(--red)}
.ring{width:34px;height:34px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--navy);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.push{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}
.push h4{margin:0 0 4px;font-size:.95rem}
.push dl{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;margin:8px 0;font-size:.8rem}
.push dt{color:var(--ink-2)}
.push dd{margin:0;font-weight:600}
.push .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.push .acts button{border-radius:10px;padding:9px;font-weight:700;border:1px solid var(--line);background:var(--surface-2)}
.push .acts .ap{background:var(--green);border-color:var(--green);color:#fff}
.push .acts .dn{color:var(--red);border-color:var(--red);background:var(--surface)}
.push.mini{padding:10px 12px;opacity:.95}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.nums button{font-family:var(--mono);font-size:1.4rem;font-weight:600;padding:12px 0;border-radius:12px;border:1.5px solid var(--navy);background:var(--surface);color:var(--navy)}
.nums button:hover{background:var(--navy);color:var(--on-navy)}
.sms{background:var(--surface-2);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:.84rem;animation:drop .35s ease-out}
.sms b{display:block;font-size:.75rem;color:var(--ink-2)}
.lock-time{text-align:center;padding:12px 0 4px;font-size:3rem;font-weight:300;letter-spacing:-.02em}
.lock-date{text-align:center;font-size:.85rem;color:var(--ink-2);margin-bottom:6px}
.big-number{font-family:var(--mono);font-size:4rem;font-weight:600;color:var(--navy);text-align:center;letter-spacing:.06em;margin:12px 0}

/* sort game */
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:56px;padding:14px;border:2px dashed var(--line);border-radius:14px;background:var(--surface)}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.92rem;box-shadow:var(--shadow)}
.chip:hover{border-color:var(--navy)}
.chip.sel{background:var(--navy);border-color:var(--navy);color:var(--on-navy);transform:translateY(-2px)}
.chip.placed{box-shadow:none;cursor:default;border-color:var(--green);background:var(--green-soft);font-size:.85rem;padding:5px 11px}
.bins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.bin{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:14px;min-height:180px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,background .15s}
.bin:hover,.bin.over{border-color:var(--navy);background:var(--navy-soft)}
.bin .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--navy-soft);color:var(--navy)}
.bin .ico svg{width:22px;height:22px}
.bin h4{margin:0;font-size:1rem}
.bin .eg{font-size:.8rem;color:var(--ink-2);font-weight:500}
.bin .got{display:flex;flex-wrap:wrap;gap:6px}
.combo{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.combo:first-of-type{border-top:0}
.yn{display:flex;gap:8px}

/* choices */
.choices{display:flex;flex-direction:column;gap:8px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;font-weight:500;display:flex;gap:10px;align-items:flex-start}
.choice:hover:not([disabled]){border-color:var(--navy)}
.choice .k{flex:none;width:24px;height:24px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.choice.right{border-color:var(--green);background:var(--green-soft)}
.choice.wrong{border-color:var(--red);background:var(--red-soft)}
.choice[disabled]{cursor:default}

/* terminal */
.term{background:var(--term);color:var(--term-ink);border-radius:12px;padding:14px 16px;font-family:var(--mono);font-size:.82rem;line-height:1.7;min-height:120px;overflow-x:auto}
.term .r{color:#ff8f86}.term .g{color:#5fe3b3}.term .y{color:#f2c46b}.term .d{color:#7f93b5}
.term div{animation:fade .3s}
@keyframes fade{from{opacity:0}}

/* security key */
.key{display:flex;align-items:center;gap:0;margin:16px auto 6px;width:max-content;border:0;background:none;padding:0}
.key .body{width:120px;height:44px;background:#1f2a3d;border:1px solid #4a5b7c;border-radius:10px 6px 6px 10px;display:flex;align-items:center;justify-content:center;position:relative}
.key .pad{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffd77a,#d49a17);box-shadow:0 0 0 3px rgba(255,215,122,.25)}
.key.blink .pad{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(255,215,122,.0),0 0 18px 4px rgba(255,200,80,.7)}}
.key .usb{width:30px;height:24px;background:linear-gradient(#c9d2df,#9aa6b8);border-radius:0 3px 3px 0}
.key-cap{text-align:center;font-size:.85rem;color:var(--ink-2)}

/* hood */
details.hood{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 16px}
details.hood summary{padding:14px 0;font-weight:700;cursor:pointer}
.hood-grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.88rem;padding-bottom:16px;align-items:baseline}
.hood-grid dt{color:var(--ink-2)}
.hood-grid dd{margin:0;font-family:var(--mono);word-break:break-all}
.hood-grid mark{background:var(--amber-soft);color:var(--amber);border-radius:3px;padding:0 2px;font-weight:700}
.qr{width:132px;height:132px;background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line)}
.secret{font-family:var(--mono);font-size:1.05rem;letter-spacing:.08em;background:var(--surface-2);padding:6px 10px;border-radius:8px;display:inline-block}

/* policy console */
.scenario{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--surface)}
.scenario h4{margin:0 0 6px;font-size:1rem}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);margin-bottom:8px}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(8,16,32,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#drawer.on{transform:none}
.dhead{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dbody{padding:16px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.scores{width:100%;border-collapse:collapse;font-size:.88rem}
.scores td,.scores th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.scores td:last-child,.scores th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.loglist{list-style:none;margin:0;padding:0;font-size:.84rem}
.loglist li{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.loglist time{color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.loglist .ok{color:var(--green-ink);font-weight:700}
.loglist .no{color:var(--red);font-weight:700}
textarea.dump{width:100%;min-height:140px;font-family:var(--mono);font-size:.75rem;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink);padding:10px}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:12px;font-weight:600;font-size:.9rem;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

.cert{border:2px solid var(--green);border-radius:18px;padding:24px;background:var(--surface);text-align:center}
.cert h3{font-size:1.5rem;margin-bottom:6px}
.objectives{margin:0;padding-left:1.2em}
.objectives li{margin-bottom:6px}

@media (max-width:1020px){
  .lab{grid-template-columns:1fr}
  .phone-wrap{position:static}
  .bins{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr;padding:16px;gap:16px}
  nav ol{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  nav button{grid-template-columns:28px auto;white-space:nowrap}
  nav small{display:none}
  .top{padding:10px 16px;gap:10px}
  .meter{min-width:0;flex:1}
  .page{padding:18px}
  .bins{grid-template-columns:1fr}
  .combo{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 3 6 8v10c0 9 6 16 14 19 8-3 14-10 14-19V8L20 3z" fill="#0047AB"/><circle cx="17" cy="19" r="5" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M21 21h9v3M27 21v3" stroke="#00a86b" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
    <div><h1>MFA Lab</h1><p>Multi-factor authentication, hands on</p></div>
  </div>
  <div class="meter"><span id="meterText">0 of 7 missions complete</span><div class="segs" id="segs"></div></div>
  <button class="btn" id="themeBtn" aria-pressed="false">Dark mode</button>
  <button class="btn" id="logBtn" aria-controls="drawer">Progress log <span class="badge" id="logCount">0</span></button>
</header>

<div class="shell">
  <nav aria-label="Missions"><ol id="nav"></ol></nav>
  <main id="stage" tabindex="-1"></main>
</div>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-label="Progress log">
  <div class="dhead"><h2 style="font-size:1.15rem">Progress log</h2><button class="btn" id="closeLog">Close</button></div>
  <div class="dbody" id="dbody"></div>
</aside>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ================= core state & logging ================= */
const KEY='mfa-lab-progress-v1', THEME_KEY='mfa-lab-theme';
const MISSIONS=[
  {id:'m0',title:'Briefing',sub:'Who you are and what you’ll do',max:0},
  {id:'m1',title:'Sort the factors',sub:'Know, have, are, somewhere',max:17},
  {id:'m2',title:'Set up an authenticator',sub:'Enroll and use TOTP',max:3},
  {id:'m3',title:'Approve a push',sub:'Number matching',max:3},
  {id:'m4',title:'Survive push bombing',sub:'MFA fatigue attack',max:3},
  {id:'m5',title:'Beat the phishing proxy',sub:'Adversary-in-the-middle',max:3},
  {id:'m6',title:'Set the policy',sub:'Admin decisions',max:6},
  {id:'m7',title:'Knowledge check',sub:'10 questions',max:10}
];
const fresh=()=>({student:'',studentId:'',started:null,current:'m0',secret:null,missions:{},log:[]});
let S=load();
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.missions)return v;}catch(e){}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function M(id){return S.missions[id]||(S.missions[id]={score:0,done:false,attempts:0,data:{}});}
function award(id,pts){M(id).score=Math.min(MISSIONS.find(m=>m.id===id).max,M(id).score+pts);save();renderChrome();}
function complete(id){const m=M(id);if(m.done)return;m.done=true;logEv(id,'Mission complete',`Score ${m.score}/${MISSIONS.find(x=>x.id===id).max}`,true);toast(`Mission complete: ${MISSIONS.find(x=>x.id===id).title}`);save();renderChrome();}
function logEv(mid,ev,detail='',ok=null){S.log.push({t:new Date().toISOString(),mission:mid,event:ev,detail,result:ok===null?'':(ok?'correct':'incorrect')});save();renderChrome();if(drawerOpen)renderDrawer();}
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const userName=()=>(S.student||'student').trim().toLowerCase().replace(/[^a-z]+/g,'.').replace(/^\.|\.$/g,'')||'student';
const email=()=>userName()+'@prairietech.edu';

/* timers cleared whenever a mission re-renders */
let timers=[];function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t;}
function clearTimers(){timers.forEach(clearTimeout);timers=[];}

/* ================= theme ================= */
function applyTheme(t){document.documentElement.dataset.theme=t;const b=$('#themeBtn');b.textContent=t==='dark'?'Light mode':'Dark mode';b.setAttribute('aria-pressed',t==='dark');}
let theme='light';try{theme=localStorage.getItem(THEME_KEY)||'light';}catch(e){}
applyTheme(theme);
$('#themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme(theme);try{localStorage.setItem(THEME_KEY,theme);}catch(e){}};

/* ================= chrome: nav, meter, drawer ================= */
function status(id){const m=S.missions[id];if(!m)return'';return m.done?'done':'part';}
function renderChrome(){
  const counted=MISSIONS.slice(1);
  const done=counted.filter(m=>M(m.id).done).length;
  $('#meterText').textContent=`${done} of 7 missions complete`;
  $('#segs').innerHTML=counted.map(m=>`<i class="${status(m.id)}" title="${esc(m.title)}"></i>`).join('');
  $('#nav').innerHTML=MISSIONS.map((m,i)=>{const st=i===0?(S.started?'done':''):status(m.id);
    return `<li><button data-go="${m.id}" ${S.current===m.id?'aria-current="step"':''}><span class="dot ${st}">${st==='done'?'✓':i===0?'★':i}</span><span>${esc(m.title)}<small>${esc(m.sub)}</small></span></button></li>`}).join('');
  $('#logCount').textContent=S.log.length;
}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go);});
let drawerOpen=false;
function openDrawer(on){drawerOpen=on;$('#drawer').classList.toggle('on',on);$('#scrim').classList.toggle('on',on);$('#drawer').setAttribute('aria-hidden',!on);if(on){renderDrawer();$('#closeLog').focus();}}
$('#logBtn').onclick=()=>openDrawer(true);$('#closeLog').onclick=()=>openDrawer(false);$('#scrim').onclick=()=>openDrawer(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawerOpen)openDrawer(false);});
function totals(){let s=0,m=0;MISSIONS.slice(1).forEach(x=>{s+=M(x.id).score;m+=x.max;});return{s,m,pct:Math.round(100*s/m)};}
function renderDrawer(){
  const T=totals();
  const rows=MISSIONS.slice(1).map(x=>`<tr><td>${esc(x.title)}</td><td>${M(x.id).done?'Complete':(S.missions[x.id]?'In progress':'Not started')}</td><td>${M(x.id).score}/${x.max}</td></tr>`).join('');
  const items=S.log.slice().reverse().map(l=>`<li><time>${new Date(l.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</time><span><b>${esc(MISSIONS.find(m=>m.id===l.mission)?.title||l.mission)}:</b> ${esc(l.event)}${l.result?` <span class="${l.result==='correct'?'ok':'no'}">${l.result==='correct'?'✓':'✗'}</span>`:''}${l.detail?`<br><span class="muted">${esc(l.detail)}</span>`:''}</span></li>`).join('')||'<li><span></span><span class="muted">No activity yet. Start with the briefing.</span></li>';
  $('#dbody').innerHTML=`
   <div><div class="muted small">Student</div><div style="font-weight:700">${esc(S.student||'Not entered')}${S.studentId?` · ID ${esc(S.studentId)}`:''}</div>
   ${S.started?`<div class="muted small">Started ${new Date(S.started).toLocaleString()}</div>`:''}</div>
   <div><table class="scores"><thead><tr><th>Mission</th><th>Status</th><th>Score</th></tr></thead><tbody>${rows}</tbody>
   <tfoot><tr><th>Total</th><th></th><th>${T.s}/${T.m} (${T.pct}%)</th></tr></tfoot></table></div>
   <div class="row"><button class="btn primary" id="dlCsv">Download CSV</button><button class="btn" id="dlJson">Download JSON</button><button class="btn" id="showTxt">Show as text</button></div>
   <textarea class="dump" id="dump" hidden readonly aria-label="Log as text"></textarea>
   <div><h3 style="font-size:1rem;margin-bottom:6px">Activity</h3><ul class="loglist">${items}</ul></div>
   <button class="btn danger" id="resetAll">Reset all progress</button>`;
  $('#dlCsv').onclick=()=>download(csv(),`mfa-lab-${userName()}.csv`,'text/csv');
  $('#dlJson').onclick=()=>download(JSON.stringify(exportObj(),null,2),`mfa-lab-${userName()}.json`,'application/json');
  $('#showTxt').onclick=()=>{const d=$('#dump');d.hidden=!d.hidden;d.value=csv();if(!d.hidden){d.focus();d.select();}};
  $('#resetAll').onclick=()=>{if(confirm('Erase all progress and the activity log on this device?')){S=fresh();save();openDrawer(false);go('m0');toast('Progress reset');}};
}
function exportObj(){const T=totals();return{student:S.student,studentId:S.studentId,started:S.started,exported:new Date().toISOString(),total:`${T.s}/${T.m}`,percent:T.pct,
  missions:MISSIONS.slice(1).map(x=>({mission:x.title,complete:M(x.id).done,score:M(x.id).score,max:x.max})),log:S.log};}
function csv(){const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['timestamp','student','student_id','mission','event','detail','result'];
  const lines=S.log.map(l=>[l.t,S.student,S.studentId,MISSIONS.find(m=>m.id===l.mission)?.title||l.mission,l.event,l.detail,l.result].map(q).join(','));
  const T=totals();lines.push([new Date().toISOString(),S.student,S.studentId,'SUMMARY','Total score',`${T.s}/${T.m}`,`${T.pct}%`].map(q).join(','));
  return [head.join(','),...lines].join('\n');}
function download(text,name,type){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast(`Saved ${name}`);}catch(e){toast('Download blocked here. Use “Show as text” and copy instead.');}}

/* ================= TOTP (RFC 6238, real HMAC-SHA1) ================= */
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function newSecret(){const b=new Uint8Array(10);crypto.getRandomValues(b);let bits='';b.forEach(x=>bits+=x.toString(2).padStart(8,'0'));let s='';for(let i=0;i<bits.length;i+=5)s+=B32[parseInt(bits.substr(i,5).padEnd(5,'0'),2)];return s;}
function b32decode(s){let bits='';for(const c of s.toUpperCase()){const v=B32.indexOf(c);if(v>=0)bits+=v.toString(2).padStart(5,'0');}const o=new Uint8Array(Math.floor(bits.length/8));for(let i=0;i<o.length;i++)o[i]=parseInt(bits.substr(i*8,8),2);return o;}
const hasSubtle=!!(window.crypto&&crypto.subtle);
const otpCache={};
async function totpAt(secret,counter){
  const k=secret+':'+counter;if(otpCache[k])return otpCache[k];
  let h;
  if(hasSubtle){
    const key=await crypto.subtle.importKey('raw',b32decode(secret),{name:'HMAC',hash:'SHA-1'},false,['sign']);
    const buf=new ArrayBuffer(8),dv=new DataView(buf);dv.setUint32(0,Math.floor(counter/4294967296));dv.setUint32(4,counter>>>0);
    h=new Uint8Array(await crypto.subtle.sign('HMAC',key,buf));
  }else{ /* fallback: simulated digest if Web Crypto is unavailable */
    h=new Uint8Array(20);let x=2166136261;const str=secret+counter;for(let i=0;i<20;i++){x^=str.charCodeAt(i%str.length)+i;x=Math.imul(x,16777619)>>>0;h[i]=x&255;}
  }
  const off=h[19]&15;const bin=((h[off]&127)<<24)|(h[off+1]<<16)|(h[off+2]<<8)|h[off+3];
  return otpCache[k]={code:String(bin%1e6).padStart(6,'0'),hmac:[...h].map(b=>b.toString(16).padStart(2,'0')),off,bin,counter};
}
const counterNow=()=>Math.floor(Date.now()/30000);
function ensureSecret(){if(!S.secret){S.secret=newSecret();save();}return S.secret;}
async function verifyOtp(code){const c=counterNow();
  for(const d of [0,-1,1]){if((await totpAt(S.secret,c+d)).code===code)return'ok';}
  for(const d of [-2,-3,-4,-5,-6]){if((await totpAt(S.secret,c+d)).code===code)return'expired';}
  return'bad';}
let lastCounter=-1,curOtp=null;
async function tick(){
  $$('.js-clock').forEach(e=>{if(!e.dataset.fixed)e.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}).replace(/\s?[AP]M/i,'');});
  if(!S.secret)return;
  const c=counterNow();if(c!==lastCounter){lastCounter=c;curOtp=await totpAt(S.secret,c);}
  const left=30-Math.floor((Date.now()/1000)%30);
  $$('.js-otp').forEach(e=>{e.textContent=curOtp.code.slice(0,3)+' '+curOtp.code.slice(3);e.classList.toggle('low',left<=5);});
  $$('.js-ring').forEach(e=>{e.style.strokeDashoffset=String(88*(1-left/30));});
  $$('.js-left').forEach(e=>e.textContent=left+' s');
  const hood=$('#hood');if(hood){
    const hex=curOtp.hmac.map((b,i)=>i>=curOtp.off&&i<curOtp.off+4?`<mark>${b}</mark>`:b).join(' ');
    hood.innerHTML=`<dt>Unix time</dt><dd>${Math.floor(Date.now()/1000)}</dd>
    <dt>Counter T</dt><dd>floor(time ÷ 30) = ${c}</dd>
    <dt>HMAC-SHA1</dt><dd>${hex}</dd>
    <dt>Offset</dt><dd>last nibble 0x${curOtp.hmac[19][1]} → byte ${curOtp.off}</dd>
    <dt>31-bit value</dt><dd>${curOtp.bin}</dd>
    <dt>mod 10⁶</dt><dd style="color:var(--navy);font-weight:700">${curOtp.code}</dd>
    <dt>Valid for</dt><dd>${left} s (server also accepts ±1 step for clock drift)</dd>
    ${hasSubtle?'':'<dt>Note</dt><dd>Web Crypto unavailable: digest is simulated.</dd>'}`;}
}
setInterval(tick,1000);

/* ================= reusable device markup ================= */
const lockIco='<svg viewBox="0 0 16 16"><path d="M4 7V5a4 4 0 0 1 8 0v2h1v8H3V7h1zm2 0h4V5a2 2 0 0 0-4 0v2z" fill="currentColor"/></svg>';
function browser(host,path,inner,evil=false){return `<div class="browser"><div class="urlbar"><div class="url ${evil?'evil':''}">${lockIco}<span>https://<span class="host">${esc(host)}</span>${esc(path)}</span></div></div><div class="page" id="page">${inner}</div></div>`;}
function phone(inner,opts={}){return `<div class="phone-wrap"><div class="phone" aria-label="Simulated phone"><div class="screen"><div class="notch"></div>
  <div class="sbar"><span class="js-clock" ${opts.time?`data-fixed="1"`:''}>${opts.time||''}</span><span>5G ▮</span></div><div id="phoneBody" style="display:flex;flex-direction:column;flex:1">${inner}</div></div></div></div>`;}
function otpCard(){return `<div class="otp-card"><div class="otp-acct">Prairie Tech SSO<small>${esc(email())}</small></div>
  <div class="otp-row"><span class="otp-code js-otp">--- ---</span><svg class="ring" viewBox="0 0 34 34"><circle class="bg" cx="17" cy="17" r="14"/><circle class="fg js-ring" cx="17" cy="17" r="14" stroke-dasharray="88"/></svg></div></div>`;}
const authApp=inner=>`<div class="app-title">Authenticator <span class="muted small">🔒</span></div><div class="app-body">${inner}</div>`;
const ssoLogo=(name='Prairie Tech')=>`<div class="sso-logo"><b>PT</b>${name} sign-in</div>`;
function head(i,title,lede,goal){return `<div class="mission-head"><div class="step">Mission ${i} of 7</div><h2>${title}</h2><p>${lede}</p></div>${goal?`<div class="goal"><span aria-hidden="true">🎯</span><span>${goal}</span></div>`:''}`;}
function qr(seed){let x=0;for(const c of seed)x=(x*31+c.charCodeAt(0))>>>0;const n=21,cells=[];const r=()=>{x^=x<<13;x^=x>>>17;x^=x<<5;x>>>=0;return x%2;};
  const finder=(i,j)=>{for(const[a,b]of[[0,0],[0,n-7],[n-7,0]]){if(i>=a&&i<a+7&&j>=b&&j<b+7){const y=i-a,z=j-b;return(y===0||y===6||z===0||z===6||(y>=2&&y<=4&&z>=2&&z<=4));}}return null;};
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const f=finder(i,j);if(f===true||(f===null&&r()))cells.push(`<rect x="${j}" y="${i}" width="1" height="1"/>`);}
  return `<svg class="qr" viewBox="0 0 ${n} ${n}" role="img" aria-label="Simulated QR code"><g fill="#13213b">${cells.join('')}</g></svg>`;}
function choiceQ(container,q,onAnswer){ /* q:{q,opts:[{t,ok,why}]} */
  const opts=shuffle(q.opts);const id='q'+Math.random().toString(36).slice(2,7);
  container.innerHTML=`<div class="stack"><div style="font-weight:700">${q.q}</div><div class="choices" id="${id}">${opts.map((o,i)=>`<button class="choice" data-i="${i}"><span class="k">${'ABCDE'[i]}</span><span>${o.t}</span></button>`).join('')}</div><div class="fbx"></div></div>`;
  let first=true;
  $('#'+id).addEventListener('click',e=>{const b=e.target.closest('.choice');if(!b||b.disabled)return;const o=opts[+b.dataset.i];
    if(o.ok){b.classList.add('right');$$('.choice',$('#'+id)).forEach(x=>x.disabled=true);container.querySelector('.fbx').innerHTML=`<div class="fb ok"><strong>Correct.</strong>${o.why||q.why||''}</div>`;onAnswer(true,first);}
    else{b.classList.add('wrong','shake');b.disabled=true;container.querySelector('.fbx').innerHTML=`<div class="fb bad"><strong>Not quite.</strong>${o.why||'Try another option.'}</div>`;onAnswer(false,first,o);first=false;}
  });}
</script>
<script>
/* ================= router ================= */
const R={};
function go(id){clearTimers();S.current=id;if(id!=='m0'&&!S.missions[id]){M(id);logEv(id,'Mission started');}save();renderChrome();
  const st=$('#stage');st.innerHTML='';R[id]();window.scrollTo({top:0,behavior:'smooth'});st.focus({preventScroll:true});}
function once(mid,flag,pts){const d=M(mid).data;if(d['p_'+flag])return false;d['p_'+flag]=1;award(mid,pts);return true;}
function nextBtn(id){const i=MISSIONS.findIndex(m=>m.id===id);const n=MISSIONS[i+1];return n?`<button class="btn primary" data-go="${n.id}">Next: ${esc(n.title)}</button>`:'';}
$('#stage').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go);});

/* ================= M0 briefing ================= */
R.m0=()=>{
  const nextUp=MISSIONS.slice(1).find(m=>!M(m.id).done)||MISSIONS[7];
  $('#stage').innerHTML=`
  <div class="mission-head"><div class="step">Briefing</div><h2>Assume your password is already stolen.</h2>
  <p>Billions of credentials circulate in breach dumps. In this lab you’ll sign in, get attacked, and make policy decisions, so you can see exactly what a second factor stops and what it doesn’t.</p></div>
  <div class="stack" style="max-width:820px">
   <div class="panel"><h3>Sign in to the lab</h3><p class="muted small">Your name labels your progress log. Everything stays in this browser until you download it.</p>
    <div class="row" style="align-items:flex-end">
     <div class="field" style="flex:2;min-width:200px;margin:0"><label for="nm">Your name</label><input id="nm" value="${esc(S.student)}" autocomplete="name" placeholder="First and last name"></div>
     <div class="field" style="flex:1;min-width:140px;margin:0"><label for="sid">Student ID (optional)</label><input id="sid" value="${esc(S.studentId)}"></div>
     <button class="btn primary" id="startBtn">${S.started?`Continue: ${esc(nextUp.title)}`:'Start the lab'}</button>
    </div><div id="m0fb" style="margin-top:10px"></div></div>
   <div class="panel"><h3>By the end you will be able to</h3><ul class="objectives">
    <li>Classify authentication factors and tell true multifactor authentication from two steps of the same factor.</li>
    <li>Enroll a time-based one-time password (TOTP) authenticator and explain how the six-digit code is computed.</li>
    <li>Approve a push sign-in with number matching and explain the attack it defends against.</li>
    <li>Recognize and respond to an MFA fatigue (push bombing) attack.</li>
    <li>Explain why adversary-in-the-middle phishing defeats codes and pushes but not FIDO2 security keys or passkeys.</li>
    <li>Choose MFA controls for privileged accounts, help desk resets, legacy protocols, and enrollment.</li></ul>
    <p class="muted small" style="margin-top:10px">Aligned with CompTIA Security+ SY0-701 objective 4.6, NIST SP 800-63B, CISA guidance on phishing-resistant MFA, and NICE Framework knowledge and skill statements for identity and access management.</p></div>
   <div class="panel"><h3>How it works</h3><p>Seven missions take about 40 minutes. The simulated phone on the right of each lab is your authenticator; its codes are generated with the real TOTP algorithm. You earn points for correct answers on the first try, and every action is written to the progress log. Open <b>Progress log</b> at any time to download a CSV or JSON record for your instructor.</p></div>
  </div>`;
  $('#startBtn').onclick=()=>{const n=$('#nm').value.trim();if(!n){$('#m0fb').innerHTML='<div class="fb warn">Enter your name so your instructor can match the log to you.</div>';$('#nm').focus();return;}
    const changed=n!==S.student;S.student=n;S.studentId=$('#sid').value.trim();
    if(!S.started){S.started=new Date().toISOString();logEv('m0','Lab started',`Student: ${n}`);}else if(changed)logEv('m0','Student name updated',n);
    save();go(nextUp.id);};
};

/* ================= M1 sort the factors ================= */
const FACT=[
 {t:'Password',c:'know',why:'A memorized secret.'},
 {t:'PIN',c:'know',why:'A short memorized secret.'},
 {t:'Answer to a security question',c:'know',why:'A memorized secret, and often guessable from social media.'},
 {t:'Authenticator app on your phone',c:'have',why:'It proves you hold the device that stores the secret seed.'},
 {t:'FIDO2 security key',c:'have',why:'A physical key holding a private key that never leaves it.'},
 {t:'Smart card (PIV or CAC)',c:'have',why:'A card with a chip that stores a private key.'},
 {t:'Code texted to your phone',c:'have',why:'You type it, but it proves possession of the phone number. That’s why SIM swapping defeats it.'},
 {t:'Fingerprint',c:'are',why:'A physical biometric trait.'},
 {t:'Face recognition',c:'are',why:'A physical biometric trait.'},
 {t:'Iris scan',c:'are',why:'A physical biometric trait.'},
 {t:'GPS location inside a geofence',c:'somewhere',why:'Where the sign-in comes from.'},
 {t:'Signing in from the campus network',c:'somewhere',why:'Network location: a useful conditional-access signal, weak on its own.'}];
const ico={know:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0-3.5 10.9V17h7v-3.1A6 6 0 0 0 12 3zM9.5 21h5"/></svg>',
 have:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>',
 are:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4a7 7 0 0 0-7 7v2M19 13v-2a7 7 0 0 0-3-5.7M9 11a3 3 0 0 1 6 0v3a8 8 0 0 1-2 5M12 11v4a6 6 0 0 1-2 4.5"/></svg>',
 somewhere:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s7-6.2 7-11.5a7 7 0 0 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>'};
const BINS=[{k:'know',n:'Something you know',d:'Knowledge'},{k:'have',n:'Something you have',d:'Possession'},{k:'are',n:'Something you are',d:'Inherence'},{k:'somewhere',n:'Somewhere you are',d:'Location'}];
const BIN_HINT={know:'Knowledge factors are secrets you memorize.',have:'Possession factors need a physical object or device present.',are:'Inherence factors are traits of your body or behavior.',somewhere:'Location factors describe where the sign-in comes from.'};
const COMBOS=[
 {t:'Password + answer to a security question',mfa:false,why:'Both are knowledge factors. Two of the same factor is two-step verification, not multifactor.'},
 {t:'Smart card + PIN',mfa:true,why:'Possession (the card) plus knowledge (the PIN). This is how PIV and CAC cards work.'},
 {t:'Fingerprint + face scan',mfa:false,why:'Both are inherence factors, so one category is still doing all the work.'},
 {t:'Password + code from an authenticator app',mfa:true,why:'Knowledge plus possession.'},
 {t:'Password + PIN',mfa:false,why:'Two memorized secrets: one factor, used twice.'}];
R.m1=()=>{
  const d=M('m1').data;d.placed=d.placed||{};d.missed=d.missed||{};d.combo=d.combo||{};d.order=d.order||shuffle(FACT.map((_,i)=>i));
  let sel=null;
  const allPlaced=()=>FACT.every((_,i)=>d.placed[i]);
  function draw(fb=''){
    $('#stage').innerHTML=head(1,'Sort the factors','Authentication factors fall into categories. MFA means proving identity with factors from <b>two or more different</b> categories.','Select a card, then select the category it belongs to. You can also drag cards onto a category.')+
    `<div class="stack" style="margin-top:20px">
     <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">Part A: Classify each method</h3><span class="muted small">${Object.keys(d.placed).length} of ${FACT.length} sorted</span></div>
      <div class="pool" id="pool" aria-label="Unsorted cards">${d.order.filter(i=>!d.placed[i]).map(i=>`<button class="chip" draggable="true" data-i="${i}">${esc(FACT[i].t)}</button>`).join('')||'<span class="muted">All cards sorted.</span>'}</div>
      <div id="m1fb" style="margin:12px 0" aria-live="polite">${fb}</div>
      <div class="bins">${BINS.map(b=>`<button class="bin" data-bin="${b.k}"><span class="ico">${ico[b.k]}</span><h4>${b.n}</h4><span class="eg">${b.d}</span><span class="got">${FACT.map((f,i)=>d.placed[i]===b.k?`<span class="chip placed">${esc(f.t)}</span>`:'').join('')}</span></button>`).join('')}</div></div>
     ${allPlaced()?`<div class="panel"><h3>Part B: Is it really MFA?</h3><p class="muted small">Decide whether each combination is true multifactor authentication.</p>
      ${COMBOS.map((c,i)=>`<div class="combo"><div><div style="font-weight:600">${esc(c.t)}</div><div class="small" id="cfb${i}">${d.combo[i]?`<span style="color:var(--green-ink)">✓ ${c.mfa?'MFA':'Not MFA'}.</span> ${esc(c.why)}`:''}</div></div>
      <div class="yn">${d.combo[i]?'':`<button class="btn" data-c="${i}" data-v="1">MFA</button><button class="btn" data-c="${i}" data-v="0">Not MFA</button>`}</div></div>`).join('')}</div>`:''}
     ${M('m1').done?`<div class="fb ok"><strong>Mission complete. Score ${M('m1').score}/17.</strong>Key idea: count categories, not steps. Two passwords are still one factor.</div><div>${nextBtn('m1')}</div>`:''}
    </div>`;
    wire();}
  function place(i,bin){const f=FACT[i];
    if(f.c===bin){d.placed[i]=bin;if(!d.missed[i])award('m1',1);logEv('m1',`Sorted “${f.t}”`,BINS.find(b=>b.k===bin).n,true);sel=null;
      draw(`<div class="fb ok"><strong>“${esc(f.t)}”: ${BINS.find(b=>b.k===bin).n}.</strong>${esc(f.why)}</div>`);}
    else{d.missed[i]=1;M('m1').attempts++;save();logEv('m1',`Sorted “${f.t}”`,`Chose ${BINS.find(b=>b.k===bin).n}`,false);
      $('#m1fb').innerHTML=`<div class="fb bad"><strong>Not ${BINS.find(b=>b.k===bin).n.toLowerCase()}.</strong>${BIN_HINT[bin]} Try another category.</div>`;
      const el=$(`[data-bin="${bin}"]`);el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}}
  function wire(){
    $$('#pool .chip').forEach(c=>{c.onclick=()=>{sel=+c.dataset.i;$$('#pool .chip').forEach(x=>x.classList.toggle('sel',x===c));};
      c.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.dataset.i);sel=+c.dataset.i;};});
    $$('.bin').forEach(b=>{b.onclick=()=>{if(sel===null){$('#m1fb').innerHTML='<div class="fb warn">Select a card first, then a category.</div>';return;}place(sel,b.dataset.bin);};
      b.ondragover=e=>{e.preventDefault();b.classList.add('over');};b.ondragleave=()=>b.classList.remove('over');
      b.ondrop=e=>{e.preventDefault();b.classList.remove('over');place(+e.dataTransfer.getData('text/plain'),b.dataset.bin);};});
    $$('[data-c]').forEach(btn=>btn.onclick=()=>{const i=+btn.dataset.c,c=COMBOS[i],v=btn.dataset.v==='1';
      if(v===c.mfa){d.combo[i]=1;if(!d['cm'+i])award('m1',1);logEv('m1',`Combo: ${c.t}`,c.mfa?'MFA':'Not MFA',true);
        if(COMBOS.every((_,k)=>d.combo[k]))complete('m1');draw();}
      else{d['cm'+i]=1;save();logEv('m1',`Combo: ${c.t}`,`Answered ${v?'MFA':'Not MFA'}`,false);$('#cfb'+i).innerHTML=`<span style="color:var(--red)">✗ Look again: which category does each part belong to?</span>`;}});
  }
  draw();
};

/* ================= M2 TOTP enrollment ================= */
R.m2=()=>{
  ensureSecret();const d=M('m2').data;d.stage=d.stage||'enroll';const sec=S.secret;
  const uri=`otpauth://totp/PrairieTech:${email()}?secret=${sec}&issuer=PrairieTech&algorithm=SHA1&digits=6&period=30`;
  function portal(){
    if(d.stage==='enroll'||d.stage==='added')return `<div class="sso">${ssoLogo()}<h3>Set up your authenticator app</h3><p class="muted small">Your organization now requires a second factor for ${esc(email())}.</p>
      <div class="row" style="align-items:flex-start;flex-wrap:nowrap;gap:16px">${qr(sec)}<div class="small"><p><b>1.</b> On your phone, open the authenticator and tap <b>Add account</b>.</p><p><b>2.</b> Scan this QR code. Can’t scan? Enter this setup key:</p><span class="secret">${sec.match(/.{1,4}/g).join(' ')}</span></div></div>
      <details style="margin:12px 0" class="small"><summary class="muted">What’s inside the QR code?</summary><code style="word-break:break-all;display:block;margin-top:6px">${esc(uri)}</code><p class="muted" style="margin-top:6px">The setup key is the shared secret. Anyone who copies it can generate your codes forever, so it’s shown only once.</p></details>
      <div class="field"><label for="c1">3. Enter the 6-digit code from the app</label><input id="c1" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••"></div>
      <button class="btn primary" id="v1" style="width:100%">Verify and turn on</button><div id="fb2" style="margin-top:12px" aria-live="polite"></div></div>`;
    if(d.stage==='confirmed')return `<div class="sso">${ssoLogo()}<div class="fb ok" style="margin-bottom:16px"><strong>Authenticator turned on.</strong>Now sign out and sign back in, the way you would every morning.</div>
      <div class="field"><label>Email</label><input value="${esc(email())}" readonly></div>
      <div class="field"><label>Password</label><input type="password" value="Kestrel-Harbor-42" readonly><span class="hint">Filled by your password manager</span></div>
      <div class="field"><label for="c2">Code from your authenticator app</label><input id="c2" class="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••"></div>
      <button class="btn primary" id="v2" style="width:100%">Sign in</button><div id="fb2" style="margin-top:12px" aria-live="polite"></div>
      <p class="muted small" style="margin-top:12px">Curious? Wait for the code to change, then enter the old one.</p></div>`;
    return `<div class="sso" style="text-align:center">${ssoLogo()}<div style="font-size:3rem">✅</div><h3>Signed in</h3><p class="muted">Password (something you know) plus the code (proof you have the phone).</p></div>`;}
  function phoneUI(){
    if(d.stage==='enroll')return authApp(`<div style="text-align:center;margin:auto 0" id="ph"><p class="muted small">No accounts yet</p><button class="btn primary" id="add">Add account</button></div>`);
    return authApp(otpCard()+`<p class="muted small" style="text-align:center">New code in <span class="js-left">–</span></p>`);}
  function draw(){
    $('#stage').innerHTML=head(2,'Set up an authenticator','Time-based one-time passwords (TOTP, RFC 6238) are the codes from apps like Google Authenticator, Microsoft Authenticator, and Authy.','Enroll the phone, confirm the code, then sign in with it.')+
     `<div class="lab" style="margin-top:20px"><div class="stack">${browser('sso.prairietech.edu',d.stage==='confirmed'||d.stage==='done'?'/login':'/mfa/setup',portal())}
       ${d.stage!=='enroll'?`<details class="hood" open><summary>Under the hood: how the phone computes the code</summary><p class="small muted">Phone and server share the secret and the clock. Neither contacts the other at sign-in; both run the same math and compare results.</p><dl class="hood-grid" id="hood"></dl></details>`:''}
       ${d.stage==='done'?`<div class="fb ok"><strong>Mission complete. Score ${M('m2').score}/3.</strong>TOTP blocks password-only attacks such as credential stuffing. Its weakness: the code is something a person can read and type, so a phishing page can collect it too. You’ll see that in Mission 5.</div><div>${nextBtn('m2')}</div>`:''}
      </div>${phone(phoneUI())}</div>`;
    tick();wire();}
  async function check(inp,onOk){const v=inp.value.replace(/\D/g,'');const fb=$('#fb2');
    if(v.length!==6){fb.innerHTML='<div class="fb warn">Enter all 6 digits.</div>';return;}
    const r=await verifyOtp(v);
    if(r==='ok')onOk();
    else{d.wrong=1;M('m2').attempts++;save();inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');
      if(r==='expired'){logEv('m2','Entered expired code',v,false);fb.innerHTML='<div class="fb bad"><strong>That code expired.</strong>It belonged to an earlier 30-second window. The server accepts one step either side for clock drift, no more. Short lifetimes limit replay.</div>';}
      else{logEv('m2','Entered wrong code',v,false);fb.innerHTML=`<div class="fb bad"><strong>Code rejected.</strong>${d.stage==='enroll'?'Add the account on the phone first, then type the code it shows.':'Type the code currently showing on the phone.'}</div>`;}}}
  function wire(){
    const add=$('#add');if(add)add.onclick=()=>{$('#ph').innerHTML=`<div style="border:3px solid var(--navy);border-radius:14px;height:180px;display:grid;place-items:center;margin-bottom:10px" class="muted small">Point the camera at the QR code</div><button class="btn primary" id="scan">Scan code on screen</button>`;
      $('#scan').onclick=()=>{d.stage='added';save();logEv('m2','Scanned QR code','Shared secret stored on phone');draw();};};
    const v1=$('#v1');if(v1){const i=$('#c1');i.onkeydown=e=>{if(e.key==='Enter')v1.click();};v1.onclick=()=>check(i,()=>{d.stage='confirmed';award('m2',1);logEv('m2','Enrollment confirmed','Code matched server',true);draw();});}
    const v2=$('#v2');if(v2){const i=$('#c2');i.onkeydown=e=>{if(e.key==='Enter')v2.click();};v2.onclick=()=>check(i,()=>{d.stage='done';award('m2',1);if(!d.wrong)award('m2',1);logEv('m2','Signed in with TOTP','',true);complete('m2');draw();});}
  }
  draw();
};

/* ================= M3 push with number matching ================= */
R.m3=()=>{
  const d=M('m3').data;d.stage=d.stage||'start';
  function newNum(){d.num=rnd(10,99);const s=new Set([d.num]);while(s.size<3)s.add(rnd(10,99));d.opts=shuffle([...s]);save();}
  function draw(fb=''){
    const portal=d.stage==='start'?`<div class="sso">${ssoLogo()}<div class="field"><label>Email</label><input value="${esc(email())}" readonly></div><div class="field"><label>Password</label><input type="password" value="Kestrel-Harbor-42" readonly><span class="hint">Filled by your password manager</span></div><button class="btn primary" id="go3" style="width:100%">Sign in</button></div>`
     :d.stage==='wait'?`<div class="sso" style="text-align:center">${ssoLogo()}<h3>Approve the sign-in request</h3><p class="muted">Open your authenticator app and select the number shown below.</p><div class="big-number">${d.num}</div><p class="muted small">Didn’t get a notification? Check that your phone is online.</p></div>`
     :`<div class="sso" style="text-align:center">${ssoLogo()}<div style="font-size:3rem">✅</div><h3>Signed in</h3><p class="muted">The number you picked proved that you, the person at this screen, approved this sign-in.</p></div>`;
    const ph=d.stage==='wait'?`<div class="lock-time js-clock"></div><div class="lock-date">${new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</div><div class="app-body"><div class="push"><h4>Are you trying to sign in?</h4>
      <dl><dt>App</dt><dd>Prairie Tech SSO</dd><dt>Account</dt><dd>${esc(email())}</dd><dt>Location</dt><dd>Chicago, IL (approximate)</dd><dt>Device</dt><dd>Chrome on Windows</dd><dt>Time</dt><dd>Just now</dd></dl>
      <div class="small" style="font-weight:600">Select the number shown on your screen</div><div class="nums">${d.opts.map(n=>`<button data-n="${n}">${n}</button>`).join('')}</div>
      <button class="btn danger" id="deny3" style="width:100%;margin-top:10px">No, it’s not me</button></div></div>`
     :`<div class="lock-time js-clock"></div><div class="lock-date">${new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</div><div class="app-body"><p class="muted small" style="text-align:center">${d.stage==='start'?'No notifications':'Sign-in approved'}</p></div>`;
    $('#stage').innerHTML=head(3,'Approve a push','Push MFA sends an approval request to the phone. Plain “Approve / Deny” pushes trained users to tap without thinking. Number matching forces them to look at the screen they’re signing in to.','Sign in, then match the number on the screen using the phone. Check the details before you tap.')+
     `<div class="lab" style="margin-top:20px"><div class="stack">${browser('sso.prairietech.edu','/login',portal)}<div id="fb3" aria-live="polite">${fb}</div><div id="q3"></div></div>${phone(ph)}</div>`;
    tick();wire();}
  function wire(){
    const g=$('#go3');if(g)g.onclick=()=>{newNum();d.stage='wait';save();logEv('m3','Push sent to phone');draw();};
    $$('[data-n]').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;
      if(n===d.num){d.stage='ok';if(!d.miss)award('m3',1);award('m3',1);logEv('m3','Approved with matching number',String(n),true);draw('<div class="fb ok"><strong>Numbers matched.</strong>You confirmed that the sign-in on your screen is the one being approved.</div>');ask();}
      else{d.miss=1;M('m3').attempts++;logEv('m3','Selected wrong number',`Picked ${n}, screen showed ${d.num}`,false);newNum();draw('<div class="fb bad"><strong>Numbers didn’t match. Sign-in blocked.</strong>A new request was sent. Read the number from the browser before choosing.</div>');}});
    const dn=$('#deny3');if(dn)dn.onclick=()=>{d.miss=1;logEv('m3','Denied own sign-in','',false);d.stage='start';save();draw('<div class="fb warn"><strong>You denied your own sign-in.</strong>That was you at the browser. Sign in again.</div>');};
  }
  function ask(){
    if(M('m3').done){$('#q3').innerHTML=`<div class="fb ok"><strong>Mission complete. Score ${M('m3').score}/3.</strong></div><div style="margin-top:12px">${nextBtn('m3')}</div>`;return;}
    const box=document.createElement('div');box.className='panel';$('#q3').appendChild(box);
    choiceQ(box,{q:'What does number matching protect against?',opts:[
      {t:'An attacker who has the password triggering pushes and hoping the user taps Approve out of habit or annoyance.',ok:true,why:' The attacker can’t make you see their number unless you’re looking at their screen, so a blind tap no longer completes the sign-in.'},
      {t:'Interception of the push notification over the network.',why:'Push channels are already encrypted. Number matching is about confirming the user’s intent.'},
      {t:'Real-time phishing sites that relay the sign-in.',why:'Not quite. A phishing proxy can display the number to the victim, who then matches it. Only origin-bound methods like FIDO2 resist that.'},
      {t:'The need for a password.',why:'Number matching is a second factor. The password step still happens first.'}]},
      (ok,first)=>{if(ok){if(first)award('m3',1);logEv('m3','Question: purpose of number matching','',true);complete('m3');box.insertAdjacentHTML('beforeend',`<div class="fb ok" style="margin-top:12px"><strong>Mission complete. Score ${M('m3').score}/3.</strong></div><div style="margin-top:12px">${nextBtn('m3')}</div>`);}
        else logEv('m3','Question: purpose of number matching','',false);});}
  draw();if(d.stage==='ok')ask();
};
</script>
<script>
/* ================= M4 MFA fatigue ================= */
R.m4=()=>{
  const d=M('m4').data;d.stage=d.stage||'brief';
  let count=0,denies=0,resolved=false;
  const pushCard=n=>`<div class="push ${n>0?'mini':''}" data-k="${n}"><h4>Approve sign-in?</h4>${n===0?`<dl><dt>App</dt><dd>Prairie Tech SSO</dd><dt>Location</dt><dd>Unrecognized (VPN exit node)</dd><dt>Device</dt><dd>Windows, Chrome</dd><dt>Time</dt><dd>2:14 AM</dd></dl>
    <div class="acts"><button class="ap" data-a="approve">Approve</button><button class="dn" data-a="deny">Deny</button></div><button class="btn danger" data-a="report" style="width:100%;margin-top:8px">This wasn’t me: report</button>`:'<div class="muted small">Prairie Tech SSO, unrecognized location</div>'}</div>`;
  function frame(left,ph){$('#stage').innerHTML=head(4,'Survive push bombing','In an MFA fatigue attack, someone who already has your password floods your phone with push requests, hoping you approve one to make it stop, often while posing as IT support.','Respond to what arrives on your phone. Nobody at your house is signing in to anything.')+
    `<div class="lab" style="margin-top:20px"><div class="stack" id="left4">${left}</div>${phone(ph,{time:'2:14'})}</div>`;}
  const lock=inner=>`<div class="lock-time">2:14</div><div class="lock-date">${new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'})}</div><div class="app-body" id="stack4">${inner}</div>`;
  function brief(){d.stage='brief';save();
    frame(`<div class="panel"><h3>2:14 AM</h3><p>You’re asleep. Your laptop is closed. Your phone is on the nightstand, and it starts buzzing.</p><button class="btn primary" id="wake">Pick up the phone</button></div>`,lock('<p class="muted small" style="text-align:center">Buzz… buzz…</p>'));
    $('#wake').onclick=attack;}
  function attack(){d.stage='attack';save();count=0;denies=0;resolved=false;logEv('m4','Attack began','Push flood started');
    frame(`<div class="panel"><h3>What you know</h3><p>You are not signing in. Every prompt on the phone was started by someone else.</p><p class="muted small">Prompts received: <b id="cnt4">0</b> &nbsp; Denied: <b id="den4">0</b></p></div><div id="tip4"></div>`,lock(''));
    $('#stack4').addEventListener('click',onAct);push();}
  function push(){if(resolved)return;count++;$('#cnt4').textContent=count;
    const st=$('#stack4');$$('.push',st).forEach((p,i)=>{p.outerHTML=pushCard(1);});
    $$('.push',st).slice(1).forEach(p=>p.remove());
    st.insertAdjacentHTML('afterbegin',pushCard(0));
    const sm=$('.sms',st);if(sm)st.prepend(sm);
    if(count===4)st.insertAdjacentHTML('afterbegin',`<div class="sms"><b>Text from +1 (312) 555-0187</b>Hi, this is Kevin from Prairie Tech IT. We’re fixing a sync error on your account. Approve the next prompt and the alerts will stop.</div>`);
    if(count<14)later(push,2600);}
  function onAct(e){const b=e.target.closest('[data-a]');if(!b||resolved)return;const a=b.dataset.a;
    if(a==='approve'){resolved=true;clearTimers();d.everApproved=1;d.stage='breach';save();logEv('m4','Approved attacker’s push',`After ${count} prompts`,false);breach();}
    else if(a==='deny'){denies++;$('#den4').textContent=denies;logEv('m4','Denied a prompt','',true);b.closest('.push').remove();
      if(denies===3)$('#tip4').innerHTML='<div class="fb warn"><strong>Denying keeps you safe, but the prompts keep coming.</strong>What would let your security team know right now?</div>';}
    else{resolved=true;clearTimers();d.stage='reported';if(!d.everApproved)once('m4','noapprove',1);once('m4','report',1);logEv('m4','Reported fraud',`After ${count} prompts and ${denies} denials`,true);reported();}}
  function breach(){
    frame(`<div class="fb bad"><strong>The attacker is in.</strong>Your approval completed their sign-in at 2:15 AM. To the identity provider, it looked exactly like you.</div>
     <div class="panel"><h3>This really happens</h3><p>In 2022, an attacker who had bought an Uber contractor’s password sent repeated push requests, then messaged the contractor on WhatsApp claiming to be IT and saying the prompts would stop once one was approved. The contractor approved one and the attacker got into Uber’s internal network.</p><p>Approving “just to make it stop” is the whole attack.</p><button class="btn primary" id="again">Replay the attack</button></div>`,
     lock(`<div class="push"><h4>Sign-in approved</h4><div class="muted small">Prairie Tech SSO, unrecognized location</div></div>`));
    $('#again').onclick=attack;}
  function reported(){
    frame(`<div class="fb ok"><strong>Reported. The prompts stop.</strong>${d.everApproved?'Better this time.':'You never approved a prompt.'}</div>
     <div class="panel"><h3>Meanwhile, in the security operations center</h3><div class="term" id="soc"></div></div><div class="panel" id="q4"></div>`,
     lock(`<div class="push"><h4>Thanks for reporting</h4><div class="muted small">Your security team has been notified. Don’t approve requests you didn’t start.</div></div>`));
    const lines=[`<span class="d">02:14:37</span> <span class="y">[IdP]</span> fraud report from ${esc(email())}`,`<span class="d">02:14:37</span> <span class="y">[SIEM]</span> ${count} push requests in ${Math.max(1,Math.round(count*2.6/60))} min, source IP 185.220.x.x (anonymizing VPN)`,
      `<span class="d">02:14:38</span> <span class="r">[SOAR]</span> conclusion: valid password in attacker’s hands`,`<span class="d">02:14:39</span> <span class="g">[SOAR]</span> password reset forced, all sessions revoked`,
      `<span class="d">02:14:40</span> <span class="g">[SOAR]</span> source IP blocked, analyst paged`];
    lines.forEach((l,i)=>later(()=>{const s=$('#soc');if(s)s.insertAdjacentHTML('beforeend',`<div>${l}</div>`);},500*(i+1)));
    later(()=>{const box=$('#q4');if(!box)return;
      if(M('m4').done){box.innerHTML=`<div class="fb ok"><strong>Mission complete. Score ${M('m4').score}/3.</strong></div><div style="margin-top:12px">${nextBtn('m4')}</div>`;return;}
      choiceQ(box,{q:'What does a flood of push requests you didn’t start tell the security team?',opts:[
        {t:'The attacker already has the correct password.',ok:true,why:' Push requests are only sent after the password step succeeds. The account needs a password reset even though no prompt was approved.'},
        {t:'Someone is trying to guess the password.',why:'A wrong password fails before any push is sent. Pushes mean the password was accepted.'},
        {t:'The authenticator app is malfunctioning.',why:'The app only displays what the identity provider sends. Every one of those requests came from a real sign-in attempt.'},
        {t:'Nothing, as long as every prompt was denied.',why:'Denials kept the attacker out tonight, but they still hold a working password.'}]},
        (ok,first)=>{if(ok){if(first)once('m4','q',1);logEv('m4','Question: meaning of push flood','',true);complete('m4');
          box.insertAdjacentHTML('beforeend',`<div class="fb ok" style="margin-top:12px"><strong>Mission complete. Score ${M('m4').score}/3.</strong>Defenses: number matching, rate limits on push requests, alerts on repeated denials, and user training to report rather than ignore.</div><div style="margin-top:12px">${nextBtn('m4')}</div>`);}
          else logEv('m4','Question: meaning of push flood','',false);});},3200);}
  if(d.stage==='reported')reported();else if(d.stage==='breach')breach();else brief();
};

/* ================= M5 adversary-in-the-middle ================= */
R.m5=()=>{
  ensureSecret();const d=M('m5').data;d.stage=d.stage||'email';
  const FAKE='sso.prairietech-login.com',REAL='sso.prairietech.edu';
  const key=(cap)=>`<div class="panel" style="text-align:center"><h3>Your security key</h3><p class="muted small">A FIDO2 key registered to ${REAL}. Its private key never leaves the device.</p>
    <button class="key" id="key" aria-label="Touch the security key" disabled><span class="body"><span class="pad"></span></span><span class="usb"></span></button><div class="key-cap" id="keycap">${cap||'Waiting for a sign-in request'}</div></div>`;
  function frame(url,evil,page,right,below=''){
    $('#stage').innerHTML=head(5,'Beat the phishing proxy','Adversary-in-the-middle (AiTM) phishing kits such as Evilginx sit between you and the real site, passing everything through in real time. You see the real login flow; they keep a copy of everything, including your session.','Read the email, follow what happens, then see what changes with a FIDO2 security key.')+
    `<div class="lab" style="margin-top:20px"><div class="stack">${browser(url.h,url.p,page,evil)}<div id="fb5" aria-live="polite"></div>${below}</div>${right}</div>`;tick();}
  const term='<div class="panel"><h3>Attacker’s console</h3><div class="term" id="term5"></div></div>';
  function out(lines,done){lines.forEach((l,i)=>later(()=>{const t=$('#term5');if(t)t.insertAdjacentHTML('beforeend',`<div>${l}</div>`);if(i===lines.length-1&&done)done();},650*(i+1)));}
  function showEmail(){d.stage='email';save();
    frame({h:'mail.prairietech.edu',p:'/inbox'},false,`<div style="max-width:600px">
      <div class="small muted">From: Prairie Tech IT Service Desk &lt;it-servicedesk@prairietech-support.com&gt;</div>
      <h3 style="margin:6px 0 12px">Action required: re-verify MFA by 5:00 PM today</h3>
      <p>Our records show your multi-factor enrollment is out of date. Re-verify now to avoid losing access to email and Canvas.</p>
      <p><span class="btn primary" style="pointer-events:none">Re-verify MFA</span></p>
      <p class="small muted">Link destination: <code>https://${FAKE}/auth</code></p>
      <p class="small muted">Prairie Tech IT Service Desk</p></div>
      <div class="row" style="border-top:1px solid var(--line);padding-top:16px;margin-top:8px"><button class="btn" id="clk">Click “Re-verify MFA”</button><button class="btn danger" id="rep">Report phishing</button></div>`,phone(authApp(otpCard())));
    $('#rep').onclick=()=>{once('m5','rep',1);logEv('m5','Reported phishing email','Sender and link domains not prairietech.edu',true);
      $('#fb5').innerHTML=`<div class="fb ok"><strong>Good catch.</strong>Neither the sender (prairietech-support.com) nor the link (prairietech-login.com) is prairietech.edu, and the deadline creates urgency. Your coworker Dana clicked it, though. Continue as Dana to see why her authenticator app didn’t save her.</div><button class="btn primary" id="asDana" style="margin-top:12px">Continue as Dana</button>`;$('#asDana').onclick=phish;};
    $('#clk').onclick=()=>{d.clicked=1;logEv('m5','Clicked phishing link',FAKE,false);phish();};}
  function phish(){d.stage='phish';save();
    frame({h:FAKE,p:'/auth'},true,`<div class="sso">${ssoLogo()}<div class="field"><label>Email</label><input value="${esc(email())}" readonly></div><div class="field"><label>Password</label><input type="password" value="Kestrel-Harbor-42" readonly></div>
      <div class="field"><label for="c5">Code from your authenticator app</label><input id="c5" class="code" inputmode="numeric" maxlength="6" placeholder="••••••"></div><button class="btn primary" id="v5" style="width:100%">Verify</button></div>`,phone(authApp(otpCard())),
      `<div class="fb warn"><strong>The page looks right and shows a padlock.</strong>Enter the current code from the phone, as Dana did.</div>`);
    const i=$('#c5');i.onkeydown=e=>{if(e.key==='Enter')$('#v5').click();};
    $('#v5').onclick=async()=>{const v=i.value.replace(/\D/g,'');const r=v.length===6?await verifyOtp(v):'bad';
      if(r!=='ok'){$('#fb5').innerHTML='<div class="fb bad"><strong>The real site rejected that code.</strong>The proxy forwards whatever you type to the real site, so it has to be the current code.</div>';return;}
      logEv('m5','Entered TOTP on phishing site',`Code ${v} relayed`,false);stolen(v);};}
  function stolen(v){d.stage='stolen';save();
    frame({h:FAKE,p:'/auth'},true,`<div class="sso" style="text-align:center">${ssoLogo()}<div style="font-size:3rem">✅</div><h3>Verified</h3><p class="muted">Redirecting to your inbox…</p></div>`,phone(authApp(otpCard())),term);
    out([`<span class="d">[proxy]</span> victim connected, relaying to ${REAL}`,`<span class="d">[proxy]</span> captured username <span class="y">${esc(email())}</span>`,`<span class="d">[proxy]</span> captured password <span class="y">Kestrel-Harbor-42</span>`,
      `<span class="d">[proxy]</span> relayed TOTP <span class="y">${v||'••••••'}</span> → <span class="g">accepted by real IdP</span>`,`<span class="d">[proxy]</span> captured <span class="r">Set-Cookie: PT_SESSION=8f3c91e0a7…; Secure; HttpOnly</span>`,
      `<span class="r">[attacker]</span> imported cookie into own browser, inbox open, no MFA prompt`,`<span class="r">[attacker]</span> creating inbox rule: forward messages containing “invoice” externally`],
      ()=>{$('#fb5').innerHTML=`<div class="fb bad"><strong>The code worked exactly as designed, and that’s the problem.</strong>A one-time code is a secret a human can read and type, so a human can type it into the wrong site. The proxy didn’t need to break MFA. It let Dana complete it, then stole the session cookie issued afterward. Push with number matching fails the same way: the proxy simply shows Dana the number.</div><button class="btn primary" id="rew" style="margin-top:12px">Rewind: give Dana a security key</button>`;$('#rew').onclick=keyPhish;});}
  function keyPhish(){d.stage='keyphish';save();
    frame({h:FAKE,p:'/auth'},true,`<div class="sso">${ssoLogo()}<div class="field"><label>Email</label><input value="${esc(email())}" readonly></div><button class="btn primary" id="sk" style="width:100%">Sign in with security key</button></div>`,key(),term);
    $('#sk').onclick=()=>{logEv('m5','Security key requested on phishing site');armKey(false);};}
  function armKey(real){const k=$('#key');k.disabled=false;k.classList.add('blink');$('#keycap').textContent='Touch the gold pad to continue';
    out([`<span class="d">[browser]</span> WebAuthn request from page origin <span class="${real?'g':'y'}">https://${real?REAL:FAKE}</span>`,`<span class="d">[browser]</span> relying party ID sent to key: <span class="${real?'g':'y'}">${real?'prairietech.edu':'prairietech-login.com'}</span>`]);
    k.onclick=()=>{k.disabled=true;k.classList.remove('blink');real?realResult():phishResult();};}
  function phishResult(){$('#keycap').innerHTML='<b style="color:var(--red)">No credential for this site. Nothing signed.</b>';
    out([`<span class="d">[key]</span> searching for a credential bound to prairietech-login.com… <span class="r">none</span>`,`<span class="d">[key]</span> no assertion produced`,`<span class="r">[proxy]</span> waiting for assertion… timed out. Nothing to relay.`],
      ()=>{logEv('m5','Security key refused phishing origin','',true);$('#fb5').innerHTML=`<div class="fb ok"><strong>The attack failed, and Dana didn’t have to notice anything.</strong>The browser, not the user, told the key which site was asking. The key holds no credential for prairietech-login.com, so it never signs.</div><button class="btn primary" id="rl" style="margin-top:12px">Now sign in at the real site</button>`;$('#rl').onclick=keyReal;});}
  function keyReal(){d.stage='keyreal';save();
    frame({h:REAL,p:'/login'},false,`<div class="sso">${ssoLogo()}<div class="field"><label>Email</label><input value="${esc(email())}" readonly></div><button class="btn primary" id="sk" style="width:100%">Sign in with security key</button></div>`,key(),'<div class="panel"><h3>What happened</h3><div class="term" id="term5"></div></div>');
    $('#sk').onclick=()=>armKey(true);}
  function realResult(){$('#keycap').innerHTML='<b style="color:var(--green-ink)">Signed for prairietech.edu</b>';$('#page').innerHTML=`<div class="sso" style="text-align:center">${ssoLogo()}<div style="font-size:3rem">✅</div><h3>Signed in</h3><p class="muted">No code to type, nothing to steal.</p></div>`;
    out([`<span class="d">[key]</span> credential found for prairietech.edu`,`<span class="d">[key]</span> signing server challenge <span class="y">4c1e9a77…</span> with private key`,`<span class="g">[IdP]</span> signature verified with the stored public key ✓`,`<span class="g">[IdP]</span> signed in. The private key never left the device.`],
      ()=>{logEv('m5','Signed in with security key at real site','',true);once('m5','flow',1);d.stage='q';save();askQ();});}
  function askQ(){let box=$('#q5');if(!box){$('#fb5').insertAdjacentHTML('afterend','<div class="panel" id="q5"></div>');box=$('#q5');}
    if(M('m5').done){box.innerHTML=`<div class="fb ok"><strong>Mission complete. Score ${M('m5').score}/3.</strong></div><div style="margin-top:12px">${nextBtn('m5')}</div>`;return;}
    choiceQ(box,{q:'Why did the security key stop the proxy when the six-digit code didn’t?',opts:[
      {t:'The credential is bound to the real site’s origin, the browser reports the true origin, and there’s no secret for the user to type or relay.',ok:true,why:' This is what CISA and NIST mean by phishing-resistant: the protection doesn’t depend on the user spotting the fake.'},
      {t:'The fake site’s TLS certificate was invalid.',why:'The phishing page had a valid padlock. Attackers get free certificates for domains they own.'},
      {t:'Security keys produce longer codes that take too long to relay.',why:'Keys don’t produce codes at all. They sign a challenge, and only for the registered site.'},
      {t:'The key detected malware on the computer.',why:'Keys don’t scan the computer. The protection comes from origin binding.'}]},
      (ok,first)=>{if(ok){if(first)once('m5','q',1);logEv('m5','Question: why FIDO2 resists phishing','',true);complete('m5');
        box.insertAdjacentHTML('beforeend',`<div class="fb ok" style="margin-top:12px"><strong>Mission complete. Score ${M('m5').score}/3.</strong>Passkeys use the same FIDO2/WebAuthn origin binding, stored on a phone or laptop instead of a separate key.</div><div style="margin-top:12px">${nextBtn('m5')}</div>`);}
        else logEv('m5','Question: why FIDO2 resists phishing','',false);});}
  ({email:showEmail,phish,stolen:()=>stolen(''),keyphish:keyPhish,keyreal:keyReal,q:()=>{keyReal();d.stage='q';save();$('#page').innerHTML=`<div class="sso" style="text-align:center">${ssoLogo()}<div style="font-size:3rem">✅</div><h3>Signed in</h3></div>`;askQ();}})[d.stage]();
};

/* ================= M6 policy console ================= */
const SCEN=[
 {tag:'Privileged accounts',h:'Domain and cloud admins need MFA. Which method do you require?',opts:[
  {t:'FIDO2 security keys or passkeys',ok:true,why:' Admin accounts are the top phishing target, so they get phishing-resistant authenticators first.'},
  {t:'Codes sent by SMS',why:'SMS can be intercepted or redirected by SIM swapping, and NIST SP 800-63B treats it as a restricted authenticator.'},
  {t:'Authenticator app codes (TOTP)',why:'Much better than SMS, but phishable through a real-time proxy. You saw it in Mission 5.'},
  {t:'Codes sent to a personal email address',why:'Whoever controls that mailbox controls the factor.'}]},
 {tag:'Help desk',h:'A caller says she’s Professor Ruiz, lost her phone, and needs MFA reset before her class starts in 10 minutes.',opts:[
  {t:'Verify identity through an established out-of-band process (call back the number on file, manager confirmation, or ID check), then reset and log it.',ok:true,why:' Help desk resets are a favorite social-engineering path. Urgency is a pressure tactic, not a reason to skip verification.'},
  {t:'Reset it, because she knew her employee ID.',why:'Employee IDs appear on badges, email signatures, and old documents. They prove nothing.'},
  {t:'Send a temporary code to the personal email address she gives you.',why:'An attacker would give you their own address.'},
  {t:'Turn off MFA on her account for the day.',why:'That hands an attacker a password-only account.'}]},
 {tag:'SOC alert',h:'Logs show 27 denied push requests for one user in 8 minutes, from an anonymizing VPN.',opts:[
  {t:'Treat the password as compromised: force a reset, revoke sessions, contact the user, and investigate the source.',ok:true,why:' Push requests only follow a correct password.'},
  {t:'No action needed, since every request was denied.',why:'Denials mean the attacker isn’t in yet. They still have the password.'},
  {t:'Turn off the user’s MFA so the alerts stop.',why:'That completes the attack for them.'},
  {t:'Tell the user to mute notifications.',why:'Then the next prompt gets approved by accident, or never reported.'}]},
 {tag:'Legacy protocols',h:'Some accounts still sign in to email over IMAP with basic authentication, which never shows an MFA prompt.',opts:[
  {t:'Block legacy authentication and move users to clients that support modern authentication.',ok:true,why:' Basic auth skips the MFA challenge entirely, which is why attackers password-spray those endpoints.'},
  {t:'Leave it. MFA is turned on for those accounts, so they’re covered.',why:'MFA only protects sign-ins that actually ask for it.'},
  {t:'Require longer passwords for those accounts only.',why:'Helps against guessing, not against stolen or reused passwords.'},
  {t:'Allow it only during business hours.',why:'Attackers work business hours too.'}]},
 {tag:'Emergency access',h:'You need a break-glass admin account in case the MFA service itself fails. How do you protect it?',opts:[
  {t:'A long random password plus FIDO2 keys kept in a physical safe, with an alert to the security team on every sign-in.',ok:true,why:' It stays usable in an outage, stays strong, and can’t be used quietly.'},
  {t:'Exclude it from MFA and keep the password in a shared team spreadsheet.',why:'A shared, unprotected, unmonitored super-admin is an attacker’s dream.'},
  {t:'Register one admin’s personal phone for SMS codes.',why:'Single point of failure, phishable, and gone if that admin leaves.'},
  {t:'Don’t create one; MFA outages never happen.',why:'They do, and lockout of every admin is its own incident.'}]},
 {tag:'Enrollment',h:'Students are enrolling in MFA for the first time. Which control matters most?',opts:[
  {t:'Require an already verified session or in-person check before registering a factor, and notify the user whenever a new factor is added.',ok:true,why:' Attackers with a stolen password try to register their own device to keep access.'},
  {t:'Let anyone who knows the password register a new phone.',why:'Then a stolen password becomes a permanent second factor for the attacker.'},
