  {t:'Allow students to skip enrollment for 90 days.',why:'Delay leaves accounts password-only during the riskiest period.'},
  {t:'Email students their setup key.',why:'The setup key is the shared secret. Emailing it exposes it to anyone in the mailbox.'}]}];
R.m6=()=>{
  const d=M('m6').data;d.ok=d.ok||{};
  $('#stage').innerHTML=head(6,'Set the policy','You’re the junior specialist on the identity team. Each card is a decision you’ll face in the first year on the job.','Choose the best control for each situation. Points go to first-try answers.')+
   `<div class="stack" style="margin-top:20px;max-width:860px">${SCEN.map((s,i)=>`<div class="scenario" id="sc${i}"><span class="tag">${s.tag}</span><div id="sq${i}"></div></div>`).join('')}<div id="end6"></div></div>`;
  const finish=()=>{if(SCEN.every((_,i)=>d.ok[i])){complete('m6');$('#end6').innerHTML=`<div class="fb ok"><strong>Mission complete. Score ${M('m6').score}/6.</strong>Pattern to remember: strongest factors for highest-risk accounts, verify identity before any MFA change, and close every path that skips MFA.</div><div style="margin-top:12px">${nextBtn('m6')}</div>`;}};
  SCEN.forEach((s,i)=>{const box=$('#sq'+i);
    if(d.ok[i]){box.innerHTML=`<h4>${s.h}</h4><div class="fb ok"><strong>${s.opts[0].t}</strong>${s.opts[0].why}</div>`;return;}
    choiceQ(box,{q:`<h4 style="margin:0">${s.h}</h4>`,opts:s.opts},(ok,first)=>{if(ok){d.ok[i]=1;if(first)award('m6',1);else save();logEv('m6',`Policy: ${s.tag}`,'',true);finish();}else logEv('m6',`Policy: ${s.tag}`,'',false);});});
  finish();
};

/* ================= M7 knowledge check ================= */
const QUIZ=[
 {q:'Which combination is true multifactor authentication?',opts:[{t:'Smart card + PIN',ok:true,why:' Possession plus knowledge.'},{t:'Password + security question',why:'Two knowledge factors.'},{t:'Fingerprint + face scan',why:'Two inherence factors.'},{t:'Password + PIN',why:'Two knowledge factors.'}]},
 {q:'What is the default time step for TOTP codes under RFC 6238?',opts:[{t:'30 seconds',ok:true,why:' Most authenticator apps use 30 seconds, and servers usually accept one step either side for clock drift.'},{t:'10 seconds'},{t:'60 seconds'},{t:'5 minutes'}]},
 {q:'Which method does CISA describe as phishing-resistant MFA?',opts:[{t:'FIDO2/WebAuthn (security keys and passkeys)',ok:true,why:' CISA also lists PKI-based smart cards (PIV/CAC).'},{t:'Push with number matching',why:'Number matching stops fatigue attacks, but a proxy can show the victim the number.'},{t:'TOTP authenticator app',why:'Codes can be typed into a phishing page and relayed.'},{t:'SMS one-time codes',why:'The weakest common option.'}]},
 {q:'SIM swapping most directly defeats which method?',opts:[{t:'SMS one-time codes',ok:true,why:' Once the attacker controls the number, the codes go to them.'},{t:'FIDO2 security keys'},{t:'Smart card + PIN'},{t:'Fingerprint reader'}]},
 {q:'In an adversary-in-the-middle attack, what does the attacker steal to stay signed in without facing MFA again?',opts:[{t:'The session cookie or token issued after sign-in',ok:true,why:' Defenses include phishing-resistant MFA, token binding, short session lifetimes, and alerts on impossible travel.'},{t:'The TOTP shared secret',why:'The proxy only sees one code, not the seed.'},{t:'The security key’s private key',why:'It never leaves the key.'},{t:'The user’s biometric template'}]},
 {q:'Where does the TOTP shared secret live after enrollment?',opts:[{t:'On both the identity provider’s server and the authenticator app',ok:true,why:' Both compute the code from it, so the server-side seed store must be protected like a password database.'},{t:'Only on the phone'},{t:'Only on the server'},{t:'Nowhere; codes come from the time alone',why:'Time alone would give everyone the same code.'}]},
 {q:'A user gets a burst of push requests they didn’t start. What has most likely happened?',opts:[{t:'Their password has been compromised.',ok:true,why:' Pushes only follow a correct password.'},{t:'Their phone has malware.'},{t:'Someone is guessing their password.',why:'Wrong guesses never reach the push step.'},{t:'The identity provider is down.'}]},
 {q:'In biometrics, the point where the false acceptance rate equals the false rejection rate is called the…',opts:[{t:'Crossover error rate (CER)',ok:true,why:' A lower CER means a more accurate biometric system.'},{t:'False acceptance rate (FAR)'},{t:'False rejection rate (FRR)'},{t:'True positive rate (TPR)'}]},
 {q:'Number matching mainly defends against…',opts:[{t:'MFA fatigue and blind approvals',ok:true,why:' The user has to see the sign-in screen to choose the number.'},{t:'SIM swapping'},{t:'Adversary-in-the-middle phishing',why:'The proxy can show the number to the victim.'},{t:'Credential stuffing',why:'That is stopped by having any second factor at all.'}]},
 {q:'How does NIST SP 800-63B treat one-time codes sent by SMS or voice?',opts:[{t:'As a restricted authenticator: allowed, but agencies must offer an alternative and explain the risk',ok:true,why:' Not banned, but not recommended for higher-risk accounts.'},{t:'Prohibited at every assurance level'},{t:'Phishing-resistant'},{t:'Required for the highest assurance level (AAL3)',why:'AAL3 requires a hardware-based, phishing-resistant authenticator.'}]}];
R.m7=()=>{
  const d=M('m7').data;d.ok=d.ok||{};
  $('#stage').innerHTML=head(7,'Knowledge check','Ten questions covering every mission plus a few exam favorites. Wrong answers explain themselves; keep going until each is right.','Points count on first-try answers only.')+
   `<div class="stack" style="margin-top:20px;max-width:860px">${QUIZ.map((q,i)=>`<div class="panel"><div class="muted small" style="font-weight:700;margin-bottom:6px">Question ${i+1} of ${QUIZ.length}</div><div id="kq${i}"></div></div>`).join('')}<div id="end7"></div></div>`;
  const finish=()=>{if(QUIZ.every((_,i)=>d.ok[i])){complete('m7');cert();}};
  QUIZ.forEach((q,i)=>{const box=$('#kq'+i);
    if(d.ok[i]){const o=q.opts[0];box.innerHTML=`<div style="font-weight:700;margin-bottom:8px">${q.q}</div><div class="fb ok"><strong>${o.t}</strong>${o.why||''}</div>`;return;}
    choiceQ(box,q,(ok,first)=>{if(ok){d.ok[i]=1;if(first)award('m7',1);else save();logEv('m7',`Question ${i+1}`,'',true);finish();}else logEv('m7',`Question ${i+1}`,'',false);});});
  finish();
};
function cert(){const T=totals();const left=MISSIONS.slice(1).filter(m=>!M(m.id).done);
  $('#end7').innerHTML=`<div class="cert"><div style="font-size:2.4rem">🛡️</div><h3>${left.length?'Knowledge check complete':'MFA Lab complete'}</h3>
   <p style="font-size:1.1rem;margin-bottom:4px"><b>${esc(S.student||'Student')}</b></p><p class="muted">${new Date().toLocaleString()}</p>
   <p style="font-size:2rem;font-weight:800;color:var(--navy);margin:8px 0">${T.s} / ${T.m}</p><p class="muted">${T.pct}% of points earned on first try</p>
   ${left.length?`<div class="fb warn" style="text-align:left;margin:12px 0"><strong>Still open:</strong>${left.map(m=>esc(m.title)).join(', ')}</div>`:''}
   <div class="row" style="justify-content:center;margin-top:14px"><button class="btn primary" id="cCsv">Download progress log (CSV)</button><button class="btn" id="cLog">Open progress log</button></div></div>`;
  $('#cCsv').onclick=()=>download(csv(),`mfa-lab-${userName()}.csv`,'text/csv');$('#cLog').onclick=()=>openDrawer(true);}

/* ================= start ================= */
renderChrome();
const h=location.hash.replace('#','');
go(MISSIONS.some(m=>m.id===h)?h:(S.started?S.current:'m0'));
</script>
