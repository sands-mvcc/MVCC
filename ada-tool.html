<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accessibility Repair Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js" defer></script>
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#eef8f3; --line:#c9d6cf; --ink:#000000; --muted:#3d4a44;
  --green:#00a86b; --green-ink:#006b45; --green-deep:#004d32;
  --rail:#000000; --rail-ink:#ffffff; --rail-muted:#c4d3cb;
  --err:#b3261e; --err-bg:#fdeceb; --warn:#7a4a00; --warn-bg:#fff4dc; --tip:#1d4f91; --tip-bg:#e9f0fb;
  --font:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#000;--surface:#0d1511;--soft:#10261c;--line:#2f4a3d;--ink:#fff;--muted:#c4d3cb;--green-ink:#4fd6a0;--green-deep:#7fe6bd;--err-bg:#3a1513;--err:#ff9c94;--warn-bg:#352300;--warn:#ffc966;--tip-bg:#0f2240;--tip:#9cc2ff;color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#000;--surface:#0d1511;--soft:#10261c;--line:#2f4a3d;--ink:#fff;--muted:#c4d3cb;--green-ink:#4fd6a0;--green-deep:#7fe6bd;--err-bg:#3a1513;--err:#ff9c94;--warn-bg:#352300;--warn:#ffc966;--tip-bg:#0f2240;--tip:#9cc2ff;color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1.0625rem;line-height:1.55}
a{color:var(--green-ink)}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--bg);padding:.6rem 1rem;z-index:20}
.skip:focus{left:.5rem;top:.5rem}

.app{display:grid;grid-template-columns:17.5rem 1fr;height:100%}
.rail{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;padding:1.5rem 1rem 1rem;overflow-y:auto}
.brand{display:flex;gap:.7rem;align-items:center;padding:0 .4rem 1.4rem;border-bottom:1px solid #2b3a33}
.brand svg{flex:none}
.brand b{display:block;font-size:1.08rem;line-height:1.2}
.brand span{color:var(--rail-muted);font-size:.85rem}
.steps{list-style:none;margin:1.2rem 0 0;padding:0;position:relative}
.steps::before{content:"";position:absolute;left:1.55rem;top:1.4rem;bottom:1.4rem;width:2px;background:#2b3a33}
.steps li{position:relative;margin:0 0 .25rem}
.steps button{all:unset;box-sizing:border-box;display:flex;gap:.85rem;align-items:flex-start;width:100%;padding:.65rem .55rem;border-radius:.5rem;cursor:pointer;color:var(--rail-ink)}
.steps button:focus-visible{outline:3px solid var(--green);outline-offset:0}
.steps button:hover:not([disabled]){background:#122019}
.steps button[disabled]{cursor:not-allowed;color:#9aaba2}
.steps .num{flex:none;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#000;border:2px solid #4a5f55;position:relative;z-index:1}
.steps button[aria-current="step"]{background:#10261c}
.steps button[aria-current="step"] .num{background:var(--green);border-color:var(--green);color:#000}
.steps button.done .num{border-color:var(--green);color:var(--green)}
.steps b{display:block;font-size:1rem}
.steps small{display:block;color:var(--rail-muted);font-size:.84rem;line-height:1.35}
.steps button[disabled] small{color:#8a9b92}
.filecard{margin-top:auto;padding:1rem .6rem 0;border-top:1px solid #2b3a33}
.filecard .fname{font-weight:700;word-break:break-all}
.filecard .ftype{color:var(--rail-muted);font-size:.85rem}
.filecard .fscore{display:flex;align-items:baseline;gap:.4rem;margin:.6rem 0}
.filecard .fscore strong{font-size:2rem;color:var(--green);line-height:1}
.btn-ghost-rail{all:unset;cursor:pointer;color:var(--rail-ink);text-decoration:underline;font-size:.9rem}
.btn-ghost-rail:focus-visible{outline:3px solid var(--green)}

main{overflow-y:auto;padding:2.2rem clamp(1rem,4vw,3.2rem) 4rem}
main:focus{outline:none}
.top{max-width:62rem;border-bottom:3px solid var(--ink);padding-bottom:1rem;margin-bottom:1.6rem}
.top .stepno{color:var(--green-ink);font-weight:700;margin:0 0 .2rem}
h1{font-size:clamp(1.7rem,3vw,2.3rem);line-height:1.15;margin:0}
h1:focus{outline:none}
.top p.lede{margin:.5rem 0 0;color:var(--muted);max-width:60ch}
#view{max-width:62rem}
h2{font-size:1.35rem;margin:2rem 0 .8rem}
h3{font-size:1.08rem;margin:0}
p{max-width:70ch}

.btn{font:inherit;font-weight:700;border:2px solid var(--green-ink);background:var(--green-ink);color:#fff;padding:.6rem 1.1rem;border-radius:.45rem;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem}
.btn:hover{background:var(--green-deep);border-color:var(--green-deep)}
.btn.secondary{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.secondary:hover{background:var(--soft)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center}

.drop{border:2px dashed var(--green-ink);border-radius:.8rem;padding:2.4rem 1.5rem;text-align:center;background:var(--soft)}
.drop.over{background:#d9f1e5;border-style:solid}
.drop p{margin:.4rem auto}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));gap:1rem;margin:1.6rem 0}
.type{border-left:4px solid var(--green);padding:.2rem 0 .2rem .9rem}
.type b{display:block}
.type span{color:var(--muted);font-size:.93rem}
label.lbl{display:block;font-weight:700;margin:.2rem 0 .35rem}
textarea,input[type=text],select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid #5b6b63;border-radius:.4rem;padding:.5rem .65rem;width:100%;max-width:100%}
textarea{min-height:9rem;font-family:var(--mono);font-size:.9rem}
.hint{color:var(--muted);font-size:.92rem;margin:.3rem 0 .8rem}
.error-box{border-left:5px solid var(--err);background:var(--err-bg);padding:.8rem 1rem;margin:1rem 0}
.info-box{border-left:5px solid var(--green);background:var(--soft);padding:.8rem 1rem;margin:1rem 0}
.info-box p{margin:.3rem 0}
.busy{display:flex;gap:.8rem;align-items:center;padding:1.2rem 0}
.spinner{width:1.6rem;height:1.6rem;border:3px solid var(--line);border-top-color:var(--green-ink);border-radius:50%;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}

.summary{display:grid;grid-template-columns:auto 1fr;gap:2rem;align-items:center;padding:1.4rem;border:2px solid var(--ink);border-radius:.8rem}
.ring{position:relative;width:9rem;height:9rem}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val strong{font-size:2.6rem;line-height:1}
.ring .val span{display:block;font-size:.8rem;color:var(--muted)}
.counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.7rem}
.count{padding:.6rem .8rem;border-radius:.45rem;background:var(--soft)}
.count strong{display:block;font-size:1.6rem;line-height:1.1}
.count span{font-size:.9rem}
.count.err{background:var(--err-bg)} .count.err strong{color:var(--err)}
.count.warn{background:var(--warn-bg)} .count.warn strong{color:var(--warn)}
.count.tip{background:var(--tip-bg)} .count.tip strong{color:var(--tip)}

table.cats{border-collapse:collapse;width:100%;margin:.4rem 0}
table.cats th,table.cats td{text-align:left;padding:.5rem .6rem;border-bottom:1px solid var(--line)}
table.cats thead th{border-bottom:2px solid var(--ink)}
table.cats thead th:not(:first-child){text-align:right}
table.cats td.n{text-align:right;font-variant-numeric:tabular-nums}

.badge{display:inline-block;font-size:.8rem;font-weight:700;padding:.12rem .5rem;border-radius:1rem;white-space:nowrap}
.badge.error{background:var(--err-bg);color:var(--err);border:1px solid var(--err)}
.badge.warning{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.badge.tip{background:var(--tip-bg);color:var(--tip);border:1px solid var(--tip)}
.badge.spec{background:#000;color:#fff}
.badge.fixed{background:var(--green-ink);color:#fff}

details.issue{border:1px solid var(--line);border-radius:.5rem;margin:.5rem 0;background:var(--surface)}
details.issue summary{cursor:pointer;padding:.7rem .9rem;display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center}
details.issue summary .t{font-weight:700}
details.issue summary .w{color:var(--muted);font-size:.92rem}
details.issue .body{padding:0 .9rem .9rem}
.kv{margin:.4rem 0}
.kv b{display:inline}
pre.snip{background:#f3f6f4;color:#000;border:1px solid var(--line);padding:.6rem .8rem;border-radius:.4rem;overflow-x:auto;font-family:var(--mono);font-size:.85rem;white-space:pre-wrap;word-break:break-word;max-height:12rem}
.preview{max-width:16rem;max-height:11rem;border:1px solid var(--line);border-radius:.3rem;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/16px 16px}

.toolbar{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;justify-content:space-between;padding:1rem;border:2px solid var(--ink);border-radius:.7rem;margin-bottom:1rem;position:sticky;top:0;background:var(--bg);z-index:2}
fieldset.filters{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.4rem}
fieldset.filters legend{font-weight:700;margin-right:.4rem;float:left;padding-top:.35rem}
.filters label{border:2px solid var(--ink);border-radius:2rem;padding:.25rem .8rem;cursor:pointer;font-size:.92rem}
.filters input{position:absolute;opacity:0}
.filters input:checked+span{font-weight:700}
.filters label:has(input:checked){background:var(--ink);color:var(--bg)}
.filters label:has(input:focus-visible){outline:3px solid var(--green);outline-offset:2px}
.progress{min-width:14rem}
.progress .bar{height:.7rem;background:var(--line);border-radius:1rem;overflow:hidden;margin-top:.3rem}
.progress .bar i{display:block;height:100%;background:var(--green-ink)}

article.card{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:.5rem;padding:1rem 1.1rem;margin:0 0 .9rem;background:var(--surface)}
article.card[data-sev=error]{border-left-color:var(--err)}
article.card[data-sev=warning]{border-left-color:#c98a00}
article.card[data-sev=tip]{border-left-color:var(--tip)}
article.card.is-fixed{border-left-color:var(--green-ink);background:var(--soft)}
.card header{display:flex;flex-wrap:wrap;gap:.4rem .7rem;align-items:center;margin-bottom:.4rem}
.card .where{color:var(--muted);font-size:.92rem;width:100%}
.card .why{margin:.4rem 0}
.card .how{margin:.4rem 0;padding:.5rem .7rem;background:var(--soft);border-radius:.35rem}
.fix{margin-top:.8rem;padding-top:.8rem;border-top:1px dashed var(--line);display:grid;gap:.6rem}
.fix .inline{display:flex;flex-wrap:wrap;gap:.6rem;align-items:flex-end}
.fix .inline>div{flex:1 1 16rem}
.check{display:flex;gap:.5rem;align-items:center}
.check input{width:1.2rem;height:1.2rem;accent-color:var(--green-ink)}
.swatch{display:inline-flex;align-items:center;gap:.6rem;padding:.4rem .7rem;border:1px solid var(--line);border-radius:.4rem}
input[type=color]{width:3rem;height:2.4rem;border:2px solid #5b6b63;border-radius:.3rem;padding:0;background:none}
.ratio-ok{color:var(--green-ink);font-weight:700}
.ratio-bad{color:var(--err);font-weight:700}
.fixed-note{color:var(--green-ink);font-weight:700;margin:.6rem 0 0}
.spec-box{border:2px solid #000;border-radius:.6rem;padding:1rem 1.2rem;margin:1rem 0}
.spec-box ol{margin:.4rem 0;padding-left:1.3rem}

.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:1rem;margin:1rem 0}
.compare .box{border:2px solid var(--ink);border-radius:.7rem;padding:1rem 1.2rem}
.compare .box strong{font-size:2.4rem;display:block;line-height:1.1}
.compare .box.after{border-color:var(--green-ink);background:var(--soft)}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}
.dl section{border:1px solid var(--line);border-top:4px solid var(--green);border-radius:.5rem;padding:1rem 1.1rem}
.dl section h3{margin-bottom:.3rem}
.dl section p{margin:.2rem 0 .8rem;color:var(--muted);font-size:.95rem}
.log li{margin:.25rem 0}

@media (max-width:52rem){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100%}
  .rail{padding:1rem}
  .brand{padding-bottom:.8rem}
  .steps{display:flex;overflow-x:auto;gap:.3rem;margin-top:.8rem}
  .steps::before{display:none}
  .steps li{flex:none}
  .steps small{display:none}
  .filecard{display:none}
  main{overflow:visible}
  .summary{grid-template-columns:1fr;justify-items:start}
  .toolbar{position:static}
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to main content</a>
<div class="app">
  <nav class="rail" aria-label="Accessibility workflow">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#00a86b"/><circle cx="20" cy="10" r="3.4" fill="#000"/><path d="M10 15.5h20M20 15.5v8.5l-5 9.5M20 24l5 9.5" stroke="#000" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <div><b>Accessibility Repair Studio</b><span>Assess, repair, recheck</span></div>
    </div>
    <ol class="steps" id="steps"></ol>
    <div class="filecard" id="fileCard" hidden></div>
  </nav>
  <main id="main" tabindex="-1">
    <header class="top">
      <p class="stepno" id="stepNo"></p>
      <h1 id="stepTitle" tabindex="-1"></h1>
      <p class="lede" id="stepLede"></p>
    </header>
    <div id="view"></div>
  </main>
</div>
<div id="live" class="sr" role="status" aria-live="polite"></div>

<script>
/* ===================== Core state & helpers ===================== */
const STEPS=[
 {id:'upload',name:'Upload',sub:'Add a file or paste a page',title:'Upload course content',lede:'Add an HTML page, Word document, PDF, or PowerPoint file, or paste the HTML from a Canvas page. Files are processed in your browser and are not uploaded anywhere.'},
 {id:'assess',name:'Assessment',sub:'Find accessibility issues',title:'Assessment',lede:'Each issue explains why it matters for students using assistive technology and what correction is recommended.'},
 {id:'repair',name:'Guided repairs',sub:'Fix issues one at a time',title:'Guided repairs',lede:'Apply corrections one at a time, or apply every automatic fix at once. Issues that this tool cannot repair include the steps for specialized remediation.'},
 {id:'reassess',name:'Reassessment',sub:'Recheck the repaired file',title:'Reassessment',lede:'The repaired file is rebuilt and scanned again from scratch, so the results reflect exactly what you will download.'},
 {id:'download',name:'Download',sub:'Repaired file and alternative formats',title:'Download and alternative formats',lede:'Download the repaired file, an assessment report, and alternative formats that students can choose from.'}
];
const KIND_LABEL={html:'HTML page',docx:'Word document',pdf:'PDF',pptx:'PowerPoint presentation'};
const S={step:'upload',kind:null,name:'',model:null,baseline:null,current:null,after:null,log:[],rounds:0,filter:'open',busy:false};

const $=(s,r=document)=>r.querySelector(s);
function el(tag,props={},...kids){
  const n=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false) continue;
    if(k==='class') n.className=v;
    else if(k==='text') n.textContent=v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2),v);
    else if(k==='checked'||k==='value'||k==='disabled'||k==='selected') n[k]=v;
    else n.setAttribute(k,v===true?'':v);
  }
  for(const k of kids.flat()){ if(k==null||k===false) continue; n.append(k.nodeType?k:document.createTextNode(String(k))); }
  return n;
}
const announce=msg=>{const l=$('#live');l.textContent='';setTimeout(()=>l.textContent=msg,50);};
const escXML=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const escHTML=escXML;
const trunc=(s,n=90)=>{s=(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s;};
const plural=(n,w,p)=>n+' '+(n===1?w:(p||w+'s'));
const isLang=v=>/^[a-z]{2,3}(-[a-z0-9]{2,8})*$/i.test((v||'').trim());

/* contrast math */
function lum(rgb){const f=c=>{c/=255;return c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4)};return 0.2126*f(rgb[0])+0.7152*f(rgb[1])+0.0722*f(rgb[2]);}
function cratio(a,b){const A=lum(a),B=lum(b);return (Math.max(A,B)+0.05)/(Math.min(A,B)+0.05);}
const toHex=rgb=>'#'+rgb.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const fromHex=h=>{h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));};
function suggestColor(fg,bg,need){
  const darken=lum(bg)>0.179;
  for(let i=1;i<=100;i++){const t=i/100;const c=darken?fg.map(v=>v*(1-t)):fg.map(v=>v+(255-v)*t);if(cratio(c,bg)>=need+0.1)return c.map(Math.round);}
  return darken?[0,0,0]:[255,255,255];
}
function parseRGB(s){const m=s&&s.match(/rgba?\(([^)]+)\)/);if(!m)return null;const p=m[1].split(/[\s,\/]+/).filter(Boolean).map(parseFloat);if(p.length<3)return null;return {rgb:p.slice(0,3).map(Math.round),a:p.length>3?p[3]:1};}

/* issue context */
function makeCtx(){
  const c={issues:[],total:0,notes:[],
    check(n=1){c.total+=n;},
    add(i){i.id='i'+(c.issues.length+1);i.status='open';i.weight=i.weight||1;c.issues.push(i);return i;},
    note(t){if(!c.notes.includes(t))c.notes.push(t);}};
  return c;
}
function scoreOf(ctx){
  const w=ctx.issues.reduce((s,i)=>s+(i.sev==='error'?i.weight:i.sev==='warning'?i.weight*0.5:0),0);
  if(!ctx.total) return 100;
  return Math.max(0,Math.min(100,Math.round(100*(1-w/Math.max(ctx.total,w)))));
}
const SEV_LABEL={error:'Must fix',warning:'Should fix',tip:'Review'};

/* XML namespaces */
const NS={w:'http://schemas.openxmlformats.org/wordprocessingml/2006/main',wp:'http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing',a:'http://schemas.openxmlformats.org/drawingml/2006/main',r:'http://schemas.openxmlformats.org/officeDocument/2006/relationships',p:'http://schemas.openxmlformats.org/presentationml/2006/main',dc:'http://purl.org/dc/elements/1.1/',cp:'http://schemas.openxmlformats.org/package/2006/metadata/core-properties',rel:'http://schemas.openxmlformats.org/package/2006/relationships'};
const all=(n,ns,tag)=>n?[...n.getElementsByTagNameNS(NS[ns],tag)]:[];
const kid=(n,ns,tag)=>n?[...n.children].find(c=>c.namespaceURI===NS[ns]&&c.localName===tag):null;
const mk=(doc,ns,tag)=>doc.createElementNS(NS[ns],ns+':'+tag);
const wval=n=>n?n.getAttributeNS(NS.w,'val'):null;
function xfrag(doc,xml){const d=new DOMParser().parseFromString(`<x xmlns:a="${NS.a}" xmlns:p="${NS.p}" xmlns:r="${NS.r}" xmlns:w="${NS.w}">${xml}</x>`,'application/xml');return doc.importNode(d.documentElement.firstElementChild,true);}
const parseXML=s=>new DOMParser().parseFromString(s,'application/xml');
function serXML(doc){let s=new XMLSerializer().serializeToString(doc);if(!s.startsWith('<?xml'))s='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n'+s;return s;}
function resolvePath(base,t){if(t.startsWith('/'))return t.slice(1);const out=[];for(const p of (base+t).split('/')){if(p==='..')out.pop();else if(p&&p!=='.')out.push(p);}return out.join('/');}
async function relsMap(zip,path){const f=zip.file(path);if(!f)return {};const d=parseXML(await f.async('string'));const m={};all(d,'rel','Relationship').forEach(r=>m[r.getAttribute('Id')]={target:r.getAttribute('Target'),mode:r.getAttribute('TargetMode')});return m;}
const MIME={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',svg:'image/svg+xml',webp:'image/webp',bmp:'image/bmp'};

function altProblem(alt,name){
  const a=(alt||'').trim();
  if(/\.(png|jpe?g|gif|svg|webp|bmp|tiff?|emf|wmf)$/i.test(a)||/^(img|image|dsc|screenshot|picture)[\s_-]?\d+/i.test(a)) return 'The description is a file name, which tells students nothing about the image.';
  if(/^(image|picture|photo|graphic|img|figure|icon|logo|chart|diagram)( of)?\.?$/i.test(a)) return 'The description is a generic word rather than a description of what the image shows.';
  if(name&&a&&a===name.trim()&&/^(picture|image|graphic|content placeholder)\s*\d*/i.test(a)) return 'The description is the default object name assigned by Office.';
  if(a.length>180) return 'The description is very long. Keep alt text brief and move long explanations into the surrounding text.';
  return null;
}

  outline(m){

function retag(e,tag){const n=e.ownerDocument.createElement(tag);for(const a of e.attributes)n.setAttribute(a.name,a.value);while(e.firstChild)n.appendChild(e.firstChild);e.replaceWith(n);return n;}
function makeHeaders(t,mode){

  if(mode!=='col')[...rows[0].cells].forEach(c=>{const th=c.tagName==='TH'?c:retag(c,'th');th.setAttribute('scope','col');});
  if(mode!=='row')rows.forEach((r,i)=>{if(i===0&&mode==='both')return;const c=r.cells[0];if(c){const th=c.tagName==='TH'?c:retag(c,'th');th.setAttribute('scope','row');}});

}

        let rpd=kid(d2,'w','rPrDefault');if(!rpd){rpd=mk(s,'w','rPrDefault');d2.insertBefore(rpd,d2.firstChild);}
        let rpr=kid(rpd,'w','rPr');if(!rpr){rpr=mk(s,'w','rPr');rpd.appendChild(rpr);}
        let l=kid(rpr,'w','lang');if(!l){l=mk(s,'w','lang');rpr.appendChild(l);}l.setAttributeNS(NS.w,'w:val',v.trim());}}});
    /* headings */
    const heads=paras.map((p,i)=>({p,i,l:DOCX.level(p,names)})).filter(x=>x.l);

      why:'Headings built with Word heading styles let screen reader users navigate by section and generate the navigation pane.',
      how:'Apply Heading 1, Heading 2, and so on to section titles. Convert any bold "fake headings" flagged below.',wcag:'1.3.1 Info and Relationships'});
    let prev=0;
    heads.forEach(({p,l})=>{

      if(l>prev+1){
        const opts=[];for(let k=1;k<=prev+1;k++)opts.push([String(k),'Heading '+k]);

      const apply=(v,dec)=>{if(dec)markDecorative(dp);else dp.setAttribute('descr',v.trim());};

      if(!descr.trim()) ctx.add({sev:'error',cat:'Image descriptions',title:'Image has no alt text',where:`Image ${idx+1}${near?` near "${near}"`:''}`,preview,
        why:'Screen readers announce only "picture" for images without alt text.',how:'Describe what the image shows and its purpose, or mark it decorative.',wcag:'1.1.1 Non-text Content',
        repair:{kind:'text',label:'Alt text',placeholder:'Describe the image',toggle:'Mark as decorative',apply}});
      else{const w=altProblem(descr,nm);if(w)ctx.add({sev:'warning',cat:'Image descriptions',title:'Alt text needs improvement',where:`Image ${idx+1}: "${trunc(descr,50)}"`,preview,why:w,how:'Write a short, meaningful description.',wcag:'1.1.1 Non-text Content',
        repair:{kind:'text',label:'Alt text',placeholder:'Describe the image',toggle:'Mark as decorative',apply}});}
    }

      ctx.check();

        why:'A marked header row lets screen readers announce column headings as students move through cells, and repeats the header on each printed page.',
        how:'Mark the first row as a header row (Table Properties > Row > Repeat as header row).',wcag:'1.3.1 Info and Relationships',
        repair:{kind:'auto',label:'Mark first row as header',apply:()=>{const d=t.ownerDocument;let pr=kid(tr,'w','trPr');if(!pr){pr=mk(d,'w','trPr');const ex=kid(tr,'w','tblPrEx');tr.insertBefore(pr,ex?ex.nextSibling:tr.firstChild);}if(!kid(pr,'w','tblHeader'))pr.appendChild(mk(d,'w','tblHeader'));}}});
    });
  },
  outline(m){
    const names=DOCX.styleNames(m);const b=[];const body=all(m.doc,'w','body')[0];if(!body)return b;
    const t=coreTitleEl(m.core)?.textContent;if(t)b.push({t:'h',l:1,x:t});

    }
    return b;
  }
};

const PPTX={
  async load(buf){
    const zip=await JSZip.loadAsync(buf);
    const files={};
    const presF=zip.file('ppt/presentation.xml');if(!presF)throw new Error('This file does not contain a PowerPoint presentation.');
    const pres=parseXML(await presF.async('string'));
    const prels=await relsMap(zip,'ppt/_rels/presentation.xml.rels');
    let paths=all(pres,'p','sldId').map(s=>prels[s.getAttributeNS(NS.r,'id')]).filter(Boolean).map(r=>resolvePath('ppt/',r.target));
    if(!paths.length)paths=Object.keys(zip.files).filter(p=>/^ppt\/slides\/slide\d+\.xml$/.test(p)).sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0]);
    const slides=[];
    for(const p of paths){const f=zip.file(p);if(!f)continue;const doc=parseXML(await f.async('string'));files[p]=doc;const rp=p.replace(/slides\/(slide\d+\.xml)$/,'slides/_rels/$1.rels');slides.push({path:p,doc,rels:await relsMap(zip,rp)});}
    const cf=zip.file('docProps/core.xml');if(cf)files['docProps/core.xml']=parseXML(await cf.async('string'));

  },
  async export(m){for(const [p,d] of Object.entries(m.files))m.zip.file(p,serXML(d));return m.zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});},
  txt:n=>all(n,'a','t').map(t=>t.textContent).join(''),
  titleShape(doc){return all(doc,'p','sp').find(sp=>{const ph=all(sp,'p','ph')[0];const t=ph&&ph.getAttribute('type');return t==='title'||t==='ctrTitle';});},
  shapes(doc){const tree=all(doc,'p','spTree')[0];return tree?[...tree.children].filter(c=>/^(sp|pic|graphicFrame|grpSp|cxnSp|contentPart)$/.test(c.localName)):[];},
  shapeName(sh){const c=all(sh,'p','cNvPr')[0];return c?c.getAttribute('name')||'Unnamed':'Unnamed';},
  moveFirst(doc,sp){const tree=all(doc,'p','spTree')[0];const g=kid(tree,'p','grpSpPr');tree.insertBefore(sp,g?g.nextSibling:tree.firstChild);},

  },
  addTitle(m,s,text,hidden){

  async scan(m,ctx){

    ctx.check();
    if(m.core&&!(coreTitleEl(m.core)?.textContent||'').trim()) ctx.add({sev:'warning',cat:'Document properties',title:'Presentation title property is empty',where:'File > Info > Title',
      why:'The title property is announced when the file opens and is used when the file is converted to PDF.',how:'Add a descriptive title.',wcag:'2.4.2 Page Titled',
      repair:{kind:'text',label:'Presentation title',value:trunc(S.name.replace(/\.\w+$/,'').replace(/[_-]+/g,' '),80),apply:v=>setCoreTitle(m.core,v.trim())}});
    const seen={};

          why:'Screen reader users navigate a presentation by slide title. A slide without one is announced only as "Slide '+n+'".',
          how:'Add a unique title. If the design has no room, the title can be placed just above the slide, where it is read but not shown.',wcag:'2.4.6 Headings and Labels',
          repair:{kind:'text',label:'Slide title',toggle:tsp?null:'Place the title off-slide (read aloud but not visible)',apply:(v,hid)=>{if(tsp)PPTX.setText(tsp,v.trim());else PPTX.addTitle(m,s,v.trim(),hid);}}});

          repair:{kind:'text',label:'Slide title',value:tt+' (continued)',apply:v=>PPTX.setText(tsp,v.trim())}});}

            why:'Screen readers read objects in the order they were added, not the order they appear. Students may hear body text before the slide title.',
            how:'Move the title to the top of the reading order (Home > Arrange > Selection Pane, where the list is read bottom to top).',wcag:'1.3.2 Meaningful Sequence',
            repair:{kind:'auto',label:'Move title to first in reading order',apply:()=>PPTX.moveFirst(d,tsp)}});}

        const blip=all(pic,'a','blip')[0];let preview=null;
        if(blip){const r=s.rels[blip.getAttributeNS(NS.r,'embed')];if(r)preview=await zipImage(m.zip,resolvePath('ppt/slides/',r.target));}
        const apply=(v,dec)=>{if(dec)markDecorative(c);else c.setAttribute('descr',v.trim());};
        if(!descr.trim())ctx.add({sev:'error',cat:'Image descriptions',title:'Picture has no alt text',where:`Slide ${n}: ${nm}`,preview,
          why:'Without alt text, screen readers announce only "picture" and the image’s meaning is lost.',how:'Describe the image content and purpose, or mark it decorative.',wcag:'1.1.1 Non-text Content',
          repair:{kind:'text',label:'Alt text',placeholder:'Describe the picture',toggle:'Mark as decorative',apply}});
        else{const w=altProblem(descr,nm);if(w)ctx.add({sev:'warning',cat:'Image descriptions',title:'Alt text needs improvement',where:`Slide ${n}: "${trunc(descr,50)}"`,preview,why:w,how:'Write a short, meaningful description.',wcag:'1.1.1 Non-text Content',

      }

        const rPr=h.parentNode;if(!rPr||rPr.localName!=='rPr')return;const run=rPr.parentNode;const tEl=kid(run,'a','t');if(!tEl)return;
        ctx.check();const t=tEl.textContent.trim();const href=(s.rels[h.getAttributeNS(NS.r,'id')]||{}).target||'';
        const vague=VAGUE.includes(t.toLowerCase().replace(/[.!]$/,''));const url=/^(https?:\/\/|www\.)/i.test(t)&&t.length>35;
        if(vague||url)ctx.add({sev:'warning',cat:'Links',title:vague?`Link text "${t}" is not descriptive`:'Link text is a long web address',where:`Slide ${n}${href?' to '+trunc(href,50):''}`,
          why:'Link text should make sense on its own, since screen reader users often browse a list of links.',how:'Rewrite the link text to name the destination.',wcag:'2.4.4 Link Purpose',
          repair:{kind:'text',label:'Descriptive link text',apply:v=>{tEl.textContent=v.trim();}}});
      });
      /* contrast */
      const bgEl=all(d,'p','bg')[0];const bgClr=bgEl&&all(bgEl,'a','srgbClr')[0];const slideBg=bgClr?fromHex(bgClr.getAttribute('val')):[255,255,255];
      const groups=new Map();
      all(d,'a','r').forEach(r=>{
        const rPr=kid(r,'a','rPr');const sf=kid(rPr,'a','solidFill');const clr=kid(sf,'a','srgbClr');if(!clr)return;
        const t=PPTX.txt(r).trim();if(!t)return;
        let sp=r.parentNode;while(sp&&sp.localName!=='sp')sp=sp.parentNode;
        const spFill=sp&&kid(kid(kid(sp,'p','spPr'),'a','solidFill'),'a','srgbClr');

      });

          why:'Low contrast is hard to read on projectors and for students with low vision.',how:`Change the text color. Suggested: ${toHex(sug)}.`,wcag:'1.4.3 Contrast (Minimum)',
          repair:{kind:'color',label:'New text color',value:toHex(sug),bg:g.bg,need:g.need,apply:v=>g.els.forEach(e=>e.setAttribute('val',v.replace('#','').toUpperCase()))}});});

    return b;
  }

/* ===================== PDF ===================== */
const PDFX={
  async load(buf){
    const bytes=new Uint8Array(buf);
    const pdf=await pdfjsLib.getDocument({data:bytes.slice(0)}).promise;
    let lib=null;try{lib=await PDFLib.PDFDocument.load(bytes.slice(0),{ignoreEncryption:true,updateMetadata:false});}catch(e){console.warn(e);}
    return {bytes,pdf,lib,pages:[]};
  },
  async export(m){if(m.lib&&!m.lib.isEncrypted){const out=await m.lib.save();return new Blob([out],{type:'application/pdf'});}return new Blob([m.bytes],{type:'application/pdf'});},
  async scan(m,ctx){
    const {pdf,lib}=m;const P=PDFLib;const n=pdf.numPages;const cat=lib&&lib.catalog;
    ctx.note('PDF repairs here cover metadata, language, and form field descriptions. Tags, reading order, and figure alt text need a PDF remediation tool or a fix in the source document.');
    const spec=[];
    if(lib&&lib.isEncrypted){ctx.check();ctx.add({sev:'error',cat:'Security',title:'PDF is encrypted',where:'Document security settings',specialist:true,
      why:'Some security settings stop screen readers from extracting text, and encrypted files cannot be repaired here.',how:'Remove the security restrictions in the authoring tool or Acrobat, then assess the file again.',wcag:'4.1.2 Name, Role, Value'});}
    /* text availability */
    const limit=Math.min(n,100);const empty=[];m.pages=[];
    for(let i=1;i<=limit;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();let s='';tc.items.forEach(it=>{s+=it.str+(it.hasEOL?'\n':' ');});m.pages.push(s);if(s.replace(/\s/g,'').length<20)empty.push(i);}
    ctx.check(limit);
    if(empty.length===limit) ctx.add({sev:'error',cat:'Text availability',weight:limit,specialist:true,title:'No selectable text found (scanned image)',where:'All pages',
      why:'This PDF appears to be pictures of pages. Screen readers, search, translation, and text-to-speech find nothing to read.',
      how:'Run optical character recognition (OCR) in Acrobat Pro (Scan & OCR > Recognize text) and check the result, or replace it with the original digital document.',wcag:'1.1.1 Non-text Content, 1.4.5 Images of Text'});
    else if(empty.length) ctx.add({sev:'error',cat:'Text availability',weight:empty.length,specialist:true,title:`${plural(empty.length,'page')} with no selectable text`,where:'Pages '+empty.slice(0,25).join(', ')+(empty.length>25?'…':''),
      why:'These pages are likely scanned images or contain only graphics. Their content is invisible to assistive technology.',how:'Run OCR on these pages, or confirm they are intentionally blank or image-only and add alt text.',wcag:'1.1.1 Non-text Content'});
    if(n>limit)ctx.note(`Only the first ${limit} of ${n} pages were checked for text.`);
    if(!lib){ctx.note('The file structure could not be read, so metadata checks were skipped.');return;}
    /* metadata */
    ctx.check();
    const title=lib.getTitle();
    if(!(title||'').trim()) ctx.add({sev:'error',cat:'Metadata',title:'Document title is missing',where:'Document properties',
      why:'Screen readers and browsers announce the title. Without it, students hear only the file name.',how:'Add a descriptive title and show it in the window title bar.',wcag:'2.4.2 Page Titled',
      repair:lib.isEncrypted?null:{kind:'text',label:'Document title',value:trunc(S.name.replace(/\.\w+$/,'').replace(/[_-]+/g,' '),80),apply:v=>lib.setTitle(v.trim(),{showInWindowTitleBar:true})}});
    else{ctx.check();const vp=cat.lookup(P.PDFName.of('ViewerPreferences'));const ddt=vp&&vp.get&&vp.get(P.PDFName.of('DisplayDocTitle'));
      if(String(ddt)!=='true')ctx.add({sev:'warning',cat:'Metadata',title:'Title is not shown in the title bar',where:'Initial view settings',
        why:'Viewers show the file name instead of the title unless "Display document title" is turned on.',how:'Turn on Display Document Title.',wcag:'2.4.2 Page Titled',

  const pct=issues.length?Math.round(100*c.fixed/issues.length):0;
  v.append(el('div',{class:'toolbar'},fs,
    el('div',{class:'progress'},el('span',{id:'progLbl',text:`Fixed ${c.fixed} of ${issues.length}`}),el('div',{class:'bar',role:'progressbar','aria-labelledby':'progLbl','aria-valuemin':'0','aria-valuemax':'100','aria-valuenow':String(pct)},el('i',{style:`width:${pct}%`}))),
    el('div',{class:'row'},
      el('button',{class:'btn secondary',type:'button',disabled:!autos.length,onclick:()=>{let n=0;autos.forEach(i=>{if(applyFix(i,i.repair.value,false))n++;});announce(plural(n,'automatic fix')+' applied.');renderRepair();}},`Apply automatic fixes (${autos.length})`),
      el('button',{class:'btn',type:'button',onclick:()=>{S.after=null;go('reassess');}},'Reassess'))));
  const list=issues.filter(i=>S.filter==='open'?i.status!=='fixed':S.filter==='fixable'?i.status!=='fixed'&&i.repair:S.filter==='specialist'?i.status!=='fixed'&&i.specialist&&!i.repair:i.status==='fixed');
  const specOpen=issues.filter(i=>i.specialist&&!i.repair&&i.status!=='fixed');
  if(specOpen.length&&(S.filter==='specialist'||S.filter==='open')&&S.kind==='pdf')v.append(el('div',{class:'spec-box'},el('h2',{style:'margin-top:0',text:'Specialized PDF remediation'}),
    el('p',{text:'The most reliable fix is usually in the source file. If you have the original Word or PowerPoint file, assess and repair it here, then export to PDF with accessibility tags turned on.'}),
    el('ol',{},el('li',{text:'Word: File > Save As > PDF > Options > check "Document structure tags for accessibility" and "Create bookmarks using headings".'}),
      el('li',{text:'Without a source file: in Acrobat Pro, open All tools > Prepare for accessibility, run Autotag, then fix reading order, figure alt text, and table headers.'}),
      el('li',{text:'Verify the result with the free PDF Accessibility Checker (PAC) and a screen reader such as NVDA.'}))));
  if(!list.length)v.append(el('p',{text:S.filter==='fixed'?'Nothing has been fixed yet.':'Nothing in this view. Choose another filter or reassess the file.'}));
  list.forEach(i=>{
    const card=el('article',{class:'card'+(i.status==='fixed'?' is-fixed':''),'data-sev':i.sev,'aria-labelledby':'h-'+i.id});
    const fill=(after)=>{card.className='card'+(i.status==='fixed'?' is-fixed':'');card.replaceChildren(...[
      el('header',{},...badges(i),el('h3',{id:'h-'+i.id,text:i.title}),el('span',{class:'where',text:`${i.cat}${i.where?' · '+i.where:''}`})),
      el('p',{class:'why',text:i.why}),el('p',{class:'how'},el('b',{text:'Recommended correction: '}),i.how),
      i.preview?el('img',{class:'preview',src:i.preview,alt:'The image that needs a description'}):null,
      i.snippet?el('pre',{class:'snip'},el('code',{text:i.snippet})):null,
      fixControls(i,a=>{fill(a);updateToolbar();})].filter(Boolean));
      if(after){const n=card.querySelector('.fixed-note');if(n){n.tabIndex=-1;n.focus();}}};
    fill(false);v.append(card);
  });
  function updateToolbar(){const c2=countsFor(issues);const p=Math.round(100*c2.fixed/issues.length);$('#progLbl').textContent=`Fixed ${c2.fixed} of ${issues.length}`;const bar=$('.progress .bar');bar.setAttribute('aria-valuenow',p);bar.firstChild.style.width=p+'%';renderRail();}
}

function renderReassess(){
  const v=$('#view');
  if(!S.after){reassess();return;}
  v.replaceChildren();const a=S.after,b=S.baseline;
  const before=b.issues.length,now=a.issues.length;
  v.append(el('div',{class:'compare'},
    el('div',{class:'box'},el('span',{text:'Original score'}),el('strong',{text:String(b.score)}),el('span',{text:plural(before,'issue')})),
    el('div',{class:'box after'},el('span',{text:'Score after repairs'}),el('strong',{text:String(a.score)}),el('span',{text:plural(now,'issue')+' remaining'})),
    el('div',{class:'box'},el('span',{text:'Repairs applied'}),el('strong',{text:String(S.log.length)}),el('span',{text:`over ${plural(S.rounds,'recheck')}`}))));
  const c=countsFor(a.issues);
  if(!now)v.append(el('div',{class:'info-box'},el('p',{},el('b',{text:'All automated checks pass. '}),'Finish with a quick manual review: read the alt text in context and confirm the reading order makes sense.')));
  else v.append(el('p',{text:`${plural(c.fix,'remaining issue')} can be repaired here. ${c.spec?plural(c.spec,'issue')+' need specialized remediation. ':''}${c.tip?plural(c.tip,'item')+' should be reviewed by hand.':''}`}));
  v.append(el('div',{class:'row',style:'margin:1rem 0'},c.fix?el('button',{class:'btn',type:'button',onclick:()=>go('repair')},'Continue repairs'):null,el('button',{class:c.fix?'btn secondary':'btn',type:'button',onclick:()=>go('download')},'Go to download')));
  if(now){v.append(el('h2',{text:'Remaining issues'}));a.issues.forEach(i=>v.append(el('details',{class:'issue'},el('summary',{},...badges(i),el('span',{class:'t',text:i.title}),el('span',{class:'w',text:`${i.cat} · ${i.where||''}`})),issueDetail(i))));}
}

function outName(suffix,ext){const base=S.name.replace(/\.\w+$/,'');return `${base}${suffix}.${ext}`;}
function blocksToText(bl){return bl.map(b=>b.t==='h'?'\n'+b.x.trim().toUpperCase()+'\n':b.t==='img'?`[Image: ${b.x.trim()}]`:b.t==='li'?'• '+b.x.trim():b.t==='table'?b.rows.map(r=>r.join(' | ')).join('\n'):b.x.trim()).join('\n').replace(/\n{3,}/g,'\n\n').trim()+'\n';}
function blocksToHTML(bl,title){
  let out='',inList=false;
  bl.forEach(b=>{if(b.t!=='li'&&inList){out+='</ul>\n';inList=false;}
    if(b.t==='h')out+=`<h${b.l}>${escHTML(b.x.trim())}</h${b.l}>\n`;
    else if(b.t==='li'){if(!inList){out+='<ul>\n';inList=true;}out+=`<li>${escHTML(b.x.trim())}</li>\n`;}
    else if(b.t==='img')out+=`<p class="img"><span>Image:</span> ${escHTML(b.x.trim())}</p>\n`;
    else if(b.t==='table'){out+='<div class="t"><table>\n';b.rows.forEach((r,i)=>{out+='<tr>'+r.map(c=>i===0?`<th scope="col">${escHTML(c)}</th>`:`<td>${escHTML(c)}</td>`).join('')+'</tr>\n';});out+='</table></div>\n';}
    else out+=`<p>${escHTML(b.x.trim())}</p>\n`;});
  if(inList)out+='</ul>\n';
  if(!/^<h1/.test(out))out=`<h1>${escHTML(title)}</h1>\n`+out;
  return `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>${escHTML(title)}</title>\n<style>body{font-family:"Atkinson Hyperlegible",Verdana,sans-serif;font-size:1.25rem;line-height:1.7;max-width:42rem;margin:2rem auto;padding:0 1rem;color:#000;background:#fff}h1,h2,h3{line-height:1.25}.img{border-left:4px solid #006b45;padding-left:.8rem}.img span{font-weight:700}.t{overflow-x:auto}table{border-collapse:collapse}th,td{border:1px solid #444;padding:.4rem .6rem;text-align:left}@media (prefers-color-scheme:dark){body{background:#000;color:#fff}th,td{border-color:#aaa}.img{border-color:#4fd6a0}}</style>\n</head>\n<body>\n<main>\n${out}</main>\n</body>\n</html>\n`;
}
let speaking=false;
function renderDownload(){
  const v=$('#view');v.replaceChildren();const ext=S.kind==='html'?(S.name.match(/\.htm$/i)?'htm':'html'):S.kind;
  const docTitle=S.name.replace(/\.\w+$/,'').replace(/[_-]+/g,' ');
  if(S.log.length&&!S.after)v.append(el('div',{class:'info-box'},el('p',{},`You have ${plural(S.log.length,'repair')} that haven’t been rechecked. `,el('button',{class:'btn secondary',type:'button',style:'margin-left:.4rem',onclick:()=>{S.after=null;go('reassess');}},'Reassess first'))));
  const ext2=ext==='htm'?'html':ext;
  const mk3=(title,desc,btnLabel,fn)=>el('section',{},el('h3',{text:title}),el('p',{text:desc}),el('button',{class:'btn',type:'button',onclick:fn},btnLabel));
  v.append(el('h2',{text:'Repaired file'}));
  v.append(el('div',{class:'dl'},
    mk3(S.name.replace(/\.\w+$/,'')+'-accessible.'+ext2,S.kind==='html'?(S.model.fragment?'HTML to paste back into the Canvas HTML editor.':'The corrected HTML page.'):S.kind==='pdf'?'Metadata, language, and form field repairs. Tag-level issues still need remediation.':'Supported corrections saved in the original format.',
      'Download repaired file',async()=>{const b=await ENGINES[S.kind].export(S.model);saveFile(outName('-accessible',ext2),b);}),
    mk3('Assessment report (CSV)','Every issue with its location, status, WCAG reference, and recommended correction.','Download report',()=>saveFile(outName('-accessibility-report','csv'),reportCSV())),
    S.kind==='html'&&S.model.fragment?mk3('Copy repaired HTML','Copies the repaired page HTML for pasting into Canvas.','Copy HTML',async()=>{try{await navigator.clipboard.writeText(HTMLX.serialize(S.model,false));announce('Repaired HTML copied.');}catch(e){announce('Copy failed. Use Download repaired file instead.');}}):null));
  v.append(el('h2',{text:'Alternative formats for students'}));
  v.append(el('p',{class:'hint',text:'Alternative formats are generated from the repaired content, including headings, image descriptions, and table headers.'}));
  const blocks=()=>ENGINES[S.kind].outline(S.model);
  const play=el('button',{class:'btn',type:'button','aria-pressed':'false'},'Read aloud');
  play.addEventListener('click',()=>toggleSpeech(blocks,play));
  const canSpeak=ttsNS||('speechSynthesis' in window);
  v.append(el('div',{class:'dl'},
    mk3('Plain text','Works with any device, Braille display, or translation tool.','Download text',()=>saveFile(outName('-text','txt'),blocksToText(blocks()))),
    mk3('Readable HTML','Large, high-legibility text that reflows on phones and adapts to dark mode.','Download HTML',()=>saveFile(outName('-readable','html'),blocksToHTML(blocks(),docTitle))),
    canSpeak?el('section',{},el('h3',{text:'Audio'}),el('p',{text:'Listen to the content, with image descriptions read in place.'}),play):null));
  if(S.log.length){v.append(el('h2',{text:'Repair log'}));v.append(el('ol',{class:'log'},...S.log.map(l=>el('li',{},el('b',{text:l.cat+': '}),`${l.action}`,l.where?` (${trunc(l.where,70)})`:''))));}
}
function toggleSpeech(blocks,btn){
  const set=on=>{speaking=on;btn.textContent=on?'Stop reading':'Read aloud';btn.setAttribute('aria-pressed',String(on));};
  if(speaking){if(ttsNS)ttsNS.stop();else speechSynthesis.cancel();set(false);return;}
  const text=blocksToText(blocks()).split(/\n+/).map(s=>s.replace(/^• /,'').trim()).filter(Boolean);
  const lines=[];let cur='';text.forEach(t=>{if((cur+' '+t).length>1500){if(cur)lines.push(cur);cur=t.slice(0,1900);}else cur=cur?cur+'\n'+t:t;});if(cur)lines.push(cur);
  set(true);
  if(ttsNS){ttsNS.speak(lines.slice(0,60).map(t=>({text:t}))).then(()=>set(false)).catch(()=>set(false));return;}
  speechSynthesis.cancel();lines.forEach((t,i)=>{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';if(i===lines.length-1)u.onend=()=>set(false);speechSynthesis.speak(u);});
}
function reportCSV(){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['File','Type','Original score','Current score'].map(q).join(','),[S.name,KIND_LABEL[S.kind],S.baseline.score,S.current.score].map(q).join(','),'',
    ['Severity','Category','Issue','Location','Status','WCAG','Recommended correction','Repair applied'].map(q).join(',')];
  const seen=new Set();
  S.baseline.issues.forEach(i=>{seen.add(i.cat+i.title+i.where);rows.push([SEV_LABEL[i.sev]+(i.specialist&&!i.repair?' (specialist)':''),i.cat,i.title,i.where,i.status==='fixed'?'Fixed':(S.after&&!S.after.issues.some(x=>x.cat===i.cat&&x.title===i.title&&x.where===i.where))?'Resolved':'Open',i.wcag,i.how,i.action||''].map(q).join(','));});
  if(S.after&&S.after!==S.baseline)S.after.issues.forEach(i=>{if(!seen.has(i.cat+i.title+i.where))rows.push([SEV_LABEL[i.sev],i.cat,i.title,i.where,i.status==='fixed'?'Fixed':'Open',i.wcag,i.how,i.action||''].map(q).join(','));});
  return rows.join('\r\n');
}
