<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physics 101 Interactive Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<script>
try{var t=localStorage.getItem('p101-theme');document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');}catch(e){}
</script>
<style>
:root{
  --paper:#F3F6FB;--surface:#FFFFFF;--surface2:#EDF2F9;--ink:#13213C;--muted:#55657D;--line:#D3DCE9;--grid:#E4EAF3;
  --navy:#0047AB;--navy-strong:#0047AB;--green:#00A86B;--green-strong:#008F5B;--accent:#E8771A;--warn:#D23C3C;--water:#4C9FE0;
  --violet:#7A55D3;--asphalt:#4A5466;--wood:#E9C995;--grass:#9BCB7A;--space:#0B1630;--on-strong:#FFFFFF;
  --shadow:0 1px 2px rgba(19,33,60,.06),0 10px 30px rgba(19,33,60,.07);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D1524;--surface:#152036;--surface2:#1C2943;--ink:#E7EDF7;--muted:#9DAAC0;--line:#2B3B58;--grid:#1C2943;
    --navy:#7AA7FF;--navy-strong:#2F6FE0;--green:#34D399;--green-strong:#13996B;--accent:#FFA24C;--warn:#FF6B6B;--water:#3E8FD0;
    --violet:#B39BFF;--asphalt:#2E3646;--wood:#6B5233;--grass:#2F5A35;--space:#060C1C;--on-strong:#FFFFFF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1524;--surface:#152036;--surface2:#1C2943;--ink:#E7EDF7;--muted:#9DAAC0;--line:#2B3B58;--grid:#1C2943;
  --navy:#7AA7FF;--navy-strong:#2F6FE0;--green:#34D399;--green-strong:#13996B;--accent:#FFA24C;--warn:#FF6B6B;--water:#3E8FD0;
  --violet:#B39BFF;--asphalt:#2E3646;--wood:#6B5233;--grass:#2F5A35;--space:#060C1C;--on-strong:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3,h4{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px clamp(16px,3vw,28px);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:clamp(18px,2.2vw,22px);font-weight:800;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface2);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;flex:none}
.theme-btn svg{width:16px;height:16px}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);align-items:start}
.units{position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);max-height:calc(100vh - 63px - env(safe-area-inset-top,0px));overflow:auto;padding:18px 12px 24px;border-right:1px solid var(--line);background:var(--surface);min-height:calc(100vh - 63px)}
.units-label{font-size:13px;color:var(--muted);padding:0 10px 8px}
.unit{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:12px;cursor:pointer}
.unit:hover{background:var(--surface2)}
.unit .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:14px;border:2px solid var(--line);color:var(--muted)}
.unit .t{font-weight:700;font-size:15px;line-height:1.25}
.unit .s{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.unit[aria-current="true"]{background:var(--surface2)}
.unit[aria-current="true"] .n{background:var(--navy-strong);border-color:var(--navy-strong);color:var(--on-strong)}

main{padding:22px clamp(14px,3vw,36px) 64px;min-width:0;max-width:1320px}
.mod-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;margin-bottom:14px}
.mod-head h2{font-size:clamp(26px,3.4vw,38px);font-weight:800;letter-spacing:-.02em}
.mod-head p{margin:0;color:var(--muted);font-size:16px}

.lab{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:16px;align-items:start}
.stage{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;height:clamp(340px,64vh,560px);box-shadow:var(--shadow)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:default}
.toast{position:absolute;left:50%;top:16px;transform:translate(-50%,-8px);background:var(--navy-strong);color:var(--on-strong);font-weight:700;padding:8px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;font-size:15px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{position:absolute;left:12px;bottom:10px;font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:3px 8px;border-radius:8px;pointer-events:none;max-width:70%}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modes{display:flex;flex-direction:column;gap:6px}
.modes:empty{display:none}
.modes .lbl{font-size:13px;color:var(--muted)}
.modes .seg button{font-weight:700}
.controls{display:flex;flex-direction:column;gap:12px}
.ctl{display:block}
.ctl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin-bottom:2px}
.ctl output{font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--navy-strong);height:22px;margin:0}
.seg-wrap .lbl,.sel-wrap .lbl{font-size:14px;margin-bottom:4px;display:block}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.seg button{flex:1;border:0;background:transparent;padding:7px 6px;cursor:pointer;font-size:13.5px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--navy-strong);color:var(--on-strong);font-weight:700}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--green-strong)}
select{width:100%;font:inherit;font-size:14px;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;border:1px solid var(--line);background:var(--surface2);padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer;font-size:14.5px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--green-strong);border-color:var(--green-strong);color:var(--on-strong)}
.btn.hold:active,.btn.hold.on{background:var(--navy-strong);border-color:var(--navy-strong);color:var(--on-strong)}
.readouts h3{font-size:15px;font-weight:800;margin-bottom:4px}
.ro{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ro:last-child{border-bottom:0}
.ro span{color:var(--muted)}
.ro b{font-variant-numeric:tabular-nums;text-align:right}
.ro b.good{color:var(--green)} .ro b.bad{color:var(--warn)}

.learn{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card h3{font-size:19px;font-weight:800;margin-bottom:8px}
.card h4{font-size:15px;font-weight:800;margin:14px 0 6px}
.card p{margin:0;max-width:68ch}
.eqs{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.eqs li{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:15px;font-family:"Cambria Math","STIX Two Math","Times New Roman",serif}
.tries{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.quiz .q{font-weight:700;margin-bottom:10px}
.quiz .opts{display:flex;flex-direction:column;gap:7px}
.quiz .opt{text-align:left;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14.5px}
.quiz .opt.right{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--surface))}
.quiz .opt.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.quiz .fb{margin-top:10px;font-size:14.5px}
.quiz .fb strong{display:block}

@media (max-width:1100px){.learn{grid-template-columns:1fr 1fr}.learn .card:first-child{grid-column:1/-1}}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .units{position:sticky;top:calc(env(safe-area-inset-top,0px) + 59px);z-index:20;min-height:0;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line)}
  .units-label{display:none}
  .unit{grid-template-columns:auto auto;align-items:center;flex:none;width:auto;padding:6px 12px 6px 6px;border:1px solid var(--line)}
  .unit .s{display:none}
  .unit .n{width:26px;height:26px;font-size:12.5px}
  .lab{grid-template-columns:1fr}
  .stage{height:clamp(300px,52vh,460px)}
  .brand p{display:none}
}
@media (max-width:640px){.learn{grid-template-columns:1fr}.theme-btn span{display:none}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="40" height="34" viewBox="0 0 40 34" aria-hidden="true">
      <path d="M3 31 Q20 -14 37 31" fill="none" stroke="var(--line)" stroke-width="2"/>
      <circle cx="3" cy="31" r="2.4" fill="var(--navy)"/><circle cx="9.5" cy="16" r="2.4" fill="var(--navy)"/>
      <circle cx="16" cy="9.4" r="2.4" fill="var(--navy)"/><circle cx="24" cy="9.4" r="2.4" fill="var(--green)"/>
      <circle cx="30.5" cy="16" r="2.4" fill="var(--green)"/><circle cx="37" cy="31" r="2.4" fill="var(--green)"/>
    </svg>
    <div><h1>Physics 101 Lab</h1><p>Ten hands-on simulators for mechanics, fluids, oscillations and waves</p></div>
  </div>
  <button class="theme-btn" id="themeBtn" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <span>Dark mode</span>
  </button>
</header>
<div class="app">
  <nav class="units" id="units" aria-label="Course units"><div class="units-label">Course units</div></nav>
  <main>
    <div class="mod-head"><h2 id="modTitle"></h2><p id="modSub"></p></div>
    <section class="lab">
      <div class="stage" id="stage">
        <canvas id="cv" role="img"></canvas>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="hint" id="hint"></div>
      </div>
      <aside class="panel" aria-label="Simulator controls">
        <div class="modes" id="modes"></div>
        <div class="controls" id="controls"></div>
        <div class="readouts"><h3>Live readings</h3><div id="ro"></div></div>
      </aside>
    </section>
    <section class="learn">
      <article class="card"><h3>The big idea</h3><p id="intro"></p><h4>Key equations</h4><ul class="eqs" id="eqs"></ul></article>
      <article class="card"><h3>Try this</h3><ul class="tries" id="tries"></ul></article>
      <article class="card quiz"><h3>Check yourself</h3><div id="quiz"></div></article>
    </section>
  </main>
</div>

<script>
(function(){
'use strict';
const TAU=Math.PI*2,DEG=Math.PI/180,G=9.8;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const smooth=(x,a,b)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const FONT='"Atkinson Hyperlegible",system-ui,sans-serif';
const HFONT='"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif';
function fmt(v,d=2){if(v==null||!isFinite(v))return '—';let s=(Math.abs(v)>=1e5||(Math.abs(v)<1e-3&&v!==0))?v.toExponential(2):v.toFixed(d);if(/^-0(\.0+)?$/.test(s))s=s.slice(1);return s.replace('-','−')}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}

/* ---------- colors ---------- */
const C={};
function readColors(){const cs=getComputedStyle(document.documentElement);['paper','surface','surface2','ink','muted','line','grid','navy','green','accent','warn','water','violet','asphalt','wood','grass','space'].forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim())}
function hexRGB(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}

/* ---------- drawing helpers ---------- */
function txt(ctx,s,x,y,o={}){ctx.save();ctx.fillStyle=o.col||C.ink;ctx.font=(o.w||400)+' '+(o.size||13)+'px '+(o.font||FONT);ctx.textAlign=o.align||'left';ctx.textBaseline=o.base||'alphabetic';ctx.fillText(s,x,y);ctx.restore()}
function rr(ctx,x,y,w,h,r){r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function paper(ctx,w,h,step=24){ctx.fillStyle=C.surface;ctx.fillRect(0,0,w,h);ctx.strokeStyle=C.grid;ctx.lineWidth=1;ctx.beginPath();for(let x=.5;x<w;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,h)}for(let y=.5;y<h;y+=step){ctx.moveTo(0,y);ctx.lineTo(w,y)}ctx.stroke()}
function arrow(ctx,x1,y1,x2,y2,col,label,lw=2.6){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy);if(L<3)return;const ux=dx/L,uy=dy/L,hd=Math.min(11,L*.5);ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-ux*hd*.7,y2-uy*hd*.7);ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-ux*hd-uy*hd*.55,y2-uy*hd+ux*hd*.55);ctx.lineTo(x2-ux*hd+uy*hd*.55,y2-uy*hd-ux*hd*.55);ctx.closePath();ctx.fill();ctx.restore();if(label){txt(ctx,label,x2+ux*14,y2+uy*14+4,{col,w:700,size:12.5,align:'center'})}}
function graph(ctx,x,y,w,h,o){ctx.save();rr(ctx,x,y,w,h,10);ctx.fillStyle=C.surface;ctx.fill();ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.stroke();
  const px=x+44,py=y+26,pw=w-56,ph=h-48;let ymin=o.ymin,ymax=o.ymax;if(!(ymax-ymin>1e-9)){ymax+=1;ymin-=1}
  const X=v=>px+(v-o.xmin)/(o.xmax-o.xmin)*pw,Y=v=>py+ph-(v-ymin)/(ymax-ymin)*ph;
  txt(ctx,o.title,x+12,y+17,{w:700,size:12.5});
  ctx.strokeStyle=C.line;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,py+ph);ctx.lineTo(px+pw,py+ph);ctx.stroke();
  if(ymin<0&&ymax>0){ctx.setLineDash([3,4]);ctx.beginPath();ctx.moveTo(px,Y(0));ctx.lineTo(px+pw,Y(0));ctx.stroke();ctx.setLineDash([]);txt(ctx,'0',px-5,Y(0)+4,{align:'right',size:10,col:C.muted})}
  txt(ctx,fmt(ymax,1),px-5,py+4,{align:'right',size:10,col:C.muted});txt(ctx,fmt(ymin,1),px-5,py+ph+3,{align:'right',size:10,col:C.muted});
  txt(ctx,o.xlabel||'',px+pw,y+h-7,{align:'right',size:10.5,col:C.muted});txt(ctx,fmt(o.xmin,0),px,y+h-7,{size:10,col:C.muted});
  ctx.beginPath();ctx.rect(px,py-2,pw,ph+4);ctx.clip();
  for(const s of o.series){if(!s.pts||s.pts.length<2)continue;ctx.strokeStyle=s.col;ctx.lineWidth=s.lw||2.2;ctx.setLineDash(s.dash||[]);ctx.beginPath();s.pts.forEach((p,i)=>{const a=X(p[0]),b=Y(p[1]);i?ctx.lineTo(a,b):ctx.moveTo(a,b)});ctx.stroke()}
  ctx.setLineDash([]);if(o.dot){ctx.fillStyle=o.dot.col;ctx.beginPath();ctx.arc(X(o.dot.x),Y(o.dot.y),4.5,0,TAU);ctx.fill()}
  ctx.restore()}
function ebars(ctx,x,y,w,h,items,max,title){ctx.save();rr(ctx,x,y,w,h,10);ctx.fillStyle=C.surface;ctx.fill();ctx.strokeStyle=C.line;ctx.stroke();
  txt(ctx,title||'Energy',x+12,y+18,{w:700,size:12.5});const n=items.length,bw=(w-16)/n,base=y+h-26,top=y+38,H=base-top;
  ctx.strokeStyle=C.line;ctx.beginPath();ctx.moveTo(x+8,base+.5);ctx.lineTo(x+w-8,base+.5);ctx.stroke();
  items.forEach((it,i)=>{const bh=clamp(max>0?it.val/max:0,0,1)*H,bx=x+8+i*bw+bw*.17,bwid=bw*.66;
    if(it.outline){ctx.strokeStyle=it.col;ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.strokeRect(bx,base-bh,bwid,bh);ctx.setLineDash([])}else{ctx.fillStyle=it.col;rr(ctx,bx,base-bh,bwid,bh,3);ctx.fill()}
    txt(ctx,it.label,bx+bwid/2,base+15,{align:'center',size:11,col:C.muted});txt(ctx,fmt(it.val,0),bx+bwid/2,base-bh-5,{align:'center',size:10.5,w:700,col:it.col})});ctx.restore()}
function stick(ctx,fx,fy,u,col,arms,spread=.13){ctx.save();ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=Math.max(2,u*.055);ctx.lineCap='round';ctx.lineJoin='round';
  const hip=[fx,fy-u*.48],sh=[fx,fy-u*.8];ctx.beginPath();ctx.moveTo(fx-u*spread,fy);ctx.lineTo(hip[0],hip[1]);ctx.lineTo(fx+u*spread,fy);ctx.moveTo(hip[0],hip[1]);ctx.lineTo(sh[0],sh[1]);
  (arms||[[fx-u*.15,fy-u*.5],[fx+u*.15,fy-u*.5]]).forEach(a=>{ctx.moveTo(sh[0],sh[1]);ctx.lineTo(a[0],a[1])});ctx.stroke();ctx.beginPath();ctx.arc(fx,fy-u*.91,u*.085,0,TAU);ctx.fill();ctx.restore();return{sh,hip}}
function wheel(ctx,x,y,r,ang,col){ctx.save();ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.strokeStyle=C.surface;ctx.lineWidth=Math.max(1.2,r*.18);ctx.beginPath();for(let k=0;k<3;k++){const a=ang+k*TAU/3;ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*r*.75,y+Math.sin(a)*r*.75)}ctx.stroke();ctx.restore()}

/* ---------- audio ---------- */
let AC=null;
function audio(){try{if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;AC=new A()}if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}

/* ---------- UI builders ---------- */
function makeUI(panel){
  return{

      ctx.beginPath();ctx.moveTo(X(-L),oy);for(let i=0;i<=120;i++){const xx=-L+2*L*i/120;ctx.lineTo(X(xx),Y(yT(xx)))}ctx.lineTo(X(L),oy);ctx.closePath();ctx.fillStyle=C.line;ctx.fill();

  ui.slider({label:'Car A mass (with rider)',min:100,max:600,step:10,value:p.m1,unit:'kg',on:v=>{p.m1=v;reset()}});

    ui.slider({label:'Bounciness e (0 = stick, 1 = elastic)',min:0,max:1,step:.05,value:1,on:v=>{p.e=v;reset()}})}

      if(!explode&&!collided&&x2-x1<=2&&u1>u2){const M=p.m1+p.m2,P=p.m1*u1+p.m2*u2,du=u1-u2;const n1=(P-p.m2*p.e*du)/M,n2=(P+p.m1*p.e*du)/M;u1=n1;u2=n2;collided=true;const ov=2-(x2-x1);x1-=ov/2;x2+=ov/2;

    draw(ctx,w,h){paper(ctx,w,h,28);const s=(w-40)/17.5,cx=w/2,ty=h*.44,X=m=>cx+m*s;

      if(explode&&!collided){const a=X(x1+1),b=X(x2-1);ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<=12;i++){const xx=a+(b-a)*i/12,yy=ty-.45*s+(i%2?-8:8)*(i&&i<12?1:0);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke()}
      const car=(xm,u,m,col,lab)=>{const cw=2*s,chh=1.15*s,bx=X(xm),by=ty;ctx.fillStyle='#2a2f3a';rr(ctx,bx-cw/2-3,by-chh*.55,cw+6,chh*.42,chh*.2);ctx.fill();ctx.fillStyle=col;rr(ctx,bx-cw/2,by-chh,cw,chh*.62,10);ctx.fill();

      ro.set('p1','Car A momentum',fmt(p1,0)+' kg·m/s');ro.set('p2','Car B momentum',fmt(p2,0)+' kg·m/s');ro.set('pb','Total momentum before',fmt(before.p1+before.p2,0)+' kg·m/s');ro.set('pt','Total momentum now',fmt(pt,0)+' kg·m/s','good');

/* =====================================================================
   5. CIRCULAR MOTION & GRAVITATION
   ===================================================================== */
function circOrbit(env){
  const {ui,ro,toast}=env;const GM=3.986e14,R=6.371e6;
  const p={alt:400,v:7.67,m:1000,warp:600};let pos=null,vel=null,trail=[],status='ready',viewR=3*R,tSim=0;
  const stars=[];let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;for(let i=0;i<160;i++)stars.push([rnd(),rnd(),rnd()*1.4+.3]);
  const conic=()=>{const r=R+p.alt*1e3,v=p.v*1e3,eps=v*v/2-GM/r,pc=r*r*v*v/GM,e=Math.abs(r*v*v/GM-1),om=v*v*r/GM>=1?Math.PI/2:-Math.PI/2;let apo=e<1?pc/(1-e):Infinity,a=e<1?-GM/(2*eps):Infinity;return{r,v,eps,pc,e,om,apo,peri:pc/(1+e),a}};
  const setView=()=>{const q=conic();viewR=q.e<1?clamp(Math.max(q.apo,q.r)*1.12,1.6*R,14*R):clamp(q.r*4,4*R,14*R)};
  const ready=()=>{status='ready';pos=null;vel=null;trail=[];tSim=0;setView()};
  const sA=ui.slider({label:'Launch altitude',min:200,max:36000,step:100,value:p.alt,unit:'km',on:v=>{p.alt=v;ready()}});
  const sV=ui.slider({label:'Launch speed (sideways)',min:1,max:12,step:.01,value:p.v,unit:'km/s',on:v=>{p.v=v;ready()}});
  ui.slider({label:'Satellite mass',min:100,max:10000,step:100,value:p.m,unit:'kg',on:v=>p.m=v});
  ui.slider({label:'Time warp',min:100,max:20000,step:100,value:p.warp,unit:'×',on:v=>p.warp=v});
  ui.seg({label:'Real orbits',options:[{v:'iss',t:'ISS'},{v:'gps',t:'GPS'},{v:'geo',t:'Geostationary'}],value:'iss',on:v=>{const o={iss:[400,7.67],gps:[20200,3.87],geo:[35800,3.07]}[v];p.alt=o[0];p.v=o[1];sA.set(o[0]);sV.set(o[1]);ready()}});
  ui.buttons([{t:'Launch',primary:true,on:()=>{const r=R+p.alt*1e3;pos=[0,r];vel=[p.v*1e3,0];trail=[[0,r]];status='flying';tSim=0;setView()}},{t:'Reset',on:ready}]);
  ui.buttons([{t:'Use circular speed',on:()=>{const v=Math.sqrt(GM/(R+p.alt*1e3))/1e3;p.v=+v.toFixed(2);sV.set(p.v);ready()}},{t:'Use escape speed',on:()=>{const v=Math.sqrt(2*GM/(R+p.alt*1e3))/1e3;p.v=Math.min(12,+v.toFixed(2));sV.set(p.v);ready()}}]);
  setView();env.hint('Dashed curve: the orbit predicted for this launch.');
  const acc=q=>{const r=Math.hypot(q[0],q[1]),k=-GM/(r*r*r);return[k*q[0],k*q[1]]};
  return{
    step(dt){if(status!=='flying')return;const T=dt*p.warp,n=Math.ceil(T/5),h=T/n;
      for(let i=0;i<n;i++){const a=acc(pos);pos[0]+=vel[0]*h+.5*a[0]*h*h;pos[1]+=vel[1]*h+.5*a[1]*h*h;const a2=acc(pos);vel[0]+=.5*(a[0]+a2[0])*h;vel[1]+=.5*(a[1]+a2[1])*h;tSim+=h;
        const r=Math.hypot(pos[0],pos[1]);if(r<R){status='crashed';toast('Too slow: gravity pulled it back to Earth');break}
        const l=trail[trail.length-1];if(Math.hypot(pos[0]-l[0],pos[1]-l[1])>viewR/250){trail.push([pos[0],pos[1]]);if(trail.length>3000)trail.shift()}
        if(r>viewR*1.15){status='escaped';toast('Escaped: kinetic energy beat gravity');break}}},
    draw(ctx,w,h){ctx.fillStyle=C.space;ctx.fillRect(0,0,w,h);stars.forEach(s=>{ctx.fillStyle='rgba(255,255,255,'+(.25+s[2]*.35)+')';ctx.fillRect(s[0]*w,s[1]*h,s[2],s[2])});

}

function waveString(env){
  const {ui,ro}=env;const L=.65,MU=.0012;const p={n:1,T:80,comp:false,play:false};let t=0,osc=null,gain=null;

  ui.seg({label:'Harmonic n',options:[1,2,3,4,5,6].map(k=>({v:k,t:String(k)})),value:1,on:v=>{p.n=v;setTone()}});
  ui.slider({label:'String tension',min:20,max:200,step:1,value:p.T,unit:'N',on:v=>{p.T=v;setTone()}});
  ui.check({label:'Show the two traveling waves',value:false,on:v=>p.comp=v});
  const tb=ui.buttons([{t:'Play the note',primary:true,on:()=>{if(osc){stopTone();tb[0].textContent='Play the note';return}const ac=audio();if(!ac)return;osc=ac.createOscillator();gain=ac.createGain();osc.type='triangle';osc.frequency.value=f();gain.gain.value=0;osc.connect(gain).connect(ac.destination);osc.start();gain.gain.setTargetAtTime(.08,ac.currentTime,.03);tb[0].textContent='Stop the note'}}]);
  env.hint('A 65 cm guitar string. The animation is slowed so you can see it.');
  return{
    destroy:stopTone,
    step(dt){t+=dt},
    draw(ctx,w,h){paper(ctx,w,h,24);const x0=w*.07,x1=w*.93,yc=h*.42,A=h*.15,lam=2*L/p.n,wv=TAU*(.5+.15*p.n),k=p.n*Math.PI;
      ctx.fillStyle=C.wood;rr(ctx,x0-20,yc-34,x1-x0+40,68,10);ctx.fill();ctx.strokeStyle='rgba(0,0,0,.18)';for(let i=1;i<12;i++){const fx=x0+(x1-x0)*(1-Math.pow(2,-i/12*1.3))*.9;ctx.beginPath();ctx.moveTo(fx,yc-34);ctx.lineTo(fx,yc+34);ctx.stroke()}
      ctx.fillStyle=C.ink;ctx.fillRect(x0-8,yc-38,8,76);ctx.fillRect(x1,yc-38,8,76);
      const X=u=>x0+u*(x1-x0);
      if(p.comp){[[1,C.navy],[-1,C.green]].forEach(([dir,col])=>{ctx.strokeStyle=col;ctx.globalAlpha=.6;ctx.lineWidth=1.8;ctx.beginPath();for(let i=0;i<=300;i++){const u=i/300,y=A/2*Math.sin(k*u-dir*wv*t);i?ctx.lineTo(X(u),yc-y):ctx.moveTo(X(u),yc-y)}ctx.stroke();ctx.globalAlpha=1})}
      ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.setLineDash([3,4]);ctx.beginPath();for(let i=0;i<=300;i++){const u=i/300,y=A*Math.sin(k*u);i?ctx.lineTo(X(u),yc-y):ctx.moveTo(X(u),yc-y)}for(let i=0;i<=300;i++){const u=i/300,y=-A*Math.sin(k*u);i?ctx.lineTo(X(u),yc-y):ctx.moveTo(X(u),yc-y)}ctx.stroke();ctx.setLineDash([]);
      ctx.strokeStyle=C.accent;ctx.lineWidth=3.5;ctx.beginPath();for(let i=0;i<=300;i++){const u=i/300,y=A*Math.sin(k*u)*Math.cos(wv*t);i?ctx.lineTo(X(u),yc-y):ctx.moveTo(X(u),yc-y)}ctx.stroke();
      for(let j=0;j<=p.n;j++){const u=j/p.n;ctx.fillStyle=C.navy;ctx.beginPath();ctx.arc(X(u),yc,5,0,TAU);ctx.fill();txt(ctx,'N',X(u),yc+A+30,{align:'center',w:700,size:12,col:C.navy})}
      for(let j=0;j<p.n;j++){const u=(j+.5)/p.n;txt(ctx,'A',X(u),yc+A+30,{align:'center',w:700,size:12,col:C.accent})}
      const by=yc+A+52,lx=Math.min(lam/L,1);ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(X(0),by);ctx.lineTo(X(lx),by);ctx.moveTo(X(0),by-6);ctx.lineTo(X(0),by+6);ctx.moveTo(X(lx),by-6);ctx.lineTo(X(lx),by+6);ctx.stroke();

  }
}
function waveInterf(env){
  const {ui,ro}=env;const p={d:2,lam:.8,mode:'wave'};let t=0,lis={x:2.4,y:5.5},geo=null;const off=document.createElement('canvas'),oc=off.getContext('2d');
  ui.slider({label:'Speaker separation d',min:.4,max:5,step:.1,value:p.d,unit:'m',on:v=>p.d=v});
  ui.slider({label:'Wavelength λ',min:.3,max:2,step:.05,value:p.lam,unit:'m',show:v=>fmt(v,2)+' m ('+fmt(343/v,0)+' Hz)',on:v=>p.lam=v});
  ui.seg({label:'Show',options:[{v:'wave',t:'Moving waves'},{v:'loud',t:'Loudness map'}],value:'wave',on:v=>p.mode=v});
  env.hint('Click or tap anywhere to move the listener.');
  return{
    step(dt){t+=dt},
    draw(ctx,w,h){const WM=10,s=w/WM,HM=h/s,gw=170,gh=Math.max(40,Math.round(gw*h/w));if(off.width!==gw||off.height!==gh){off.width=gw;off.height=gh}
      const img=oc.createImageData(gw,gh),cA=hexRGB(C.navy),cB=hexRGB(C.surface),cW=hexRGB(C.accent);const sx1=WM/2-p.d/2,sx2=WM/2+p.d/2,sy=.6,k=TAU/p.lam,ph=TAU*1.2*t;geo={s};
      for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){const x=(i+.5)/gw*WM,y=(j+.5)/gh*HM,r1=Math.hypot(x-sx1,y-sy),r2=Math.hypot(x-sx2,y-sy);let val;
        if(p.mode==='wave'){val=(Math.cos(k*r1-ph)+Math.cos(k*r2-ph))/2;const q=(val+1)/2;const o=(j*gw+i)*4;img.data[o]=cB[0]+(cA[0]-cB[0])*q;img.data[o+1]=cB[1]+(cA[1]-cB[1])*q;img.data[o+2]=cB[2]+(cA[2]-cB[2])*q;img.data[o+3]=255}
        else{const I=Math.pow(Math.cos(k*(r1-r2)/2),2);const o=(j*gw+i)*4;img.data[o]=cB[0]+(cW[0]-cB[0])*I;img.data[o+1]=cB[1]+(cW[1]-cB[1])*I;img.data[o+2]=cB[2]+(cW[2]-cB[2])*I;img.data[o+3]=255}}
      oc.putImageData(img,0,0);ctx.imageSmoothingEnabled=true;ctx.drawImage(off,0,0,w,h);
      const spk=(xm)=>{const X=xm*s,Y=sy*s;ctx.fillStyle=C.ink;rr(ctx,X-16,Y-26,32,30,6);ctx.fill();ctx.fillStyle=C.muted;ctx.beginPath();ctx.arc(X,Y-11,8,0,TAU);ctx.fill()};spk(sx1);spk(sx2);
      const LX=lis.x*s,LY=lis.y*s;ctx.setLineDash([5,5]);ctx.lineWidth=1.6;ctx.strokeStyle=C.ink;ctx.beginPath();ctx.moveTo(sx1*s,sy*s);ctx.lineTo(LX,LY);ctx.moveTo(sx2*s,sy*s);ctx.lineTo(LX,LY);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=C.green;ctx.beginPath();ctx.arc(LX,LY,11,0,TAU);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(LX,LY,4,0,TAU);ctx.fill();
      const r1=Math.hypot(lis.x-sx1,lis.y-sy),r2=Math.hypot(lis.x-sx2,lis.y-sy),D=Math.abs(r1-r2),n=D/p.lam,fr=n-Math.floor(n);const loud=Math.pow(Math.cos(Math.PI*n),2);
      const kind=fr<.12||fr>.88?'Constructive: loud':Math.abs(fr-.5)<.12?'Destructive: quiet':'In between';
      rr(ctx,LX+16>w-210?LX-226:LX+16,LY-30,210,48,10);ctx.fillStyle=C.surface;ctx.fill();ctx.strokeStyle=C.line;ctx.stroke();const bx=LX+16>w-210?LX-214:LX+28;
      txt(ctx,'Δ = '+fmt(D,2)+' m = '+fmt(n,2)+' λ',bx,LY-10,{w:700,size:13});txt(ctx,kind,bx,LY+9,{size:12.5,w:700,col:kind[0]==='C'?C.green:kind[0]==='D'?C.warn:C.muted});
      ro.set('r1','Distance to left speaker',fmt(r1,2)+' m');ro.set('r2','Distance to right speaker',fmt(r2,2)+' m');ro.set('D','Path difference Δ',fmt(D,2)+' m');ro.set('n','Δ in wavelengths',fmt(n,2)+' λ');
      ro.set('L','Relative loudness',fmt(loud*100,0)+'%',loud>.8?'good':loud<.2?'bad':'');ro.set('f','Tone frequency f = v/λ',fmt(343/p.lam,0)+' Hz')},
    pointer(type,mx,my){if(type==='down'&&geo){lis={x:mx/geo.s,y:Math.max(.9,my/geo.s)}}}
  }
}
function waveDoppler(env){
  const {ui,ro,toast}=env;const VS=343;const p={M:.4,f:700};let t=0,xs=0,fronts=[],lastE=-1,booms=false;
  ui.slider({label:'Ambulance speed',min:0,max:1.6,step:.01,value:p.M,show:v=>fmt(v*VS,0)+' m/s (Mach '+fmt(v,2)+')',on:v=>{p.M=v;if(v>=1&&!booms){booms=true;toast('Faster than sound: a shock cone forms')}if(v<1)booms=false}});
  ui.slider({label:'Siren frequency',min:300,max:1200,step:10,value:p.f,unit:'Hz',on:v=>p.f=v});
  ui.buttons([{t:'Hear approach, then pass',primary:true,on:()=>{const ac=audio();if(!ac||p.M>=1)return;const now=ac.currentTime;[[p.f/(1-p.M),0],[p.f/(1+p.M),.75]].forEach(([fq,dt])=>{const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=fq;g.gain.setValueAtTime(0,now+dt);g.gain.linearRampToValueAtTime(.08,now+dt+.04);g.gain.setValueAtTime(.08,now+dt+.62);g.gain.linearRampToValueAtTime(0,now+dt+.7);o.connect(g).connect(ac.destination);o.start(now+dt);o.stop(now+dt+.75)})}}]);
  env.hint('Waves are drawn at a slowed-down scale. Speeds and pitches are real.');
  return{
    step(dt){t+=dt},
    draw(ctx,w,h){paper(ctx,w,h,24);const c=w*.17,xmin=w*.14,xmax=w*.82,gy=h*.62;xs=xmin+((t*p.M*c)%(xmax-xmin));
      if(xs<lastE){fronts=[]}if(t-(fronts.length?fronts[fronts.length-1].t:-1)>.16){fronts.push({x:xs,t})}lastE=xs;fronts=fronts.filter(f=>c*(t-f.t)<w*1.3);
      ctx.fillStyle=C.asphalt;ctx.fillRect(0,gy+18,w,h-gy-18);ctx.fillStyle='#F4D35E';for(let x=0;x<w;x+=50)ctx.fillRect(x,gy+38,26,4);
      ctx.strokeStyle=C.navy;ctx.lineWidth=1.6;fronts.forEach(f=>{const r=c*(t-f.t);ctx.globalAlpha=clamp(1-r/(w*1.1),0,1)*.8;ctx.beginPath();ctx.arc(f.x,gy,r,0,TAU);ctx.stroke()});ctx.globalAlpha=1;
      ctx.save();ctx.translate(xs,gy);ctx.fillStyle='#F4F6FA';ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;rr(ctx,-46,-30,80,32,6);ctx.fill();ctx.stroke();rr(ctx,30,-22,20,24,5);ctx.fill();ctx.stroke();ctx.fillStyle='#9CC6E0';ctx.fillRect(34,-18,12,9);
      ctx.fillStyle=C.warn;ctx.fillRect(-14,-24,8,20);ctx.fillRect(-20,-18,20,8);ctx.fillRect(-46,-12,80,4);ctx.fillStyle=Math.floor(t*6)%2?'#FF3B3B':'#3B7BFF';ctx.fillRect(-4,-36,14,6);wheel(ctx,-28,4,8,xs/8,'#20242c');wheel(ctx,28,4,8,xs/8,'#20242c');ctx.restore();
      const lf=w*.94,lb=w*.05;stick(ctx,lf,gy+16,62,C.green,null);stick(ctx,lb,gy+16,62,C.violet,null);
      const fF=p.M<1?p.f/(1-p.M):null,fB=p.f/(1+p.M);
      txt(ctx,'Ahead',lf,gy-62,{align:'center',w:700,size:12.5,col:C.green});txt(ctx,fF?fmt(fF,0)+' Hz':'silence',lf,gy-46,{align:'center',size:12,col:C.green});
      txt(ctx,'Behind',lb+6,gy-62,{align:'center',w:700,size:12.5,col:C.violet});txt(ctx,fmt(fB,0)+' Hz',lb+6,gy-46,{align:'center',size:12,col:C.violet});
      if(p.M>=1)txt(ctx,'Mach cone half-angle = '+fmt(Math.asin(1/p.M)/DEG,1)+'°',w/2,26,{align:'center',w:700,size:13.5,col:C.warn});
      ro.set('vs','Source speed',fmt(p.M*VS,0)+' m/s ('+fmt(p.M*VS*2.237,0)+' mph)');ro.set('f0','Siren frequency',fmt(p.f,0)+' Hz');
      ro.set('fF','Heard ahead f·v/(v − vₛ)',fF?fmt(fF,0)+' Hz':'arrives after the van');ro.set('fB','Heard behind f·v/(v + vₛ)',fmt(fB,0)+' Hz');
      ro.set('lF','Wavelength ahead',fF?fmt(VS/fF*100,1)+' cm':'—');ro.set('lB','Wavelength behind',fmt(VS/fB*100,1)+' cm')}
  }
}

 {id:'fluids',t:'Fluid Mechanics',nav:'Float or sink, and a garden hose',sub:'Density, pressure, buoyancy and Bernoulli’s equation',
  modes:[{t:'Will it float?',b:fluidBuoy},{t:'Garden hose nozzle',b:fluidBern}],
  intro:'A fluid pushes harder the deeper you go, so the bottom of a submerged object feels more push than its top. That difference is the buoyant force, equal to the weight of fluid displaced. When fluid flows, the same volume per second passes every point, so narrow sections run faster and their pressure drops.',
  eqs:['ρ = m/V','P = F/A','P = P₀ + ρgh','F_b = ρ_fluid V_sub g','A₁v₁ = A₂v₂','P + ½ρv² + ρgh = constant'],
  tries:['Predict how much of an ice cube sits under water, then test it.','Try the egg in fresh water, then in seawater. Explain.','Drop the apple into honey and then into oil.','Cut the nozzle area in half. What happens to speed and to pressure?'],
  quiz:{q:'A block of wood floats at rest. The buoyant force on it is:',o:['Greater than its weight','Equal to its weight','Less than its weight','Equal to the weight of the whole tank of water'],c:1,e:'Floating at rest means ΣF = 0, so buoyancy equals weight. It sinks just deep enough to displace its own weight in water.'}},
 {id:'shm',t:'Simple Harmonic Motion',nav:'Bouncing spring and a playground swing',sub:'Oscillations driven by a restoring force',
  modes:[{t:'Mass on a spring',b:shmSpring},{t:'Playground swing',b:shmSwing}],
  intro:'When the force pulling something back grows in step with how far it’s displaced, the motion repeats as a smooth sine wave. Energy sloshes back and forth between kinetic and potential. The period is set by the system itself: mass and stiffness for a spring, length and gravity for a pendulum.',
  eqs:['F = −kx','x(t) = A cos(ωt)','T = 2π√(m/k)','T ≈ 2π√(L/g)','E = ½kA²'],
  tries:['Double the amplitude. Does the period change?','Make the mass four times larger. What happens to the period?','Set the swing to 60° and compare the measured period with the formula.','Take the swing to the Moon. How much slower is it?'],
  quiz:{q:'If you quadruple the mass on a spring, the period:',o:['Stays the same','Doubles','Quadruples','Halves'],c:1,e:'T = 2π√(m/k). Four times the mass gives √4 = 2 times the period.'}},
 {id:'waves',t:'Mechanical Waves and Sound',nav:'Guitar string, speakers and a siren',sub:'Wavelength, frequency, interference, standing waves, Doppler',
  modes:[{t:'Guitar string',b:waveString},{t:'Two speakers',b:waveInterf},{t:'Ambulance siren',b:waveDoppler}],
  intro:'A wave carries energy through a medium while the medium itself only wiggles in place. Two waves in the same place add together: crest on crest gets louder, crest on trough cancels. A guitar string traps waves between two fixed ends, so only certain notes fit. A moving source squeezes its waves ahead and stretches them behind.',
  eqs:['v = fλ','v = √(T/μ)','fₙ = nv/2L','Loud: Δ = mλ','Quiet: Δ = (m + ½)λ','f′ = f · v/(v ∓ vₛ)'],
  tries:['Make the string tension four times larger. What happens to the pitch?','Turn on the traveling waves. How do two moving waves build one that stands still?','Find a quiet spot between the speakers. Is Δ a half wavelength?','Push the ambulance past Mach 1 and describe the wave pattern.'],
  quiz:{q:'An ambulance drives toward you. Compared with the siren’s true pitch, you hear:',o:['A higher pitch, because wavefronts bunch up ahead','A lower pitch, because the source is moving','The same pitch, only louder','A higher pitch only if it’s also accelerating'],c:0,e:'Each new wavefront is emitted closer to you than the last, so the wavelength reaching you is shorter and the frequency is higher.'}}
];

/* =====================================================================
   APP SHELL
   ===================================================================== */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),stage=document.getElementById('stage');
const modesBox=document.getElementById('modes'),ctrlBox=document.getElementById('controls'),roBox=document.getElementById('ro');
const toastEl=document.getElementById('toast'),hintEl=document.getElementById('hint');
let cur=null,curMod=null,toastTimer=0,dpr=1;
const ro=makeRO(roBox);
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200)}
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);const r=stage.getBoundingClientRect();cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr)}
new ResizeObserver(resize).observe(stage);

const nav=document.getElementById('units');
MODULES.forEach((m,i)=>{const b=el('button','unit');b.type='button';b.dataset.id=m.id;const n=el('span','n',String(i+1));const w=el('span');const t=el('span','t',m.t);const s=el('span','s',m.nav);w.append(t,s);b.append(n,w);b.onclick=()=>{location.hash=m.id};nav.appendChild(b)});

function buildMode(mi){if(cur&&cur.destroy)cur.destroy();ctrlBox.innerHTML='';ro.clear();hintEl.textContent='';toastEl.classList.remove('show');
  const env={ui:makeUI(ctrlBox),ro,toast,hint:t=>hintEl.textContent=t};cur=curMod.modes[mi].b(env);cv.setAttribute('aria-label',curMod.t+' simulator: '+curMod.modes[mi].t)}
function load(id){const m=MODULES.find(x=>x.id===id)||MODULES[0];curMod=m;
  nav.querySelectorAll('.unit').forEach(b=>{const on=b.dataset.id===m.id;b.setAttribute('aria-current',String(on));if(on&&window.innerWidth<=960)b.scrollIntoView({inline:'center',block:'nearest'})});
  document.getElementById('modTitle').textContent=m.t;document.getElementById('modSub').textContent=m.sub;document.title=m.t+' | Physics 101 Lab';
  modesBox.innerHTML='';if(m.modes.length>1){modesBox.appendChild(el('span','lbl','Scenario'));makeUI(modesBox).seg({options:m.modes.map((x,i)=>({v:i,t:x.t})),value:0,on:i=>buildMode(i)})}
  buildMode(0);
  document.getElementById('intro').textContent=m.intro;const eq=document.getElementById('eqs');eq.innerHTML='';m.eqs.forEach(e=>eq.appendChild(el('li',null,e)));
  const tr=document.getElementById('tries');tr.innerHTML='';m.tries.forEach(e=>tr.appendChild(el('li',null,e)));
  const qz=document.getElementById('quiz');qz.innerHTML='';qz.appendChild(el('div','q',m.quiz.q));const opts=el('div','opts');const fb=el('div','fb');
  m.quiz.o.forEach((o,i)=>{const b=el('button','opt',o);b.type='button';b.onclick=()=>{opts.querySelectorAll('.opt').forEach(x=>x.classList.remove('right','wrong'));const ok=i===m.quiz.c;b.classList.add(ok?'right':'wrong');if(!ok)opts.children[m.quiz.c].classList.add('right');fb.innerHTML='';const s=el('strong',null,ok?'Correct.':'Not quite. The highlighted answer is right.');s.style.color=ok?'var(--green)':'var(--warn)';fb.append(s,document.createTextNode(m.quiz.e))};opts.appendChild(b)});
  qz.append(opts,fb)}

function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.addEventListener('pointerdown',e=>{if(cur&&cur.pointer){cv.setPointerCapture(e.pointerId);cur.pointer('down',...pos(e))}});
cv.addEventListener('pointermove',e=>{if(cur&&cur.pointer)cur.pointer('move',...pos(e))});
cv.addEventListener('pointerup',e=>{if(cur&&cur.pointer)cur.pointer('up',...pos(e))});
cv.addEventListener('pointercancel',e=>{if(cur&&cur.pointer)cur.pointer('up',...pos(e))});

let last=0;function loop(ts){const dt=Math.min(.05,last?(ts-last)/1000:0);last=ts;if(cur&&!document.hidden){try{cur.step&&cur.step(dt);const w=cv.width/dpr,h=cv.height/dpr;if(w>0&&h>0){ctx.setTransform(dpr,0,0,dpr,0,0);cur.draw(ctx,w,h)}}catch(err){console.error(err)}}requestAnimationFrame(loop)}

/* theme */
const tbtn=document.getElementById('themeBtn');
function syncTheme(){const d=document.documentElement.getAttribute('data-theme')==='dark';tbtn.setAttribute('aria-pressed',String(d));tbtn.querySelector('span').textContent=d?'Light mode':'Dark mode';readColors()}
tbtn.onclick=()=>{const d=document.documentElement.getAttribute('data-theme')!=='dark';document.documentElement.setAttribute('data-theme',d?'dark':'light');try{localStorage.setItem('p101-theme',d?'dark':'light')}catch(e){}syncTheme()};

window.addEventListener('hashchange',()=>load(location.hash.slice(1)));
syncTheme();load(location.hash.slice(1));resize();requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>readColors());
})();
</script>
</body>
