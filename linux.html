<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linux Command Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surface-2:#E8EEF7; --ink:#13223F; --muted:#56678A; --line:#D2DBE9;
  --navy:#0047AB; --navy-soft:#DCE7F8; --green:#00875A; --green-bright:#00a86b; --green-soft:#DDF4EA;
  --amber:#9A5B00; --amber-soft:#FFF2DB;
  --term-bg:#0C1A2E; --term-bar:#13263F; --term-ink:#D6E1F0; --term-dim:#7F94B3;
  --t-green:#3DDC97; --t-blue:#7DB2FF; --t-red:#FF8080; --t-amber:#F4B860; --t-cyan:#7FD8E6;
  --ui:'Atkinson Hyperlegible', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08121F; --surface:#0F1D31; --surface-2:#16294A; --ink:#E3EBF7; --muted:#9DAEC9; --line:#223658;
    --navy:#6EA6FF; --navy-soft:#16294A; --green:#33D196; --green-bright:#33D196; --green-soft:#0F2E26;
    --amber:#F4B860; --amber-soft:#2B2312; --term-bg:#060F1C; --term-bar:#0D1C31; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08121F; --surface:#0F1D31; --surface-2:#16294A; --ink:#E3EBF7; --muted:#9DAEC9; --line:#223658;
  --navy:#6EA6FF; --navy-soft:#16294A; --green:#33D196; --green-bright:#33D196; --green-soft:#0F2E26;
  --amber:#F4B860; --amber-soft:#2B2312; --term-bg:#060F1C; --term-bar:#0D1C31; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--ui);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;min-height:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px;border-radius:6px}
kbd{font-family:var(--mono);font-size:.82em;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:var(--surface-2)}

/* Header */
.top{max-width:1440px;margin:0 auto;padding:22px 20px 18px;display:flex;flex-wrap:wrap;align-items:center;gap:16px 28px}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto}
.glyph{width:46px;height:46px;border-radius:12px;background:var(--navy);display:grid;place-items:center;flex:none}
.glyph svg{width:28px;height:28px}
.brand h1{font-size:1.45rem;line-height:1.15;letter-spacing:-.01em}
.brand p{color:var(--muted);font-size:.95rem}
.modes{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.modes button{padding:7px 16px;border-radius:999px;font-weight:700;font-size:.92rem;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--surface);color:var(--navy);box-shadow:0 1px 3px rgba(10,30,70,.15)}
.stats{display:flex;align-items:center;gap:18px}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat b{font-size:1.25rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.stat-ring{display:flex;align-items:center;gap:10px}
.ring-bg{stroke:var(--surface-2)}
.ring-fg{stroke:var(--green-bright);transition:stroke-dashoffset .5s ease}
.ring-txt{fill:var(--ink);font-family:var(--ui);font-weight:700}
.theme-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.theme-btn svg{width:20px;height:20px}

/* Layout */
.layout{max-width:1440px;margin:0 auto;padding:0 20px 32px;display:grid;gap:20px;
  grid-template-columns:minmax(250px,290px) minmax(0,1fr) minmax(250px,300px);
  grid-template-areas:"left term map";align-items:start}
.left{grid-area:left}.term-wrap{grid-area:term}.map{grid-area:map}
@media (max-width:1120px){.layout{grid-template-columns:minmax(0,1fr) 280px;grid-template-areas:"term map" "left left"}}
@media (max-width:760px){.layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"term" "map" "left"}.stats{gap:14px}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:1.05rem;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:.88rem;margin-bottom:14px}

/* Terminal */
.term-wrap{position:relative;background:var(--term-bg);border-radius:16px;overflow:hidden;box-shadow:0 18px 40px -18px rgba(5,25,60,.55);border:1px solid #1E3352}
.term-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--term-bar);border-bottom:1px solid #1E3352;color:var(--term-dim);font-family:var(--mono);font-size:.82rem}
.term-bar .title{margin-right:auto;color:var(--term-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term-bar .title i{font-style:normal;color:var(--t-green)}
.bar-btn{font-family:var(--ui);font-size:.8rem;color:var(--term-ink);padding:5px 10px;border-radius:7px;border:1px solid #2A4366}
.bar-btn:hover{background:#1A3050}
.screen{height:min(60vh,560px);min-height:340px;overflow-y:auto;padding:16px 18px 8px;font-family:var(--mono);font-size:14px;line-height:1.55;color:var(--term-ink)}
.ln{white-space:pre-wrap;word-break:break-word;min-height:1.55em}
.ln.err{color:var(--t-red)}.ln.ok{color:var(--t-green)}.ln.info{color:var(--t-blue)}.ln.warn{color:var(--t-amber)}
.ln.note{color:var(--term-dim);font-style:italic}
.ln.celebrate{color:var(--t-green);font-weight:600}
.pu{color:var(--t-green);font-weight:600}.pp{color:var(--t-blue);font-weight:600}.cmd{color:#fff}
.d{color:var(--t-blue);font-weight:600}.f{color:var(--term-ink)}.h{color:var(--term-dim)}.dim{color:var(--term-dim)}
.hl{background:rgba(244,184,96,.28);color:#FFE2B0;border-radius:3px}
.inrow{display:flex;align-items:center;gap:8px;padding:10px 18px 12px;font-family:var(--mono);font-size:14px;border-top:1px dashed #1E3352}
.inrow .prompt{white-space:nowrap}
#cmd{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font:inherit;caret-color:var(--t-green);font-size:16px}
#cmd:focus-visible{outline:none}
.inrow:focus-within{background:rgba(61,220,151,.05)}

/* Command anatomy */
.anatomy{background:#0A1626;border-top:1px solid #1E3352;padding:10px 18px 12px;min-height:66px;display:flex;flex-direction:column;gap:6px}
.toks{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:flex-start}
.tok{display:flex;flex-direction:column;align-items:center;gap:1px}
.tok b{font-family:var(--mono);font-weight:600;font-size:.86rem;padding:2px 8px;border-radius:6px;border:1px solid}
.tok small{font-size:.7rem;color:var(--term-dim)}
.k-cmd b{color:var(--t-green);border-color:rgba(61,220,151,.45);background:rgba(61,220,151,.1)}
.k-flag b{color:var(--t-amber);border-color:rgba(244,184,96,.45);background:rgba(244,184,96,.08)}
.k-arg b{color:var(--t-blue);border-color:rgba(125,178,255,.4);background:rgba(125,178,255,.08)}
.k-op b{color:var(--t-cyan);border-color:rgba(127,216,230,.45);background:rgba(127,216,230,.08)}
.k-bad b{color:var(--t-red);border-color:rgba(255,128,128,.5);background:rgba(255,128,128,.08)}
.ana-desc{font-size:.84rem;color:var(--term-ink)}
.ana-desc em{font-style:normal;font-family:var(--mono);color:var(--term-dim)}
.ana-tip{font-size:.84rem;color:var(--term-dim)}
.ana-tip kbd{background:#13263F;border-color:#2A4366;color:var(--term-ink)}

/* nano */
.nano{position:absolute;inset:0;background:var(--term-bg);display:flex;flex-direction:column;font-family:var(--mono);font-size:14px;z-index:5}
.nano[hidden]{display:none}
.nano-bar{display:flex;justify-content:space-between;gap:10px;background:#D6E1F0;color:#0C1A2E;padding:4px 12px;font-weight:600}
.nano textarea{flex:1;resize:none;background:transparent;border:0;outline:0;color:var(--term-ink);font:inherit;padding:12px 16px;line-height:1.55}
.nano-msg{min-height:1.6em;text-align:center;color:var(--t-amber);padding:2px 12px}
.nano-keys{display:flex;flex-wrap:wrap;gap:8px 18px;padding:8px 12px 12px;border-top:1px solid #1E3352}
.nano-keys button{color:var(--term-ink);font-family:var(--mono);font-size:.85rem;display:flex;gap:6px;align-items:center;padding:3px 6px;border-radius:6px}
.nano-keys button:hover{background:#13263F}
.nano-keys kbd{background:#D6E1F0;color:#0C1A2E;border:0;font-weight:600}

/* Lesson path */
.rail{list-style:none;position:relative;display:flex;flex-direction:column;gap:4px;margin-bottom:16px}
.rail::before{content:"";position:absolute;left:21px;top:22px;bottom:22px;width:2px;background:var(--line)}
.station{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:6px 8px 6px 0;border-radius:10px}
.station:hover{background:var(--surface-2)}
.station[aria-current="step"]{background:var(--navy-soft)}
.station .ringwrap{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;background:var(--surface);border-radius:50%}
.station[aria-current="step"] .ringwrap{background:var(--navy-soft)}
.station .ringwrap svg{position:absolute;inset:0}
.station .num{font-weight:700;font-size:.95rem;position:relative}
.station.done .num{color:var(--green)}
.station .meta{display:flex;flex-direction:column;line-height:1.25}
.station .meta strong{font-size:.95rem}
.station .meta span{font-size:.8rem;color:var(--muted)}
.detail{border-top:1px solid var(--line);padding-top:16px}
.detail h3{font-size:1.1rem;margin-bottom:6px;color:var(--navy)}
.detail p.obj{font-size:.92rem;color:var(--ink);margin-bottom:14px}
.detail h4{font-size:.85rem;color:var(--muted);margin:12px 0 6px;font-weight:700}
.checks{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.checks li{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.85rem;padding:3px 10px 3px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.checks li svg{width:16px;height:16px}
.checks li.yes{border-color:var(--green-bright);background:var(--green-soft);color:var(--green);font-weight:600}
.try{display:flex;flex-direction:column;gap:4px}
.try button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:6px 10px;border-radius:8px;border:1px solid transparent}
.try button:hover{background:var(--surface-2);border-color:var(--line)}
.try code{font-family:var(--mono);font-size:.86rem;color:var(--navy);font-weight:600}
.try span{font-size:.8rem;color:var(--muted)}
.hint{margin-top:14px;background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:.88rem;display:flex;gap:8px}
.hint svg{flex:none;width:18px;height:18px;margin-top:2px}
.done-box{margin-top:14px;background:var(--green-soft);color:var(--green);border-radius:10px;padding:12px;font-size:.92rem;font-weight:700}
.done-box button{display:block;margin-top:8px;background:var(--green);color:#fff;padding:8px 14px;border-radius:8px;font-weight:700;font-size:.9rem}
:root[data-theme="dark"] .done-box button{color:#06231A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .done-box button{color:#06231A}}
.link-btn{font-size:.82rem;color:var(--muted);text-decoration:underline;margin-top:14px}

/* Reference */
.ref h3{font-size:.85rem;color:var(--muted);margin:14px 0 6px}
.ref h3:first-of-type{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-family:var(--mono);font-size:.84rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chips button:hover{border-color:var(--navy);color:var(--navy)}

/* Map */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:12px;font-family:var(--mono);font-size:.82rem}
.crumbs button{padding:2px 8px;border-radius:6px;background:var(--surface-2)}
.crumbs button:last-child{background:var(--green-soft);color:var(--green);font-weight:600}
.crumbs .sep{color:var(--muted)}
.tree,.tree ul{list-style:none}
.tree ul{margin-left:11px;padding-left:8px;border-left:1px dashed var(--line)}
.row{display:flex;align-items:center;gap:4px;padding:2px 4px;border-radius:7px;font-family:var(--mono);font-size:.86rem}
.row .caret{width:18px;height:18px;display:grid;place-items:center;border-radius:4px;color:var(--muted);flex:none}
.row .caret svg{width:12px;height:12px;transition:transform .15s}
.row .caret[aria-expanded="true"] svg{transform:rotate(90deg)}
.row .spacer{width:18px;flex:none}
.row .ico{width:17px;height:17px;flex:none;display:grid}
.row.dir .ico{color:var(--navy)}
.row.file .ico{color:var(--muted)}
.row .nm{padding:1px 4px;border-radius:4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.dir .nm{font-weight:600;color:var(--navy)}
.row.hidden{opacity:.6}
.row .nm:hover{text-decoration:underline}
.row.here{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green-bright)}
.row.here .nm,.row.here .ico{color:var(--green)}
.badge{margin-left:auto;font-family:var(--ui);font-size:.72rem;font-weight:700;color:var(--green);white-space:nowrap;padding-left:6px}
.row.fresh{animation:fresh 1.8s ease-out}
@keyframes fresh{0%{background:rgba(0,168,107,.38)}100%{background:transparent}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.map-count{font-size:.82rem;color:var(--muted);margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="glyph" aria-hidden="true"><svg viewBox="0 0 28 28" fill="none"><path d="M6 9l5 5-5 5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 19h8" stroke="#00d68a" stroke-width="2.6" stroke-linecap="round"/></svg></div>
    <div><h1>Linux command simulator</h1><p>Type real commands and watch the filesystem respond.</p></div>
  </div>
  <div class="modes" role="tablist" aria-label="Mode">
    <button role="tab" id="tab-lessons" data-mode="lessons">Guided lessons</button>
    <button role="tab" id="tab-practice" data-mode="practice">Free practice</button>
  </div>
  <div class="stats">
    <div class="stat-ring"><span id="lessonRing"></span><div class="stat"><b id="statLessons">0/6</b><span>Lessons</span></div></div>
    <div class="stat"><b id="statCmds">0</b><span>Commands run</span></div>
    <div class="stat"><b id="statAcc">–</b><span>Ran cleanly</span></div>
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="Switch color theme"></button>
</header>

<main class="layout">
  <aside class="left panel" id="left" aria-label="Lessons and reference"></aside>

  <section class="term-wrap" aria-label="Terminal">
    <div class="term-bar">
      <span class="title" id="termTitle"></span>
      <button class="bar-btn" id="btnClear">Clear screen</button>
      <button class="bar-btn" id="btnReset">Reset files</button>
    </div>
    <div class="screen" id="screen" role="log" aria-live="polite"></div>
    <label class="inrow" for="cmd">
      <span class="prompt" id="prompt"></span>
      <span class="sr">Command</span>
      <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <div class="anatomy" id="anatomy" aria-live="off"></div>

    <div class="nano" id="nano" hidden>
      <div class="nano-bar"><span>GNU nano 7.2</span><span id="nanoName"></span><span id="nanoState"></span></div>
      <textarea id="nanoText" spellcheck="false" aria-label="File contents"></textarea>
      <div class="nano-msg" id="nanoMsg" role="status"></div>
      <div class="nano-keys">
        <button id="nanoSave"><kbd>^O</kbd> Write out</button>
        <button id="nanoExit"><kbd>^X</kbd> Exit</button>
      </div>
    </div>
  </section>

  <aside class="map panel" aria-label="Filesystem map">
    <h2>Filesystem map</h2>
    <p class="sub">Click a name to put a command in the prompt.</p>
    <nav class="crumbs" id="crumbs" aria-label="Current path"></nav>
    <ul class="tree" id="tree" role="tree"></ul>
    <p class="map-count" id="mapCount"></p>
    <div class="legend">
      <span><i class="sw" style="background:var(--navy)"></i>Folder</span>
      <span><i class="sw" style="border:1.5px solid var(--muted)"></i>File</span>
      <span><i class="sw" style="background:var(--green-bright)"></i>You are here</span>
      <span><i class="sw" style="background:rgba(0,168,107,.35)"></i>Just changed</span>
    </div>
  </aside>
</main>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ---------- Icons ---------- */
const ICON={
  folder:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h4l2 2h7A1.5 1.5 0 0 1 18 7.5v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 2 14.5z" fill="currentColor"/></svg>',
  file:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h6.5L16 7v10.5H5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M11.5 2.5V7H16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  caret:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check:'<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M4.8 8.2l2.1 2.1 4.3-4.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  dot:'<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',
  bulb:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2a6 6 0 0 0-3.5 10.9V15h7v-2.1A6 6 0 0 0 10 2zM7.5 17h5v1h-5z" fill="currentColor"/></svg>',
  sun:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>',
  moon:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="currentColor"/></svg>'
};
function ring(frac,size,stroke,inner){
  const r=(size-stroke)/2,c=2*Math.PI*r,h=size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="ring-bg" cx="${h}" cy="${h}" r="${r}" fill="none" stroke-width="${stroke}"/><circle class="ring-fg" cx="${h}" cy="${h}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-frac)).toFixed(2)}" transform="rotate(-90 ${h} ${h})"/>${inner||''}</svg>`;
}

/* ---------- Virtual filesystem ---------- */
const HOME='/home/user';
const D=(c={})=>({type:'dir',children:c});
const F=(t='')=>({type:'file',content:t});
function seed(){return D({
  home:D({user:D({
    '.bashrc':F('# Bash configuration file\nexport PATH=$PATH:/usr/local/bin\nalias ll="ls -la"\nalias la="ls -A"'),

  L(`Tasks: ${procs.length} total,   1 running, ${procs.length-1} sleeping,   0 stopped,   0 zombie`),

C.kill=args=>{
  const ids=args.filter(x=>!x.startsWith('-'));
  if(!ids.length)return[E('kill: usage: kill [-s sigspec | -n signum | -sigspec] pid')];
  const out=[];
  ids.forEach(x=>{const pid=parseInt(x,10),i=procs.findIndex(p=>p.pid===pid);
    if(pid===1)out.push(E('kill: (1) - Operation not permitted'));
    else if(i<0)out.push(E(`kill: (${x}) - No such process`));
    else{const name=procs[i].name;procs.splice(i,1);out.push(L(`Stopped ${name} (PID ${pid}). Run ps aux to confirm it is gone.`,'note'))}});
  return out;
};
C.ping=args=>{
  let c=4;const rest=[];for(let i=0;i<args.length;i++){if(args[i]==='-c')c=Math.min(10,parseInt(args[++i],10)||4);else rest.push(args[i])}
  const host=rest[0];if(!host)return[E('ping: usage error: Destination address required')];
  const ip=fakeIP(host),out=[L(`PING ${host} (${ip}) 56(84) bytes of data.`,'info')];const times=[];
  for(let i=1;i<=c;i++){const t=(12+((i*7+host.length*3)%9)+Math.random()).toFixed(1);times.push(+t);out.push(L(`64 bytes from ${ip}: icmp_seq=${i} ttl=56 time=${t} ms`))}
  out.push(L(''),L(`--- ${host} ping statistics ---`,'info'),L(`${c} packets transmitted, ${c} received, 0% packet loss`,'ok'),
    L(`rtt min/avg/max = ${Math.min(...times).toFixed(1)}/${(times.reduce((a,b)=>a+b,0)/c).toFixed(1)}/${Math.max(...times).toFixed(1)} ms`),
    N('Simulated: this sandbox has no real network.'));
  return out;
};
function hostOf(u){try{return new URL(u.includes('://')?u:'http://'+u).hostname}catch(e){return u}}
C.wget=args=>{
  const url=args.find(x=>!x.startsWith('-'));if(!url)return[E('wget: missing URL')];
  const host=hostOf(url);let name=url.replace(/\/+$/,'').split('/').pop();if(!name||name===host||name.includes(':'))name='index.html';
  let p=norm(name),k=1;while(getNode(p))p=norm(name+'.'+k++);
  const body=`Downloaded from ${url}\n`;putNode(p,F(body));
  return[L(`--2026-11-14 10:30:12--  ${url}`,'info'),L(`Resolving ${host}... ${fakeIP(host)}`),L(`Connecting to ${host}|${fakeIP(host)}|:80... connected.`),
    L('HTTP request sent, awaiting response... 200 OK','ok'),L(`Length: ${body.length} [text/plain]`),L(`Saving to: '${baseName(p)}'`),L(''),
    L(`'${baseName(p)}' saved [${body.length}/${body.length}]`,'ok'),N('Simulated download. Look for the new file on the map.')];
};
C.curl=args=>{
  const{f,a}=fa(args),url=a[0];if(!url)return[E("curl: try 'curl --help' for more information")];
  if(f.has('I'))return[L('HTTP/1.1 200 OK'),L('Content-Type: text/html; charset=UTF-8'),L('Content-Length: 1256'),L('Server: ECS (simulated)')];
  return[L('<!doctype html>'),L('<html>'),L('<head><title>Example Domain</title></head>'),L('<body>'),L('  <h1>Example Domain</h1>'),L('  <p>This domain is for use in illustrative examples.</p>'),L('</body>'),L('</html>'),N('Simulated response.')];
};
C.ssh=args=>{const d=args.find(x=>!x.startsWith('-'));if(!d)return[E('usage: ssh [-p port] destination [command]')];
  return[E(`ssh: connect to host ${d.split('@').pop()} port 22: Connection timed out`),N('In a real network this would open an encrypted shell on the remote machine.')]};
C.scp=args=>{const a=args.filter(x=>!x.startsWith('-'));if(a.length<2)return[E('usage: scp [-r] source target')];
  const n=getNode(norm(a[0]));if(!n)return[E(`scp: ${a[0]}: No such file or directory`)];
  return[L(`${baseName(norm(a[0])).padEnd(30)}100%  ${String(n.type==='file'?n.content.length:4096).padStart(5)}   12.4KB/s   00:00`,'ok'),N('Simulated: no file actually left this machine.')]};
C.netstat=args=>{const all=args.some(x=>/a/.test(x));return all?[
  L('Active Internet connections (servers and established)','info'),L('Proto Recv-Q Send-Q Local Address           Foreign Address         State','info'),
  L('tcp        0      0 0.0.0.0:22              0.0.0.0:*               LISTEN'),L('tcp        0      0 127.0.0.1:631           0.0.0.0:*               LISTEN'),
  L('tcp        0      0 192.168.1.100:51234     93.184.215.14:443       ESTABLISHED'),L('udp        0      0 0.0.0.0:68              0.0.0.0:*'),L('udp        0      0 127.0.0.53:53           0.0.0.0:*')]:[
  L('Active Internet connections (w/o servers)','info'),L('Proto Recv-Q Send-Q Local Address           Foreign Address         State','info'),
  L('tcp        0      0 192.168.1.100:51234     93.184.215.14:443       ESTABLISHED')]};
C.man=args=>{const c=args[0];if(!c)return[E('What manual page do you want?')];const info=CMD[c];
  if(!info)return[E(`No manual entry for ${c}`)];
  return[L(`${c.toUpperCase()}(1)                 User Commands                 ${c.toUpperCase()}(1)`,'info'),L(''),

/* ---------- Terminal I/O ---------- */
const screen=$('#screen'),input=$('#cmd');
function print(lines){
  lines.forEach(l=>{
    if(l.clear){screen.innerHTML='';return}
    const div=document.createElement('div');div.className='ln '+(l.c||'');
    if(l.parts)l.parts.forEach(p=>{const s=document.createElement('span');if(p.c)s.className=p.c;s.textContent=p.t;div.appendChild(s)});
    else div.textContent=l.t||'';
    screen.appendChild(div);
  });
  screen.scrollTop=screen.scrollHeight;
}
const promptParts=()=>[{t:'user@simulator',c:'pu'},{t:':'},{t:disp(cwd),c:'pp'},{t:'$ '}];

function tokenize(line){
  const re=/"((?:[^"\\]|\\.)*)"|'([^']*)'|(>>|>|\|)|([^\s"'|>]+)/g,out=[];let m;
  while((m=re.exec(line))){
    if(m[3])out.push({v:m[3],op:m[3]});
    else if(m[2]!==undefined)out.push({v:m[2],q:1});
    else out.push({v:(m[1]!==undefined?m[1]:m[4]).replace(/\$(HOME|USER|PWD)\b/g,(_,k)=>({HOME,USER:'user',PWD:cwd})[k]),q:m[1]!==undefined?1:0});
  }
  return out;
}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function suggest(n){let best=null,bd=3;Object.keys(C).forEach(k=>{const d=lev(n,k);if(d<bd){bd=d;best=k}});return best}

function run(raw){
  const line=raw.trim();
  print([{parts:[...promptParts(),{t:raw,c:'cmd'}]}]);
  if(!line)return;
  hist.push(line);hIdx=hist.length;
  const toks=tokenize(line),segs=[[]];let redir=null;
  for(let i=0;i<toks.length;i++){const t=toks[i];
    if(t.op==='|'){segs.push([]);continue}
    if(t.op==='>'||t.op==='>>'){const nx=toks[i+1];redir={mode:t.op,file:nx&&!nx.op?nx.v:null};i++;continue}
    segs[segs.length-1].push(t.v)}
  stats.cmds++;
  if(redir&&!redir.file){print([E("bash: syntax error near unexpected token `newline'")]);return finish(false,[])}
  if(segs.some(s=>!s.length)){print([E("bash: syntax error near unexpected token `|'")]);return finish(false,[])}
  let ok=true,stdin=null,final=[];const used=[];
  for(let si=0;si<segs.length;si++){
    let[name,...args]=segs[si];
    if(ALIAS[name]){const al=ALIAS[name].split(' ');name=al[0];args=[...al.slice(1),...args]}
    const fn=C[name];
    if(!fn){final.push(E(`${name}: command not found`));const s=suggest(name);if(s)final.push(N(`Did you mean ${s}?`));ok=false;break}
    const res=fn(args,stdin)||[];
    if(res.some(l=>l.c==='err'))ok=false;else used.push(name);
    if(si<segs.length-1){final.push(...res.filter(l=>l.c==='err'));stdin=textOf(res)}else final=final.concat(res);
  }
  if(redir){
    const errs=final.filter(l=>l.c==='err'||l.c==='note'),p=norm(redir.file),n=getNode(p);
    if(n&&n.type==='dir'){errs.push(E(`bash: ${redir.file}: Is a directory`));ok=false}
    else if(!getNode(parentPath(p))){errs.push(E(`bash: ${redir.file}: No such file or directory`));ok=false}
    else{const text=textOf(final);const body=text?text+'\n':'';
      if(redir.mode==='>>'&&n){if(n.content&&!n.content.endsWith('\n'))n.content+='\n';n.content+=body;recent.add(p)}else putNode(p,F(body))}
    final=errs;
  }
  print(final);
  finish(ok,used);
  if(pendingNano){const p=pendingNano;pendingNano=null;openNano(p)}
}
function finish(ok,used){
  if(ok)stats.ok++;store.set('lcs-stats',stats);
  if(mode==='lessons'&&active>=0){
    const L_=LESSONS[active],was=lessonDone(active);let changed=false;
    used.forEach(u=>{if(L_.required.includes(u)&&!prog[active].includes(u)){prog[active].push(u);changed=true}});
    if(changed){store.set('lcs-progress',prog);
      if(!was&&lessonDone(active))print([L(''),L(`Lesson ${active+1} complete. Every required command ran cleanly.`,'celebrate'),L('')]);}
  }
  renderAll();
}

  if(lessonDone(active)){
    const box=document.createElement('div');box.className='done-box';
    if(active<LESSONS.length-1){box.textContent='Lesson complete.';const nb=document.createElement('button');nb.textContent=`Start lesson ${active+2}: ${LESSONS[active+1].title}`;
      nb.onclick=()=>{active++;store.set('lcs-active',active);renderLeft();print([L(''),L(`Lesson ${active+1}: ${LESSONS[active].title}`,'info'),L(LESSONS[active].objective,'note'),L('')]);input.focus()};box.appendChild(nb)}
    else box.textContent=LESSONS.every((_,i)=>lessonDone(i))?'You’ve finished all six lessons. Switch to free practice and explore.':'Lesson complete. Pick any unfinished lesson above.';
    d.appendChild(box);

function renderMap(){
  let p=cwd;for(;;){expanded.add(p);if(p==='/')break;p=parentPath(p)}
  const tree=$('#tree');tree.innerHTML='';tree.appendChild(buildNode('/',root));
  const cr=$('#crumbs');cr.innerHTML='';
  const segs=cwd==='/'?['']:cwd.split('/');let acc='';
  segs.forEach((s,i)=>{acc=i===0?'/':join(acc,s);const target=acc;
    if(i>1){const sp=document.createElement('span');sp.className='sep';sp.textContent='/';cr.appendChild(sp)}
    const b=document.createElement('button');b.textContent=i===0?'/':s;b.onclick=()=>insert('cd '+disp(target));cr.appendChild(b)});
  let dirs=0,files=0;(function c(n){for(const k in n.children){if(n.children[k].type==='dir'){dirs++;c(n.children[k])}else files++}})(getNode(HOME));
  $('#mapCount').textContent=`Your home folder holds ${dirs} folder${dirs===1?'':'s'} and ${files} file${files===1?'':'s'}.`;
  recent.clear();
}
function buildNode(path,node){
  const li=document.createElement('li');li.setAttribute('role','treeitem');
  const name=path==='/'?'/':baseName(path),isDir=node.type==='dir',kids=isDir?Object.keys(node.children):[];
  const row=document.createElement('div');
  row.className='row '+(isDir?'dir':'file')+(name.startsWith('.')?' hidden':'')+(path===cwd?' here':'')+(recent.has(path)?' fresh':'');
  if(isDir&&kids.length){const cb=document.createElement('button');cb.className='caret';cb.innerHTML=ICON.caret;
    cb.setAttribute('aria-expanded',expanded.has(path));cb.setAttribute('aria-label',(expanded.has(path)?'Collapse ':'Expand ')+name);
    cb.onclick=()=>{expanded.has(path)?expanded.delete(path):expanded.add(path);renderMap()};row.appendChild(cb)}
  else{const s=document.createElement('span');s.className='spacer';row.appendChild(s)}
  const ic=document.createElement('span');ic.className='ico';ic.innerHTML=isDir?ICON.folder:ICON.file;row.appendChild(ic);
  const nb=document.createElement('button');nb.className='nm';nb.textContent=name;
  const cmd=(isDir?'cd ':'cat ')+disp(path);nb.title='Put “'+cmd+'” in the prompt';nb.onclick=()=>insert(cmd);row.appendChild(nb);
  if(path===cwd){const b=document.createElement('span');b.className='badge';b.textContent='You are here';row.appendChild(b)}
  li.appendChild(row);
  if(isDir&&kids.length&&expanded.has(path)){
    li.setAttribute('aria-expanded','true');
    const ul=document.createElement('ul');ul.setAttribute('role','group');
    kids.sort((a,b)=>{const da=node.children[a].type==='dir',db=node.children[b].type==='dir';return da!==db?(da?-1:1):a.replace(/^\./,'').localeCompare(b.replace(/^\./,''))})
      .forEach(k=>ul.appendChild(buildNode(join(path,k),node.children[k])));
    li.appendChild(ul);
  }
  return li;
}

const KIND={cmd:'command',flag:'option',arg:'argument',op:'operator',bad:'unknown'};
function renderAnatomy(){
  const box=$('#anatomy'),v=input.value;box.innerHTML='';
  if(!v.trim()){box.innerHTML='<span class="ana-tip">Press <kbd>Tab</kbd> to finish a file or command name. Press <kbd>↑</kbd> or <kbd>↓</kbd> to bring back earlier commands.</span>';return}
  const toks=tokenize(v),row=document.createElement('div');row.className='toks';
  let expect=true,first=null,afterRedir=false;
  toks.forEach(t=>{let k;
    if(t.op){k='op';expect=t.op==='|';afterRedir=t.op!=='|'}
    else if(expect){k=(C[t.v]||ALIAS[t.v])?'cmd':'bad';expect=false;if(!first)first=t.v}
    else if(!t.q&&/^-\S/.test(t.v))k='flag';else k='arg';
    const el=document.createElement('span');el.className='tok k-'+k;el.innerHTML='<b></b><small></small>';
    el.querySelector('b').textContent=t.op?t.v:(t.q?`"${t.v}"`:t.v);
    el.querySelector('small').textContent=k==='op'?(t.op==='|'?'pipe':'redirect'):(afterRedir&&k==='arg'?'target file':KIND[k]);
    if(k==='arg'&&afterRedir)afterRedir=false;
    row.appendChild(el)});
  box.appendChild(row);
  const desc=document.createElement('div');desc.className='ana-desc';
  const key=ALIAS[first]?ALIAS[first].split(' ')[0]:first;
  if(key&&CMD[key]){desc.textContent=CMD[key][2]+'. ';const em=document.createElement('em');em.textContent='Usage: '+CMD[key][1];desc.appendChild(em)}
  else if(first){desc.textContent=`“${first}” isn’t a command this simulator knows. Run help for the full list.`}
  box.appendChild(desc);
}
function renderTabs(){
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===mode));
}
function renderAll(){renderPrompt();renderStats();renderLeft();renderMap();renderTabs();renderAnatomy()}

/* ---------- Tab completion ---------- */
function complete(){
  const v=input.value,partial=(v.match(/(\S*)$/)||['',''])[1],before=v.slice(0,v.length-partial.length);
  const isCmd=!before.trim()||/\|\s*$/.test(before);let cands=[];
  if(isCmd)cands=Object.keys(C).filter(c=>c.startsWith(partial));
  else{const sl=partial.lastIndexOf('/'),dirPart=sl>=0?partial.slice(0,sl+1):'',pre=partial.slice(sl+1),dir=getNode(norm(dirPart||'.'));
    if(!dir||dir.type!=='dir')return;
    cands=Object.keys(dir.children).filter(n=>n.startsWith(pre)&&(pre.startsWith('.')||!n.startsWith('.'))).sort()
      .map(n=>dirPart+n+(dir.children[n].type==='dir'?'/':''))}
  if(!cands.length)return;
  if(cands.length===1){const c=cands[0];input.value=before+c+(c.endsWith('/')?'':' ')}
  else{let pfx=cands[0];cands.forEach(c=>{while(!c.startsWith(pfx))pfx=pfx.slice(0,-1)});
    if(pfx.length>partial.length)input.value=before+pfx;
    else{print([{parts:[...promptParts(),{t:v,c:'cmd'}]},{parts:cands.map((c,i)=>({t:(i?'  ':'')+c,c:c.endsWith('/')?'d':'f'}))}])}}
  renderAnatomy();
}

/* ---------- nano ---------- */
const nano=$('#nano'),nt=$('#nanoText');let nanoPath=null,nanoDirty=false,nanoConfirm=false;
function openNano(p){
  nanoPath=p;const n=getNode(p);nt.value=n?n.content:'';nanoDirty=false;nanoConfirm=false;
  $('#nanoName').textContent=disp(p);$('#nanoState').textContent=n?'':'New file';$('#nanoMsg').textContent='';
  nano.hidden=false;nt.focus();
}
function nanoSave(){
  const n=getNode(nanoPath);if(n)n.content=nt.value;else putNode(nanoPath,F(nt.value));recent.add(nanoPath);
  nanoDirty=false;nanoConfirm=false;$('#nanoState').textContent='';
  $('#nanoMsg').textContent=`[ Wrote ${splitLines(nt.value).length} lines ]`;renderMap();
}
function nanoExit(){
  if(nanoDirty&&!nanoConfirm){nanoConfirm=true;$('#nanoMsg').textContent='Unsaved changes. Press ^O to save, or ^X again to discard them.';return}
  nano.hidden=true;print([L(nanoDirty?`Closed ${disp(nanoPath)} without saving.`:`Closed ${disp(nanoPath)}.`,'note')]);
  nanoPath=null;renderAll();input.focus();
}
nt.addEventListener('input',()=>{nanoDirty=true;nanoConfirm=false;$('#nanoState').textContent='Modified'});
nt.addEventListener('keydown',e=>{
  if(e.ctrlKey&&(e.key==='o'||e.key==='O')){e.preventDefault();nanoSave()}
  else if(e.ctrlKey&&(e.key==='x'||e.key==='X')){e.preventDefault();nanoExit()}
  else if(e.key==='Escape'){e.preventDefault();nanoExit()}
});
$('#nanoSave').onclick=()=>{nanoSave();nt.focus()};
$('#nanoExit').onclick=nanoExit;

/* ---------- Events ---------- */
input.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const v=input.value;input.value='';run(v)}
  else if(e.key==='ArrowUp'){e.preventDefault();if(hIdx>0){hIdx--;input.value=hist[hIdx];renderAnatomy()}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(hIdx<hist.length-1){hIdx++;input.value=hist[hIdx]}else{hIdx=hist.length;input.value=''}renderAnatomy()}
  else if(e.key==='Tab'){e.preventDefault();complete()}
  else if(e.ctrlKey&&(e.key==='l'||e.key==='L')){e.preventDefault();screen.innerHTML=''}
  else if(e.ctrlKey&&(e.key==='c'||e.key==='C')&&!window.getSelection().toString()){e.preventDefault();print([{parts:[...promptParts(),{t:input.value+'^C',c:'cmd'}]}]);input.value='';renderAnatomy()}
});
input.addEventListener('input',renderAnatomy);
screen.addEventListener('click',()=>{if(!window.getSelection().toString())input.focus()});
$('#btnClear').onclick=()=>{screen.innerHTML='';input.focus()};
$('#btnReset').onclick=()=>{root=seed();procs=seedProcs();cwd=HOME;prevDir=HOME;print([N('Files restored to their starting state.')]);renderAll();input.focus()};
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;store.set('lcs-mode',mode);if(mode==='lessons'&&active<0)active=0;renderAll()});

/* Theme */
const themeBtn=$('#themeBtn');
function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function renderTheme(){themeBtn.innerHTML=isDark()?ICON.sun:ICON.moon;themeBtn.setAttribute('aria-label',isDark()?'Switch to light theme':'Switch to dark theme')}
const savedTheme=store.get('lcs-theme',null);if(savedTheme)document.documentElement.dataset.theme=savedTheme;
themeBtn.onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;store.set('lcs-theme',t);renderTheme()};
renderTheme();

/* Start */
print([
  L('Welcome to the Linux command simulator.','ok'),
  L('Everything happens in a safe, pretend filesystem. Nothing you type can harm a real computer.'),
  L("Type help for every command, or follow the lesson path on the left.",'info'),
  L('')
]);
if(mode==='lessons'&&active>=0)print([L(`Lesson ${active+1}: ${LESSONS[active].title}`,'info'),L(LESSONS[active].objective,'note'),L('')]);
renderAll();
input.focus({preventScroll:true});
})();
</script>
</body>
