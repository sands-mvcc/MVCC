<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nursing Concepts Virtual Lab</title>
<style>
:root{
  --bg:#F4F7FB;--surface:#FFFFFF;--surface-2:#E9EFF8;--ink:#14213D;--muted:#4A5873;--line:#D2DBE9;
  --navy:#0047AB;--navy-soft:#DCE7FA;--green:#00A86B;--green-ink:#00744A;--green-soft:#D7F3E7;
  --amber:#9A5B00;--amber-soft:#FCEBCB;--red:#B42318;--red-soft:#FBE1DE;
  --room-wall:#E6EDF6;--room-floor:#C9D3E1;--room-line:#7A889E;--room-fill:#FFFFFF;
  --c1:#0047AB;--c2:#B42318;--c3:#6A3FA0;--c4:#00747F;--c5:#9A5B00;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626;--surface:#152036;--surface-2:#1C2A46;--ink:#E6ECF6;--muted:#A9B5CB;--line:#2B3B5C;
    --navy:#7CA8FF;--navy-soft:#1F3260;--green:#2FD39A;--green-ink:#52E0AE;--green-soft:#12392D;
    --amber:#F3B356;--amber-soft:#3D2C10;--red:#FF8A7A;--red-soft:#43201D;
    --room-wall:#1E2C47;--room-floor:#26365A;--room-line:#8FA0BE;--room-fill:#2A3A5E;
    --c1:#7CA8FF;--c2:#FF8A7A;--c3:#C3A2F0;--c4:#5CD3DE;--c5:#F3B356;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626;--surface:#152036;--surface-2:#1C2A46;--ink:#E6ECF6;--muted:#A9B5CB;--line:#2B3B5C;
  --navy:#7CA8FF;--navy-soft:#1F3260;--green:#2FD39A;--green-ink:#52E0AE;--green-soft:#12392D;
  --amber:#F3B356;--amber-soft:#3D2C10;--red:#FF8A7A;--red-soft:#43201D;
  --room-wall:#1E2C47;--room-floor:#26365A;--room-line:#8FA0BE;--room-fill:#2A3A5E;
  --c1:#7CA8FF;--c2:#FF8A7A;--c3:#C3A2F0;--c4:#5CD3DE;--c5:#F3B356;color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
img,svg{max-width:100%}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 .5rem;font-weight:700}
h1{font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,3vw,2rem)}
h3{font-size:1.25rem}
p{margin:0 0 1rem}
.wrap{max-width:1120px;margin:0 auto;padding:0 1.25rem}
.measure{max-width:68ch}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:1rem;min-height:62px}
.brand{display:flex;align-items:center;gap:.6rem;text-decoration:none;color:var(--ink);font-family:var(--serif);font-weight:700;font-size:1.05rem;white-space:nowrap}
.brand svg{flex:none}
.nav{display:flex;gap:.25rem;overflow-x:auto;flex:1;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:.45rem .7rem;border-radius:999px;font-size:.92rem}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .nav a[aria-current="page"]{color:#0E1626}
.theme{flex:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:.4rem .8rem;font:inherit;font-size:.88rem;cursor:pointer;display:flex;gap:.4rem;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6rem 1rem;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1626}
.btn.go{background:var(--green-ink);border-color:var(--green-ink);color:#fff}
:root[data-theme="dark"] .btn.go{color:#0E1626}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}

/* hero */
.hero{padding:3rem 0 2rem;border-bottom:1px solid var(--line);background:var(--surface)}
.hero-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:2.5rem;align-items:center}
.hero p.lede{font-size:1.15rem;color:var(--muted);max-width:52ch}
.strip{background:#0B1A2F;border-radius:18px;padding:1rem 1.1rem 1.1rem;color:#CFE3FF;box-shadow:0 0 0 1px #1E3354 inset}
.strip-top{display:flex;justify-content:space-between;font-size:.85rem;color:#8FB0D9;margin-bottom:.4rem}
.strip-vals{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-top:.6rem}
.strip-vals div{background:#10233F;border-radius:10px;padding:.45rem .6rem}
.strip-vals b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums;color:#5CF2B0;line-height:1.1}
.strip-vals span{font-size:.75rem;color:#8FB0D9}
.strip-vals div:nth-child(2) b{color:#7FD4FF}
.strip-vals div:nth-child(3) b{color:#FFE27A}
.strip-vals div:nth-child(4) b{color:#FFFFFF}
.ecg{width:100%;height:110px;display:block}
.ecg path{fill:none;stroke:#5CF2B0;stroke-width:2.4;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:trace 3.2s linear infinite}
@keyframes trace{to{stroke-dashoffset:0}}

/* sections */
.sec{padding:2.5rem 0}
.sec + .sec{border-top:1px solid var(--line)}
.sub{color:var(--muted)}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.concept{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--cc);border-radius:14px;padding:1.1rem 1.2rem}
.concept h3{display:flex;gap:.6rem;align-items:baseline}
.concept h3 .num{color:var(--cc);font-variant-numeric:tabular-nums}
.concept details{border-top:1px solid var(--line);padding:.55rem 0}
.concept summary{cursor:pointer;font-weight:600}
.concept details p{margin:.4rem 0 0;color:var(--muted);font-size:.95rem}

/* ADPIE */
.cycle{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:2rem;align-items:center}
.ring{position:relative;aspect-ratio:1}
.ring svg{width:100%;height:100%}
.ring button{position:absolute;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;border:2px solid var(--navy);background:var(--surface);color:var(--ink);font:600 .85rem/1.15 var(--sans);cursor:pointer;padding:.3rem}
.ring button[aria-pressed="true"]{background:var(--navy);color:#fff}
:root[data-theme="dark"] .ring button[aria-pressed="true"]{color:#0E1626}
.phase-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.3rem;min-height:180px}

/* glossary flip */
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.9rem}
.flip{perspective:900px;height:150px;border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit;text-align:left}
.flip-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip[aria-pressed="true"] .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:1rem;border:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.front{background:var(--surface)}
.front b{font-family:var(--serif);font-size:1.15rem}
.front small{color:var(--muted);margin-top:.3rem}
.back{background:var(--navy-soft);transform:rotateY(180deg);font-size:.92rem}

/* lab header + wristband */
.labhead{background:var(--surface);border-bottom:1px solid var(--line);padding:1.8rem 0 1.4rem}
.labhead .kicker{color:var(--lc);font-weight:700;margin-bottom:.2rem}
.band{margin-top:1.1rem;display:flex;align-items:stretch;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;max-width:880px}
.band .clasp{width:26px;background:var(--lc);flex:none}
.band .id{padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.3rem 1.3rem;align-items:center;flex:1;font-size:.92rem}
.band .id b{font-family:var(--serif);font-size:1.1rem}
.band .id span{color:var(--muted)}
.band .id span em{font-style:normal;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.band .code{width:110px;flex:none;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 13px);opacity:.75;margin:.55rem 1rem .55rem 0;border-radius:2px}
.flagrow{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .65rem;border-radius:999px;font-size:.82rem;font-weight:600;border:1px solid transparent}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.blue{background:var(--navy-soft);color:var(--navy)}
.chip.green{background:var(--green-soft);color:var(--green-ink)}
.chip.grey{background:var(--surface-2);color:var(--muted)}
.scen{margin-top:1rem;max-width:72ch}

.brief{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin:1.4rem 0}
.brief details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem}
.brief summary{cursor:pointer;font-weight:700}
.brief p{color:var(--muted);font-size:.94rem;margin:.5rem 0 0}

.labbody{display:grid;grid-template-columns:260px 1fr;gap:1.4rem;padding:1.4rem 0 3rem;align-items:start}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:.35rem}
.steps .meter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.8rem;margin-bottom:.4rem}
.steps .meter .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:.4rem 0}
.steps .meter .bar i{display:block;height:100%;background:var(--lc);transition:width .4s}
.steps .meter small{color:var(--muted)}
.step{display:flex;gap:.6rem;align-items:center;text-align:left;border:1px solid transparent;background:none;color:var(--ink);font:inherit;font-size:.93rem;padding:.5rem .6rem;border-radius:10px;cursor:pointer}
.step:hover{background:var(--surface)}
.step[aria-current="step"]{background:var(--surface);border-color:var(--lc)}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:.8rem;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.step.done .n{background:var(--lc);border-color:var(--lc);color:var(--surface)}

.station{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.4rem 1.5rem}
.station header{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:.4rem}
.station header h3{margin:0}
.dom{font-size:.78rem;font-weight:700;padding:.15rem .55rem;border-radius:999px}
.dom.K{background:var(--navy-soft);color:var(--navy)}
.dom.S{background:var(--green-soft);color:var(--green-ink)}
.dom.C{background:var(--amber-soft);color:var(--amber)}
.prompt{max-width:72ch}
.actions{display:flex;gap:.8rem;align-items:center;margin-top:1.2rem;flex-wrap:wrap}
.msg{color:var(--red);font-weight:600;font-size:.92rem}

.opts{display:grid;gap:.5rem}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:.75rem .9rem;border-radius:10px;cursor:pointer;line-height:1.4;display:flex;gap:.6rem;align-items:flex-start}
.opt::before{content:"";flex:none;width:16px;height:16px;margin-top:.2rem;border:2px solid var(--muted);border-radius:50%}
.opt.chk::before{border-radius:4px}
.opt:hover:not([disabled]){border-color:var(--navy)}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft)}
.opt[aria-checked="true"]::before,.opt[aria-pressed="true"]::before{background:var(--navy);border-color:var(--navy);box-shadow:inset 0 0 0 3px var(--surface)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt.missed{border-style:dashed;border-color:var(--green)}
.tag{margin-left:auto;font-size:.78rem;font-weight:700;white-space:nowrap;padding-left:.5rem}
.ok .tag{color:var(--green-ink)}.bad .tag{color:var(--red)}.missed .tag{color:var(--green-ink)}

.fb{margin-top:1.1rem}
.fbcard{border-radius:12px;padding:1rem 1.1rem;border:1px solid var(--line);background:var(--surface-2)}
.fbcard.full{border-color:var(--green);background:var(--green-soft)}
.fbcard.part{border-color:var(--amber);background:var(--amber-soft)}
.fbcard.none{border-color:var(--red);background:var(--red-soft)}
.fbcard .score{font-weight:700;font-size:1.05rem;margin-bottom:.4rem}
.fbcard p:last-child,.fbcard ul:last-child,.fbcard ol:last-child{margin-bottom:0}
.why{margin-top:.6rem}

/* order */
.order{list-style:none;padding:0;margin:0;display:grid;gap:.45rem}
.order li{display:flex;align-items:center;gap:.7rem;border:1.5px solid var(--line);border-radius:10px;padding:.55rem .7rem;background:var(--surface)}
.order li.ok{border-color:var(--green);background:var(--green-soft)}
.order li.bad{border-color:var(--red);background:var(--red-soft)}
.order .pos{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:.82rem;flex:none}
.order .txt{flex:1}
.mv{display:flex;gap:.3rem}
.mv button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;font-size:.8rem}
.mv button:disabled{opacity:.35;cursor:default}

/* sort */
.sort{display:grid;gap:.45rem}
.srow{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:10px;padding:.55rem .75rem}
.srow.ok{border-color:var(--green);background:var(--green-soft)}
.srow.bad{border-color:var(--red);background:var(--red-soft)}
.sbins{display:flex;gap:.3rem}
.sbins button{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.86rem;padding:.35rem .7rem;border-radius:999px;cursor:pointer}
.sbins button[aria-checked="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .sbins button[aria-checked="true"]{color:#0E1626}

/* builder */
.builder{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7rem}
.builder label{display:flex;flex-direction:column;gap:.3rem;font-weight:600;font-size:.9rem;border-radius:10px;padding:.4rem}
.builder label.ok{background:var(--green-soft)}
.builder label.bad{background:var(--red-soft)}
select,input[type=number],input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:.5rem .6rem;width:100%}
.preview{margin-top:.9rem;padding:.8rem 1rem;background:var(--surface-2);border-radius:10px;font-family:var(--serif);font-size:1.05rem}
.blank{color:var(--muted)}

/* numeric */
.loga{width:100%;border-collapse:collapse;font-size:.93rem;margin:.4rem 0 1rem}
.tblwrap{overflow-x:auto}
.loga th,.loga td{padding:.45rem .6rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.loga th{background:var(--surface-2)}
.loga td.num{text-align:right;font-variant-numeric:tabular-nums}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.7rem}
.nums label{display:flex;flex-direction:column;gap:.3rem;font-weight:600;font-size:.9rem;padding:.4rem;border-radius:10px}
.nums label.ok{background:var(--green-soft)}.nums label.bad{background:var(--red-soft)}
.inrow{display:flex;gap:.4rem;align-items:center}
.inrow em{font-style:normal;color:var(--muted);font-weight:500;white-space:nowrap}

/* monitor */
.monitor{background:#0B1A2F;border-radius:16px;padding:1rem;color:#CFE3FF}
.mon-head{display:flex;justify-content:space-between;color:#8FB0D9;font-size:.85rem;margin-bottom:.6rem;gap:1rem;flex-wrap:wrap}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.6rem}
.vt{background:#10233F;border-radius:12px;padding:.7rem;display:flex;flex-direction:column;gap:.1rem;min-height:130px}
.vl{font-size:.8rem;color:#8FB0D9}
.vv{font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;color:#5CF2B0;line-height:1.1}
.vv.wait{color:#56708F}
.vu{font-size:.75rem;color:#8FB0D9}
.vb{font-size:.75rem;color:#B9C9E0;margin-top:auto}
.meas{margin-top:.4rem;border:1px solid #2E4A72;background:#16325A;color:#E3EEFF;border-radius:8px;padding:.35rem;font:inherit;font-size:.82rem;cursor:pointer}
.meas:disabled{opacity:.45;cursor:default}
.flags{border:1px solid var(--line);border-radius:12px;margin:1rem 0 0;padding:.7rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem}
.flags legend{font-weight:700;padding:0 .3rem}
.flag{display:flex;gap:.4rem;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:.3rem .8rem;font-size:.92rem;cursor:pointer}
.flag.ok{border-color:var(--green);background:var(--green-soft)}
.flag.bad{border-color:var(--red);background:var(--red-soft)}
.flag.locked{opacity:.55}

/* room hotspot */
.room{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--room-wall)}
.room svg{display:block;width:100%;height:auto}
.rw{fill:var(--room-wall)}.rf{fill:var(--room-floor)}.rl{stroke:var(--room-line);stroke-width:2;fill:var(--room-fill)}
.rlo{stroke:var(--room-line);stroke-width:2;fill:none}
.spot{cursor:pointer;outline:none}
.spot rect{fill:transparent;stroke:transparent;stroke-width:2.5;stroke-dasharray:6 5}
.spot .pin,.spot .pint{opacity:0}
.spot:hover rect,.spot:focus-visible rect{stroke:var(--navy);fill:rgba(0,71,171,.06)}
.spot.sel rect{stroke:var(--red);fill:rgba(180,35,24,.12);stroke-dasharray:none}
.spot.sel .pin{opacity:1;fill:var(--red)}.spot.sel .pint{opacity:1;fill:#fff;font:700 15px var(--sans)}
.spot.hit rect{stroke:var(--green);fill:rgba(0,168,107,.15);stroke-dasharray:none}
.spot.hit .pin{opacity:1;fill:var(--green)}.spot.hit .pint{opacity:1;fill:#fff;font:700 15px var(--sans)}
.spot.miss rect{stroke:var(--amber);fill:rgba(154,91,0,.15)}
.spot.fp rect{stroke:var(--red);fill:rgba(180,35,24,.12);stroke-dasharray:none}
.count{margin:.6rem 0 0;color:var(--muted)}
.rlist{list-style:none;padding:0;margin:.4rem 0 0;display:grid;gap:.35rem}
.rlist li{padding:.45rem .6rem;border-radius:8px;background:var(--surface);font-size:.93rem}

/* dialogue */
.dlg{display:grid;gap:.7rem}
.trust{display:flex;align-items:center;gap:.7rem;font-size:.9rem;font-weight:600}
.tbar{flex:1;max-width:260px;height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--c3);transition:width .5s}
.bub{max-width:78%;padding:.7rem .9rem;border-radius:14px;line-height:1.45}
.bub .who{display:block;font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:.15rem}
.bub.pt{background:var(--surface-2);border-top-left-radius:4px}
.bub.rn{justify-self:end;background:var(--navy-soft);border-top-right-radius:4px}
.bub.rn.bad{background:var(--red-soft)}
.bub.rn.ok{background:var(--green-soft)}
.dfb{border-left:4px solid var(--line);padding:.4rem .8rem;font-size:.93rem}
.dfb.ok{border-color:var(--green)}.dfb.bad{border-color:var(--red)}

/* pulse ox */
.oxi{display:grid;grid-template-columns:auto auto 1fr;gap:1rem;align-items:center;background:#0B1A2F;border-radius:14px;padding:1rem;color:#CFE3FF;margin:.8rem 0 1rem}
.oxread b,.oxhr b{font-size:2.2rem;font-variant-numeric:tabular-nums;color:#7FD4FF;display:block;line-height:1}
.oxhr b{color:#5CF2B0}
.oxread span,.oxhr span{font-size:.78rem;color:#8FB0D9}
.plethbox{overflow:hidden;height:80px;position:relative}
.plethbox svg{width:200%;height:80px;display:block}
.plethbox path{fill:none;stroke:#7FD4FF;stroke-width:2.2}
.plethbox .sc{animation:scroll 3s linear infinite}
@keyframes scroll{to{transform:translateX(-50%)}}
.oxq{grid-column:1/-1;font-size:.88rem;color:#B9C9E0}
.subh{font-weight:700;margin:.6rem 0 .5rem}

/* results */
.result{background:var(--surface);border:2px solid var(--lc);border-radius:16px;padding:1.4rem 1.5rem;margin-bottom:1rem}
.result .big{font-family:var(--serif);font-size:2.6rem;font-weight:700;color:var(--lc);font-variant-numeric:tabular-nums}
.ksc{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin:1rem 0}
.ksc div{background:var(--surface-2);border-radius:10px;padding:.6rem .8rem;font-size:.9rem}
.ksc b{display:block;font-size:1.3rem;font-variant-numeric:tabular-nums}
.mini{height:6px;border-radius:9px;background:var(--surface);overflow:hidden;margin-top:.3rem}
.mini i{display:block;height:100%}

/* dashboard */
.dash-top{display:grid;grid-template-columns:240px 1fr;gap:1.6rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.4rem 1.6rem}
.donut{position:relative;width:200px;height:200px}
.donut svg{transform:rotate(-90deg)}
.donut .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .lbl b{font-family:var(--serif);font-size:2.4rem;display:block;line-height:1}
.donut .lbl small{color:var(--muted)}
.namefield{display:flex;flex-direction:column;gap:.3rem;max-width:360px;font-weight:600;font-size:.9rem;margin-bottom:.8rem}
.labrows{display:grid;gap:.8rem;margin-top:1.4rem}
.labrow{display:grid;grid-template-columns:1.4fr 1fr 1.3fr auto;gap:1rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--lc);border-radius:14px;padding:1rem 1.2rem}
.labrow h3{font-size:1.05rem;margin:0}
.labrow .sub{font-size:.85rem}
.pbar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--lc)}
.dmini{display:grid;gap:.25rem;font-size:.8rem;color:var(--muted)}
.dmini div{display:grid;grid-template-columns:110px 1fr 38px;gap:.4rem;align-items:center}
.dmini .mini{background:var(--surface-2);margin:0}
.rating{font-weight:700}
.matrix{width:100%;border-collapse:collapse;font-size:.92rem;background:var(--surface);border-radius:12px;overflow:hidden}
.matrix th,.matrix td{border:1px solid var(--line);padding:.55rem .6rem;text-align:center}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix thead th{background:var(--surface-2)}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dot.half{background:linear-gradient(90deg,var(--amber) 50%,transparent 50%);border-color:var(--amber)}
.dot.full{background:var(--green);border-color:var(--green)}
.legend{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:.6rem}
.legend span{display:flex;gap:.4rem;align-items:center}
.refl{display:grid;gap:.9rem}
.refl label{display:flex;flex-direction:column;gap:.35rem;font-weight:600}
.refl textarea{min-height:90px;resize:vertical;font-weight:400}
.saved{font-size:.82rem;color:var(--green-ink);font-weight:600;min-height:1.2em}
.note{font-size:.9rem;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:1.5rem 0 2.5rem;color:var(--muted);font-size:.88rem}

@media (max-width:900px){
  .hero-grid,.cycle,.labbody,.dash-top{grid-template-columns:1fr}
  .steps{position:static;flex-direction:row;overflow-x:auto;padding-bottom:.3rem}
  .steps .meter{min-width:200px}
  .step{white-space:nowrap}
  .brief{grid-template-columns:1fr}
  .labrow{grid-template-columns:1fr}
  .ring{max-width:340px;margin:0 auto;width:100%}
  .band{border-radius:16px}
  .band .code{display:none}
}
@media (max-width:560px){
  .brand span{display:none}
  .ring button{width:74px;height:74px;font-size:.74rem}
  .ksc{grid-template-columns:1fr}
  .oxi{grid-template-columns:1fr 1fr}
  .station{padding:1.1rem}
  .bub{max-width:92%}
}
@media (prefers-reduced-motion:reduce){
  .ecg path{animation:none;stroke-dashoffset:0}
  .plethbox .sc{animation:none}
  .flip-in{transition:none}
  *{scroll-behavior:auto!important}
}
@media print{
  .top,.no-print,footer{display:none!important}
  body{background:#fff;color:#000}
  .labrow,.dash-top{break-inside:avoid}
}

 {id:"prep",type:"order",d:"S",title:"Prepare for safe care",
  prompt:"Put these steps in a safe order for entering Ms. Park’s room and giving morning care.",
  items:["Perform hand hygiene","Put on gown","Put on gloves","Enter, introduce yourself and explain the care","Verify identity with two identifiers against the wristband","Lock the bed brakes and raise the bed to working height","Provide care","Lower the bed and place the call light within reach"],
  why:"Hand hygiene and PPE come before entering an isolation room. Verify identity before any care. Prepare the environment for both your safety and the patient’s, and always leave the bed low with the call light in reach."},
 {id:"nearmiss",type:"mcq",d:"C",title:"Report a near miss",
  prompt:"While preparing care you notice a medication labeled for Park, Jae in Ms. Park’s drawer. You catch it before anything reaches her. What is the best action?",
  opts:[{t:"Nothing reached the patient, so no report is needed",ok:false,fb:"Near misses are exactly the events that reveal system weaknesses before harm occurs."},
        {t:"Remove it, notify the RN and your instructor, and report it through the facility’s safety event reporting system",ok:true,fb:"Correct. Secure the patient, escalate, and report through the proper channel."},
        {t:"Mention it informally to a classmate",ok:false,fb:"Informal conversation does not reach the people who can fix the system."},
        {t:"Write in Ms. Park’s chart that an error almost happened",ok:false,fb:"Safety event reports go through the reporting system, not the patient’s clinical record."}],
  why:"A near miss is an event that could have caused harm but was caught. Reporting it through the safety event system in a just, non-punitive culture is how organizations learn."},
 {id:"qi",type:"mcq",d:"K",title:"From report to improvement",
  prompt:"Over a month, the unit receives six near-miss reports involving patients with similar names. What is the most likely quality improvement response?",
  opts:[{t:"Discipline the staff involved in each report",ok:false,fb:"Blame discourages reporting and does not fix the system."},
        {t:"Add name-alert flags to wristbands and the medication record, then monitor whether reports decrease",ok:true,fb:"Correct. A system change, followed by measurement, is a QI cycle."},
        {t:"Stop admitting patients with the same last name",ok:false,fb:"Not feasible and does not address the process."},
        {t:"Remind staff to be more careful",ok:false,fb:"Relying on vigilance alone is the weakest kind of fix."}],
  why:"Aggregated near-miss data reveal patterns. QI teams test a system change, such as name alerts or separate storage, and measure whether the problem decreases (Plan, Do, Study, Act)."}
 ]},

{id:"lab3",n:3,color:"var(--c3)",title:"Health maintenance and patient-centered care",
 short:"Patient-centered care",
 patient:{name:"Okafor, Grace",dob:"06/21/1968",mrn:"MRN 5571903",room:"Clinic room 2",age:"58 y"},
 flags:[["blue","Type 2 diabetes, stable"],["grey","Prefers “Grace”"],["green","New: home glucose meter"]],
 scenario:"Grace has stable type 2 diabetes and was just prescribed home blood glucose monitoring. She works night shifts as a warehouse supervisor. A health literacy screen suggests she prefers plain-language materials. You will help her build a self-care plan that fits her life.",
 know:"Health promotion, prevention and self-management for healthy people and people with stable chronic conditions. How culture, preferences, health literacy and access to resources influence care.",
 skills:"Use therapeutic communication to elicit the patient’s goals, assess readiness to learn, provide plain-language education, and use teach-back to check understanding.",
 comp:"Co-develop a realistic self-care goal with the patient, adapt teaching to the patient’s needs and preferences, and verify that the patient can explain or demonstrate the agreed action.",
 reflect:"How did Grace’s work schedule and her family history change the goal you set together?",
 qsen:["Patient-centered care","Evidence-based practice","Teamwork and collaboration"],
 stations:[
 {id:"factors",type:"multi",d:"K",title:"What shapes Grace’s plan?",
  prompt:"Select every detail that should shape how you teach Grace and what goal you set.",
  opts:[{t:"She works night shifts",ok:true},{t:"Her mother needed insulin injections",ok:true},{t:"She prefers plain-language materials",ok:true},{t:"Test strips may be costly for her",ok:true},{t:"Her clinic room number",ok:false},{t:"The time of day you prefer to teach",ok:false}],
  why:"Schedule, personal and family experience, health literacy and access to resources all affect whether a plan is realistic. Patient-centered care builds the plan around the person, not the nurse’s convenience."},
 {id:"plain",type:"sort",d:"S",title:"Plain language check",
  prompt:"Sort each phrase: is it ready to use with Grace, or should you rephrase it first?",
  bins:["Use as is","Rephrase first"],
  items:[{t:"Blood sugar",b:0},{t:"Glycemic control",b:1},{t:"Check before your first meal after you wake up",b:0},{t:"Preprandial monitoring",b:1},{t:"Hypoglycemia",b:1},{t:"Low blood sugar can make you shaky, sweaty or confused",b:0}],
  why:"Plain language uses everyday words, short sentences and concrete actions. Clinical terms are fine once you explain them, but they should not carry the main message."},
 {id:"talk",type:"dialogue",d:"C",title:"Teaching conversation",name:"Grace",
  prompt:"Talk with Grace. Choose each response and watch how her trust changes. Aim to elicit her goals, check readiness, teach plainly, agree on a goal and confirm understanding.",
  turns:[
   {say:"The doctor says I have to check my sugar now. I don’t know how I’ll fit that in with my job.",
    opts:[{t:"“What would make this easier to fit around your work?”",ok:true,fb:"Open-ended and centered on her life. It invites her to lead."},
          {t:"“Don’t worry, everyone gets used to it.”",ok:false,fb:"False reassurance dismisses her concern."},
          {t:"“You really have to make time. It’s important.”",ok:false,fb:"Lecturing can make her defensive and less likely to engage."},
          {t:"“Why didn’t you start checking earlier?”",ok:false,fb:"“Why” questions can sound judgmental."}]},
   {say:"Honestly I’m wiped out after a shift. But I want to stay off insulin. My mom had to inject every day.",
    opts:[{t:"Begin a detailed explanation of the meter right away.",ok:false,fb:"She just told you she is exhausted. Check readiness first."},
          {t:"“Your mom’s situation was probably different.”",ok:false,fb:"Dismisses a powerful motivator."},
          {t:"“Staying off insulin really matters to you. Is now a good time to try the meter together, or would another time work better?”",ok:true,fb:"Reflects her motivation and checks readiness to learn."},
          {t:"Give her a pamphlet and leave.",ok:false,fb:"Written material alone does not confirm readiness or understanding."}]},
   {say:"Now is okay. Just tell me what this thing actually does.",
    opts:[{t:"“It measures your capillary glucose to assess glycemic control.”",ok:false,fb:"Accurate, but full of jargon."},
          {t:"“It’s simple. Poke your finger and read it.”",ok:false,fb:"Too thin. It skips what the number means and what to do."},
          {t:"“It shows how much sugar is in your blood right now. A small drop from your fingertip goes on the strip, and the number tells us how your plan is working.”",ok:true,fb:"Plain, concrete and connects to her goal."},
          {t:"Read the full manufacturer instructions aloud.",ok:false,fb:"Too much at once. Teach the essential action first."}]},
   {say:"Okay. When am I supposed to do it?",
    opts:[{t:"“Every morning at 7 a.m.”",ok:false,fb:"Ignores her night-shift schedule."},
          {t:"“You told me you get home and eat after your shift. Would checking right before that meal work, most days of the week?”",ok:true,fb:"A shared goal built from her routine. Confirm the exact frequency with the prescriber’s plan."},
          {t:"“Check four times a day, no exceptions.”",ok:false,fb:"Imposed and unrealistic for her, and not based on her prescribed plan."},
          {t:"“Whenever you remember.”",ok:false,fb:"Not specific enough to act on or evaluate."}]},
   {say:"Yeah, right before I eat when I get home. I can do that.",
    opts:[{t:"“Do you understand?”",ok:false,fb:"Yes/no questions rarely reveal gaps."},
          {t:"“Any questions?”",ok:false,fb:"Many people won’t ask even when unsure."},
          {t:"“I want to be sure I explained it clearly. Could you show me how you’ll check when you get home tomorrow?”",ok:true,fb:"Teach-back. It puts the responsibility on the teacher and asks her to demonstrate."},
          {t:"“Great, you’ll do fine.”",ok:false,fb:"Encouraging, but it does not verify understanding."}]}
  ],
  why:"Therapeutic communication, readiness assessment, plain language, shared goal setting and teach-back work together. Teach-back checks your teaching, not the patient’s intelligence."},
 {id:"access",type:"mcq",d:"C",title:"Address a barrier to access",
  prompt:"At the end of the visit Grace says, “Those strips cost a lot. I might stretch them out.” What is the best response?",
  opts:[{t:"“Just check less often then.”",ok:false,fb:"Changes her prescribed plan without the prescriber and accepts a barrier you could help address."},
        {t:"Thank her for telling you, and let the RN know so the team can involve a case manager or social worker about coverage or lower-cost options",ok:true,fb:"Correct. You acknowledge the barrier and use the team to address it."},
        {t:"“Insurance usually covers it, don’t worry.”",ok:false,fb:"False reassurance that may not be true for her."},
        {t:"Tell her a brand of strips to buy online.",ok:false,fb:"Recommending products is outside the student role and may not fit her plan or coverage."}],
  why:"Cost and access shape self-management as much as knowledge does. Naming the barrier and bringing in the interprofessional team keeps the plan realistic."}
 ]},

{id:"lab4",n:4,color:"var(--c4)",title:"Nutrition, hydration, elimination and oxygenation",
 short:"Intake, output and breathing",
 patient:{name:"Reyes, Samuel",dob:"11/30/1946",mrn:"MRN 2087345",room:"Bed 12",age:"79 y"},
 flags:[["blue","Recovering from UTI"],["grey","Weight 70 kg"],["amber","Strict intake and output"]],
 scenario:"Mr. Reyes is recovering from a urinary tract infection. His daughter says he usually eats well and urinates five or six times a day. Today he seems less interested in food and drink. You are tracking intake and output on the day shift, 0700 to 1500.",
 know:"Basic nutritional and fluid needs, normal and altered bowel and bladder patterns, and signs of difficulty swallowing, dehydration or impaired oxygenation. How to distinguish the usual pattern from a meaningful change.",
 skills:"Record intake and output, assist with meals and toileting according to the care plan, obtain respiratory observations and pulse oximetry, and report abnormal findings.",
 comp:"Recognize a change such as reduced intake, decreased urine output or increased work of breathing. Provide appropriate basic support, communicate the concern promptly and reassess the response.",
 reflect:"What told you Mr. Reyes’s pattern had meaningfully changed from his usual? How quickly would you report it?",
 qsen:["Safety","Teamwork and collaboration","Informatics","Evidence-based practice"],
 stations:[
 {id:"io",type:"numeric",d:"S",title:"Calculate intake and output",
  prompt:"Use the shift log to calculate totals. Count only what he actually consumed, and count foods that are liquid at room temperature.",
  table:`<div class="tblwrap"><table class="loga"><thead><tr><th>Time</th><th>Item</th><th>Served</th><th>Consumed</th></tr></thead><tbody>
  <tr><td>0730</td><td>Orange juice</td><td class="num">120 mL</td><td>All</td></tr>
  <tr><td>0730</td><td>Coffee</td><td class="num">240 mL</td><td>Half</td></tr>
  <tr><td>0730</td><td>Toast</td><td class="num">1 slice</td><td>Two bites</td></tr>
  <tr><td>0930</td><td>Water</td><td class="num">90 mL</td><td>All</td></tr>
  <tr><td>1200</td><td>Chicken broth</td><td class="num">180 mL</td><td>All</td></tr>
  <tr><td>1200</td><td>Gelatin</td><td class="num">120 mL</td><td>All</td></tr>
  </tbody></table></div>
  <div class="tblwrap"><table class="loga"><thead><tr><th>Time</th><th>Output</th><th>Amount</th></tr></thead><tbody>
  <tr><td>0800</td><td>Urine, dark amber</td><td class="num">150 mL</td></tr>
  <tr><td>1130</td><td>Urine, dark amber</td><td class="num">90 mL</td></tr>
  <tr><td>1430</td><td>Urine, dark amber</td><td class="num">60 mL</td></tr>
  </tbody></table></div>`,
  fields:[{label:"Total oral intake",ans:630,tol:0,unit:"mL"},{label:"Total urine output",ans:300,tol:0,unit:"mL"},{label:"Average urine output over the 8-hour shift",ans:37.5,tol:0.6,unit:"mL/hr"},{label:"Urine rate from 1130 to 1430",ans:20,tol:0.6,unit:"mL/hr"}],
  why:"Intake: 120 + 120 + 90 + 180 + 120 = 630 mL. Output: 150 + 90 + 60 = 300 mL, or 37.5 mL/hr over 8 hours. The last interval was only 60 mL in 3 hours, about 20 mL/hr, which is below the commonly taught adult threshold of 0.5 mL/kg/hr (35 mL/hr for 70 kg). The trend matters as much as the total, so report it."},
 {id:"dehyd",type:"multi",d:"K",title:"Recognize dehydration",
  prompt:"Which findings support a concern about dehydration in Mr. Reyes? Select all that apply.",
  opts:[{t:"Dry, sticky oral mucous membranes",ok:true},{t:"Dark amber urine",ok:true},{t:"Heart rate 102, up from his baseline of 76",ok:true},{t:"Says he feels lightheaded when he sits up",ok:true},{t:"Pale yellow, clear urine",ok:false},{t:"Moist tongue",ok:false}],
  why:"In older adults, dehydration often shows up as tachycardia, dry mucous membranes, concentrated urine, dizziness on position change and sometimes new confusion. Thirst may be blunted, so rely on observed patterns."},
 {id:"oxi",type:"pulseox",d:"S",title:"Get a trustworthy SpO₂",
  prompt:"Mr. Reyes looks a little short of breath. Obtain a pulse oximetry reading. First choose where to place the probe, then decide what to do with the reading.",
  sites:[{t:"Cold index finger with dark nail polish",read:"84",hr:"--",q:"poor",note:"Weak, irregular waveform. Cold fingers and dark polish can interfere with the light signal. This number is not reliable.",ok:false},
         {t:"Warm middle finger, polish removed",read:"90",hr:"98",q:"good",note:"Strong, regular waveform, and the pulse matches his radial pulse. This reading is reliable.",ok:true},
         {t:"Finger on the arm where the BP cuff is inflating",read:"--",hr:"--",q:"noisy",note:"Signal lost while the cuff occludes blood flow. Move the probe to the other arm.",ok:false}],
  q:[{t:"Record 90% and report it to the RN, since it is down from his baseline of 95%",ok:true},{t:"Record 84% from the first attempt",ok:false},{t:"Wait for the reading to climb before recording",ok:false},{t:"Record 90% as normal and continue routine care",ok:false}],
  why:"Confirm a good waveform and a pulse that matches the patient before trusting the number. Warm the site, remove dark polish, avoid the BP cuff arm and limit motion. Pulse oximeters can also overestimate saturation in people with darker skin pigmentation, so always interpret SpO₂ alongside the whole respiratory assessment."},
 {id:"wob",type:"multi",d:"K",title:"Spot increased work of breathing",
  prompt:"Which observations indicate increased work of breathing? Select all that apply.",
  opts:[{t:"Respiratory rate 26 breaths/min",ok:true},{t:"Neck muscles tightening with each breath",ok:true},{t:"Nostrils flaring",ok:true},{t:"Leaning forward with hands on knees",ok:true},{t:"Speaking only two or three words per breath",ok:true},{t:"Respiratory rate 16, even and unlabored",ok:false},{t:"Pink nail beds with brisk capillary refill",ok:false}],
  why:"Accessory muscle use, nasal flaring, tripod positioning, tachypnea and short phrases are visible signs that breathing is taking extra effort. They often appear before SpO₂ falls."},
 {id:"swallow",type:"mcq",d:"C",title:"A change at lunch",
  prompt:"At lunch Mr. Reyes coughs after each sip of water and his voice sounds wet and gurgly. What do you do?",
  opts:[{t:"Stop oral intake, keep him sitting upright, and report to the RN so a swallow screen can be done",ok:true,fb:"Correct. These are signs of possible aspiration. Stop, position, report."},
        {t:"Give him a straw so he can drink more slowly",ok:false,fb:"Straws can increase aspiration risk and you would be changing the plan without assessment."},
        {t:"Encourage him to drink faster so he gets enough fluid",ok:false,fb:"Increases aspiration risk."},
        {t:"Note it and continue the meal",ok:false,fb:"Signs of difficulty swallowing need prompt reporting."}],
  why:"Coughing, choking or a wet voice during intake can signal dysphagia and aspiration risk. Pause oral intake, keep the patient upright, and escalate. Diet texture changes come from the swallow evaluation and the care plan."},
 {id:"respond",type:"order",d:"C",title:"Respond within your role",
  prompt:"Put your response to Mr. Reyes’s increased work of breathing in order.",
  items:["Stay with him and raise the head of the bed","Obtain respiratory rate and a reliable SpO₂","Report to the RN and instructor using SBAR","Carry out interventions as directed by the RN","Reassess respiratory status and document his response"],
  why:"Make the patient safer immediately, gather the key data, escalate with a structured report, act under direction, and close the loop with reassessment and documentation."}
 ]},

{id:"lab5",n:5,color:"var(--c5)",title:"Mobility, rest, comfort and cognition",
 short:"Mobility and comfort",
 patient:{name:"Bianchi, Rosa",dob:"04/08/1942",mrn:"MRN 6612470",room:"Bed 9",age:"84 y"},
 flags:[["amber","Fall risk"],["blue","Hearing aid (left)"],["blue","Glasses"],["grey","Walks with a walker at home"]],
 scenario:"Integrated scenario. Mrs. Bianchi is recovering from influenza. She has eaten about a quarter of her meals for two days, says she feels weak when she stands, and wants to walk to the bathroom now. Her baseline is alert, oriented to person, place, time and situation, and independent with a walker.",
 know:"The effects of immobility, disrupted sleep, pain and sensory or cognitive changes on function, comfort and recovery. The importance of the patient’s usual level of independence and orientation.",
 skills:"Assess pain, mobility and orientation. Assist with positioning, transfers and ambulation as directed. Provide basic comfort measures and adapt communication for sensory or cognitive needs.",
 comp:"Help a patient participate safely in daily activities at the highest level of independence she can manage. Reassess comfort and function after care and promptly report a new change in cognition or mobility.",
 reflect:"How did you balance Mrs. Bianchi’s wish for independence with her safety? What would you hand off to the next shift?",
 qsen:["Patient-centered care","Safety","Teamwork and collaboration","Informatics"],
 stations:[
 {id:"comm",type:"multi",d:"S",title:"Adapt your communication",
  prompt:"Before you assess Mrs. Bianchi, which adjustments help her hear and understand you? Select all that apply.",
  opts:[{t:"Check that her hearing aid is in and switched on",ok:true},{t:"Make sure she is wearing her glasses",ok:true},{t:"Face her and speak clearly at a lower pitch",ok:true},{t:"Turn off the TV to reduce background noise",ok:true},{t:"Shout so she can hear you",ok:false},{t:"Talk to her daughter instead",ok:false}],
  why:"Sensory aids, face-to-face communication, a lower pitch and a quiet room improve understanding. Shouting distorts speech, and speaking to family instead of the patient undermines her autonomy."},
 {id:"orient",type:"mcq",d:"C",title:"Check orientation",
  prompt:"You ask four questions. She gives her name correctly, says she is “in the hospital,” says it is “March, I think” (it is November), and knows she has been sick with the flu. What is your conclusion?",
  opts:[{t:"Oriented to person, place and situation but not time. This is a change from her baseline, so report it.",ok:true,fb:"Correct. Any new change from baseline cognition needs prompt reporting."},
        {t:"She is fully oriented. Older adults often lose track of the date.",ok:false,fb:"Her baseline is oriented ×4. Assuming this is normal aging can miss delirium."},
        {t:"She is confused and should not make any decisions.",ok:false,fb:"Overstates the finding. She still knows who and where she is and can take part in decisions."},
        {t:"Recheck tomorrow before reporting.",ok:false,fb:"A new change in cognition is reported now, not tomorrow."}],
  why:"Always compare with the patient’s usual orientation. A new disorientation in an older adult who is dehydrated or ill can be an early sign of delirium."},
 {id:"ortho",type:"numeric",d:"S",title:"Orthostatic vital signs",
  prompt:"You measure orthostatic vital signs: lying 132/74 with HR 80, sitting 118/70 with HR 92, standing (after 1 minute) 108/64 with HR 104, and she says she is dizzy. Calculate the changes from lying to standing.",
  fields:[{label:"Drop in systolic BP",ans:24,tol:0,unit:"mmHg"},{label:"Drop in diastolic BP",ans:10,tol:0,unit:"mmHg"},{label:"Increase in heart rate",ans:24,tol:0,unit:"beats/min"}],
  why:"132 to 108 is a 24 mmHg systolic drop and 74 to 64 is a 10 mmHg diastolic drop, with dizziness. A fall of 20 mmHg systolic or 10 mmHg diastolic within 3 minutes of standing meets the usual definition of orthostatic hypotension. Combined with poor intake, this greatly increases her fall risk."},
 {id:"transfer",type:"order",d:"S",title:"Plan a safe transfer",
  prompt:"Put the steps of a safe bed-to-standing transfer in order.",
  items:["Explain the plan and agree on it with Mrs. Bianchi","Lock the bed brakes and lower the bed","Put on her nonskid footwear and glasses","Apply a gait belt","Have her sit on the edge of the bed and ask about dizziness","Stand with the walker while you hold the gait belt","Move to the toilet or commode with assistance"],
  why:"Agreement and explanation come first. The environment and equipment are prepared before she moves, and dangling at the bedside lets you check for dizziness before she bears weight."},
 {id:"decide",type:"mcq",d:"C",title:"The integrated decision",
  prompt:"She sits on the edge of the bed and says, “I’m dizzy, but I really want to walk to the bathroom myself.” What is your best response?",
  opts:[{t:"Let her walk. She is independent at home and it is her choice.",ok:false,fb:"Her current state is not her baseline. Walking now carries a high fall risk."},
        {t:"Tell her she must use a bedpan, without discussion",ok:false,fb:"Safe, but it ignores her preference and dignity."},
        {t:"Help her lie back until the dizziness passes, offer a bedside commode with your assistance so she can still toilet privately, then report the orthostatic findings and poor intake to the RN and document her response",ok:true,fb:"Correct. Safety, her preference for privacy and independence, reporting and documentation in one decision."},
        {t:"Give her the walker and wait outside the bathroom door",ok:false,fb:"Leaves a dizzy, high-risk patient unsupervised."}],
  why:"This is the integrated competency: assessment (dizziness, orthostatic changes, poor intake) informs a safe alternative that still honors her wish to toilet privately, and you close the loop by reporting and documenting."},
 {id:"comfort",type:"multi",d:"K",title:"Comfort and rest",
  prompt:"After toileting she is back in bed and says she slept poorly. Which comfort measures fit the student role? Select all that apply.",
  opts:[{t:"Reposition with pillows for support",ok:true},{t:"Offer a warm blanket",ok:true},{t:"Dim the lights and reduce noise at night",ok:true},{t:"Offer toileting at regular intervals",ok:true},{t:"Apply restraints so she does not get up alone",ok:false},{t:"Keep bright lights on all night so she stays oriented",ok:false}],
  why:"Nonpharmacologic comfort measures support rest and recovery. Restraints increase injury and delirium risk and require specific orders. Bright lights all night disrupt sleep, while a night light and regular toileting reduce unassisted attempts to get up."},
 {id:"handoff",type:"mcq",d:"C",title:"Give a clear handoff",
  prompt:"Which handoff best reports Mrs. Bianchi’s situation to the RN?",
  opts:[{t:"“Mrs. Bianchi was a little dizzy but she’s fine now.”",ok:false,fb:"Vague, with no data or request."},
        {t:"“Situation: Mrs. Bianchi in Bed 9 is newly disoriented to time and dizzy on standing. Background: recovering from flu, eating about 25% of meals for two days, baseline oriented ×4 and independent with a walker. Assessment: BP fell from 132/74 lying to 108/64 standing with HR up from 80 to 104. Request: please assess her, and can we review fluids and fall precautions?”",ok:true,fb:"Correct. Clear SBAR with data, comparison to baseline and a specific request."},
        {t:"“She needs IV fluids right away.”",ok:false,fb:"Jumps to a treatment decision without the supporting data."},
        {t:"“I’ll write it all in my notes for later.”",ok:false,fb:"Delays communication of a new change."}],
  why:"SBAR (situation, background, assessment, request) gives the receiver what they need to act. Compare with baseline and end with a clear request."}
 ]}
];

const GLOSS=[
 ["Nursing process","Assess, diagnose, plan, implement, evaluate. A cycle in which evaluation feeds back into new assessment."],
 ["Baseline","The patient’s own usual values and function. Changes are judged against it, not only against textbook ranges."],
 ["Teach-back","Asking the patient to explain or show what they learned, to check the clarity of your teaching."],
 ["SBAR","Situation, background, assessment, request. A structured way to report and hand off."],
 ["Near miss","An event that could have caused harm but was caught before it reached the patient."],
 ["Two identifiers","Two person-specific details, such as full name and date of birth, checked before every care action."],
 ["Orthostatic hypotension","A fall of 20 mmHg systolic or 10 mmHg diastolic within 3 minutes of standing."],
 ["Work of breathing","The effort needed to breathe, seen in rate, accessory muscle use, flaring and positioning."]
];

const PHASES=[
 ["Assess","Collect subjective and objective data through a focused history, vital signs and observation. Compare findings with the patient’s baseline."],
 ["Diagnose","Cluster the data, name the problem the patient is experiencing, and choose the priority using frameworks such as ABCs and actual-before-risk."],
 ["Plan","Write a measurable, time-bound outcome with the patient as the subject, and select interventions within your role."],
 ["Implement","Carry out the plan safely, communicate with the team, and document what you did and how the patient responded."],
 ["Evaluate","Reassess against the outcome. Continue, revise or escalate. Evaluation becomes the next assessment."]
];

const QSEN=["Patient-centered care","Teamwork and collaboration","Evidence-based practice","Quality improvement","Safety","Informatics"];

/* ---------- helpers ---------- */
function shuffle(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}if(a.every((v,i)=>v===i))a.reverse();return a;}
const near=(f,v)=>Math.abs(v-f.ans)<=(f.tol||0);
const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function labTotals(L){
  const ls=LS(L.id);let sc=0,mx=0,done=0;const dom={K:[0,0],S:[0,0],C:[0,0]};
  L.stations.forEach(st=>{mx+=PTS;dom[st.d][1]+=PTS;const s=ls.st[st.id];if(s){sc+=s.score;done++;dom[st.d][0]+=s.score;}});
  return {sc,mx,done,n:L.stations.length,pct:mx?Math.round(sc/mx*100):0,dom};
}
function rating(t){
  if(t.done===0)return["Not started","var(--muted)"];
  if(t.done<t.n)return["In progress","var(--navy)"];
  if(t.pct>=85)return["Proficient","var(--green-ink)"];
  if(t.pct>=70)return["Developing","var(--amber)"];
  return["Beginning","var(--red)"];
}
function pctOf(a){return a[1]?Math.round(a[0]/a[1]*100):0;}

/* ---------- station types ---------- */
const TYPES={
 mcq:{
  render(st,el,sv){
   let sel=sv?sv.a:null;
   el.innerHTML=`<div class="opts" role="radiogroup" aria-label="Answer choices">${st.opts.map((o,i)=>`<button type="button" class="opt" role="radio" aria-checked="false" data-i="${i}">${o.t}</button>`).join("")}</div>`;
   const b=$$(".opt",el);
   const paint=()=>b.forEach((x,i)=>x.setAttribute("aria-checked",String(i===sel)));
   if(sv){b.forEach((x,i)=>{x.disabled=true;if(st.opts[i].ok){x.classList.add("ok");x.insertAdjacentHTML("beforeend",'<span class="tag">Best answer</span>');}else if(i===sel){x.classList.add("bad");x.insertAdjacentHTML("beforeend",'<span class="tag">Your choice</span>');}});paint();}

function drawSteps(L){
 const ls=LS(L.id),t=labTotals(L);
 $("#steps").innerHTML=`<div class="meter"><b>${t.done} of ${t.n} stations</b><div class="bar"><i style="width:${t.done/t.n*100}%"></i></div><small>Score so far: ${t.sc.toFixed(0)} of ${t.done*PTS||0} points</small></div>
 ${L.stations.map((s,k)=>`<button type="button" class="step ${ls.st[s.id]?"done":""}" data-k="${k}" ${k===cur[L.id]?'aria-current="step"':""}><span class="n">${ls.st[s.id]?"✓":k+1}</span><span>${s.title}</span></button>`).join("")}
 <button type="button" class="step" data-k="${L.stations.length}" ${cur[L.id]===L.stations.length?'aria-current="step"':""}><span class="n">★</span><span>Lab results</span></button>`;
 $$("#steps .step").forEach(b=>b.addEventListener("click",()=>{cur[L.id]=+b.dataset.k;drawSteps(L);drawStationArea(L);const h=$("#stationArea h3, #stationArea h2");if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});}$("#stationArea").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});}));
}

function drawStationArea(L){
 const k=cur[L.id];
 if(k>=L.stations.length){drawResults(L);return;}
 const st=L.stations[k],ls=LS(L.id),sv=ls.st[st.id],T=TYPES[st.type];
 const area=$("#stationArea");
 area.innerHTML=`<article class="station"><header><span class="dom ${st.d}">${DOM[st.d]}</span><h3>${st.title}</h3></header><p class="prompt">${st.prompt}</p><div class="body"></div><div class="actions"></div><div class="fb"></div></article>`;
 const finish=(a)=>{const r=T.grade(st,a);ls.st[st.id]={score:Math.round(r.s*PTS*10)/10,a};ls.updated=Date.now();save();drawSteps(L);drawStationArea(L);const fb=$(".fbcard",area);if(fb){fb.setAttribute("tabindex","-1");fb.focus({preventScroll:false});}};
 const api=T.render(st,$(".body",area),sv,finish);
 const act=$(".actions",area);
 if(sv){
  const r=T.grade(st,sv.a),frac=sv.score/PTS,cls=frac>=1?"full":frac>0?"part":"none";
  $(".fb",area).innerHTML=`<div class="fbcard ${cls}"><div class="score">${frac>=1?"Correct":frac>=.5?"Partly correct":"Not yet"}. ${sv.score} of ${PTS} points.</div>${r.html}<p class="why"><b>Rationale.</b> ${st.why}</p></div>`;
  const last=k===L.stations.length-1;
  act.innerHTML=`<button type="button" class="btn ${last?"go":"primary"}" id="nextBtn">${last?"See lab results":"Next station"}</button>`;
  $("#nextBtn").addEventListener("click",()=>{cur[L.id]=k+1;drawSteps(L);drawStationArea(L);$("#stationArea").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});});
 }else if(!api.auto){
  act.innerHTML=`<button type="button" class="btn primary" id="checkBtn">Check my answer</button><span class="msg" role="status"></span>`;
  $("#checkBtn").addEventListener("click",()=>{const a=api.get();if(a==null){$(".msg",act).textContent=api.msg||"Answer every part before checking.";return;}finish(a);});
 }
}

function kscHTML(t){return`<div class="ksc">${["K","S","C"].map(d=>`<div>${DOM[d]}<b>${pctOf(t.dom[d])}%</b><div class="mini"><i style="width:${pctOf(t.dom[d])}%;background:${d==="K"?"var(--navy)":d==="S"?"var(--green)":"var(--amber)"}"></i></div></div>`).join("")}</div>`;}

function drawResults(L){
 const t=labTotals(L),r=rating(t),ls=LS(L.id);
 const area=$("#stationArea");
 if(t.done<t.n){
  area.innerHTML=`<div class="result"><h2>Lab results</h2><p>You have completed ${t.done} of ${t.n} stations. Finish the remaining stations to receive a competency rating.</p><button type="button" class="btn primary" id="resume">Go to the next open station</button></div>`;
  $("#resume").addEventListener("click",()=>{cur[L.id]=firstOpen(L);drawSteps(L);drawStationArea(L);});return;
 }
 area.innerHTML=`<div class="result"><h2>Lab ${L.n} results</h2>
  <div class="big">${t.pct}%</div><p style="font-weight:700;color:${r[1]}">${r[0]}</p>
  ${kscHTML(t)}
  <p class="sub">Proficient is 85% or higher, Developing is 70 to 84%, and Beginning is below 70%. Attempt ${ls.attempts}.</p>
  <label class="refl" style="display:block;margin:1rem 0"><span style="font-weight:700;display:block;margin-bottom:.3rem">Reflection: ${L.reflect}</span><textarea id="lr" placeholder="Write a few sentences.">${ls.reflection?ls.reflection.replace(/</g,"&lt;"):""}</textarea><span class="saved" id="lrs"></span></label>
  <div class="btnrow">${L.n<5?`<a class="btn primary" href="#lab${L.n+1}">Start Lab ${L.n+1}</a>`:""}<a class="btn go" href="#dashboard">Open my dashboard</a><button type="button" class="btn" id="retry">Retry this lab</button></div></div>`;
 let to;$("#lr").addEventListener("input",e=>{ls.reflection=e.target.value;save();clearTimeout(to);$("#lrs").textContent="Saved";to=setTimeout(()=>{$("#lrs").textContent="";},1400);});
 $("#retry").addEventListener("click",()=>{if(!confirm("Clear your answers for this lab and start again? Your reflection is kept."))return;ls.st={};ls.attempts++;ls.updated=Date.now();save();cur[L.id]=0;renderLab(L);});
}

function renderDash(){
 const tots=LABS.map(labTotals);
 const sc=tots.reduce((a,t)=>a+t.sc,0),mx=tots.reduce((a,t)=>a+t.mx,0),done=tots.reduce((a,t)=>a+t.done,0),n=tots.reduce((a,t)=>a+t.n,0);
 const pct=mx?Math.round(sc/mx*100):0;
 const R=86,C=2*Math.PI*R;
 const dom={K:[0,0],S:[0,0],C:[0,0]};tots.forEach(t=>["K","S","C"].forEach(d=>{dom[d][0]+=t.dom[d][0];dom[d][1]+=t.dom[d][1];}));
 const qs=QSEN.map(q=>LABS.map((L,i)=>{if(!L.qsen.includes(q))return"";const t=tots[i];return t.done===t.n&&t.pct>=85?"full":t.done?"half":"empty";}));
 app.innerHTML=`<section class="sec"><div class="wrap">
  <h1 style="font-size:clamp(1.8rem,4vw,2.6rem)">Competency dashboard</h1>
  <p class="sub measure">Your record of knowledge, skill and clinical judgment across the five labs. Results are saved in this browser only.</p>
  <div class="dash-top">
   <div class="donut"><svg width="200" height="200" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="18"/><circle cx="100" cy="100" r="${R}" fill="none" stroke="var(--green)" stroke-width="18" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/></svg><div class="lbl"><div><b>${pct}%</b><small>of all points</small></div></div></div>
   <div>
    <label class="namefield">Student name<input type="text" id="sname" value="${(S.student||"").replace(/"/g,"&quot;")}" placeholder="Type your name for the printed record" autocomplete="name"></label>
    <p style="margin:.2rem 0 .6rem"><b>${done} of ${n}</b> stations completed across ${tots.filter(t=>t.done===t.n).length} of 5 finished labs.</p>
    ${kscHTML({dom})}
    <div class="btnrow no-print"><button type="button" class="btn primary" id="printBtn">Print my record</button><button type="button" class="btn" id="resetBtn">Reset all progress</button></div>
   </div>
  </div>

  <div class="labrows">${LABS.map((L,i)=>{const t=tots[i],r=rating(t),ls=LS(L.id);return`
   <div class="labrow" style="--lc:${L.color}">
    <div><h3>Lab ${L.n}: ${L.short}</h3><div class="sub">${t.done} of ${t.n} stations${ls.updated?` · updated ${new Date(ls.updated).toLocaleDateString()}`:""}${ls.attempts>1?` · attempt ${ls.attempts}`:""}</div></div>
    <div><div style="display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:.3rem"><span class="rating" style="color:${r[1]}">${r[0]}</span><b>${t.done?t.pct+"%":"–"}</b></div><div class="pbar"><i style="width:${t.pct}%"></i></div></div>
    <div class="dmini">${["K","S","C"].map(d=>`<div><span>${DOM[d]}</span><span class="mini"><i style="width:${pctOf(t.dom[d])}%;background:${d==="K"?"var(--navy)":d==="S"?"var(--green)":"var(--amber)"}"></i></span><span>${pctOf(t.dom[d])}%</span></div>`).join("")}</div>
    <a class="btn no-print" href="#${L.id}">${t.done===0?"Start":t.done<t.n?"Continue":"Review"}</a>
   </div>`;}).join("")}</div>
 </div></section>

 <section class="sec"><div class="wrap">
  <h2>QSEN competency map</h2>
  <p class="sub measure">Each lab practices several of the six QSEN competencies. A competency fills in when you reach Proficient on a lab that practices it.</p>
  <div class="tblwrap"><table class="matrix"><thead><tr><th scope="col">Competency</th>${LABS.map(L=>`<th scope="col">Lab ${L.n}</th>`).join("")}</tr></thead><tbody>
  ${QSEN.map((q,qi)=>`<tr><th scope="row" style="text-align:left;font-weight:600">${q}</th>${qs[qi].map(c=>`<td>${c?`<span class="dot ${c==="full"?"full":c==="half"?"half":""}" role="img" aria-label="${c==="full"?"Proficient":c==="half"?"In progress or below proficient":"Not started"}"></span>`:'<span class="sub" aria-label="Not practiced in this lab">·</span>'}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div>
  <div class="legend"><span><span class="dot full"></span>Proficient</span><span><span class="dot half"></span>In progress or below 85%</span><span><span class="dot"></span>Not started</span><span>· Not practiced in that lab</span></div>
 </div></section>

 <section class="sec"><div class="wrap">
  <h2>Reflection journal</h2>
  <p class="sub measure">Reflections save as you type and appear on your printed record.</p>
  <div class="refl">${LABS.map(L=>`<label>Lab ${L.n}: ${L.reflect}<textarea data-l="${L.id}" placeholder="Write a few sentences.">${(LS(L.id).reflection||"").replace(/</g,"&lt;")}</textarea><span class="saved" data-s="${L.id}"></span></label>`).join("")}</div>
 </div></section>`;
 $("#sname").addEventListener("input",e=>{S.student=e.target.value;save();});
 $$(".refl textarea").forEach(ta=>{let to;ta.addEventListener("input",()=>{LS(ta.dataset.l).reflection=ta.value;save();const s=$(`[data-s="${ta.dataset.l}"]`);s.textContent="Saved";clearTimeout(to);to=setTimeout(()=>{s.textContent="";},1400);});});
 $("#printBtn").addEventListener("click",()=>window.print());
 $("#resetBtn").addEventListener("click",()=>{if(!confirm("Erase all lab results and reflections in this browser?"))return;S={student:"",labs:{}};save();Object.keys(cur).forEach(k=>delete cur[k]);renderDash();});
}

/* ---------- router ---------- */
function route(){
 const h=location.hash.replace("#","");
 const L=LABS.find(x=>x.id===h);
 const v=L?h:(h==="dashboard"?"dashboard":"home");
 setNav(v);
 if(L){renderLab(L);document.title=`Lab ${L.n}: ${L.short} · Nursing Concepts Lab`;}
 else if(v==="dashboard"){renderDash();document.title="Dashboard · Nursing Concepts Lab";}
 else{renderHome();document.title="Nursing Concepts Virtual Lab";}
 window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
})();
</script>
</body>
</html>
